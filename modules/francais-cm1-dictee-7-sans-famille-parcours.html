function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function others(list,not,n){return shuffle(list.filter(x=>x!==not)).slice(0,n);}
// Une question à choix : choices = liste de C(valeur, libellé, pourquoi c'est faux) ; correct = la valeur juste.
function Q(skill,level,prompt,choices,correct,hint,explain){
  return {skill,level,prompt,choices:shuffle(choices.slice()),exp:{c:correct},hint,explain};
}
const C=(v,label,why)=>({v:String(v),label,why:why||''});
// Une question « à écrire » (décision D15). Correction stricte sur les lettres et les accents,
// souple sur les majuscules, les espaces en trop et la forme de l'apostrophe.
const norm=s=>String(s).normalize('NFC').replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim().toLowerCase();
function W(skill,level,prompt,ok,erreurs,hint,explain){
  return {skill,level,prompt,choices:[],write:{ok:ok.map(String),erreurs:erreurs||{}},exp:{c:String(ok[0])},hint,explain};
}
function judgeWrite(q,rep){
  const r=norm(rep);
  if(q.write.ok.some(x=>norm(x)===r))return {ok:true};
  for(const k in q.write.erreurs)if(norm(k)===r)return {ok:false,why:q.write.erreurs[k]};
  const sans=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(q.write.ok.some(x=>sans(norm(x))===sans(r)))return {ok:false,why:'Les lettres sont bonnes : regarde bien les <b>accents</b>.'};
  return {ok:false,why:'Ce n’est pas la bonne orthographe.'};
}

  {id:'triomphale',m:'triomphale',nat:'adjectif',ex:'une entrée triomphale',dev:"Elle ressemble à une grande victoire.",
   tip:"trio<b>mph</b>ale : « mph » pour le son « f », et un e à la fin (une entrée triomphale).",
   faux:[['triomphal',"Ici le mot « entrée » est féminin : on ajoute un <b>e</b> à la fin, triomphal<b>e</b>."],['triomfale',"Le son « f » s'écrit <b>ph</b> : trio<b>mph</b>ale."],['triomphalle',"Un seul <b>l</b> : triomphale."],['trionphale',"Il y a un <b>m</b> devant « ph » : trio<b>m</b>phale."]]},
  {id:'meilleur',m:'meilleur',nat:'adjectif',ex:'un meilleur ami',dev:"C'est plus bon que tous les autres : le contraire de pire.",
   tip:"mei<b>ll</b>eur : deux l (un meilleur ami, sans e ni s).",
   faux:[['meilleure',"Ici « ami » est masculin et singulier : on écrit meilleur, sans e."],['meilleurs',"« un ami » : un seul ami, donc pas de s : meilleur."],['meileur',"Il y a deux <b>l</b> : mei<b>ll</b>eur."],['meillieur',"La fin s'écrit <b>eur</b>, sans i : meill<b>eur</b>."],['mailleur',"Le début s'écrit <b>mei</b> : m<b>ei</b>lleur."]]},
  {id:'precieux',m:'précieux',nat:'adjectif',ex:'un bijou précieux',dev:"Il a beaucoup de valeur, comme un bijou.",
   tip:"pr<b>é</b><b>c</b>ieu<b>x</b> : un accent aigu, un c devant i, et un x muet.",
   faux:[['précieu',"Il y a un <b>x</b> muet à la fin : précieu<b>x</b>."],['presieux',"Le son « s » s'écrit <b>c</b> devant i : pré<b>c</b>ieux."],['précieus',"La fin s'écrit <b>eux</b> : préci<b>eux</b>."],['precieux',"Il faut un accent aigu : pr<b>é</b>cieux."]]},
  {id:'grand',m:'grand',nat:'adjectif',ex:'un grand singe',dev:"C'est le contraire de petit.",
   tip:"gran<b>d</b> : un d muet à la fin (pense à « grande »).",
   faux:[['gran',"Il y a un <b>d</b> muet à la fin : gran<b>d</b>. Pense à « grande »."],['grant',"La lettre muette est un <b>d</b> : gran<b>d</b>. Pense à « grande »."],['grend',"Le son « an » s'écrit <b>an</b> : gr<b>an</b>d."]]},
  {id:'furieux',m:'furieux',nat:'adjectif',ex:'un chien furieux',dev:"Il est très très en colère.",
   tip:"fur<b>i</b>eu<b>x</b> : un i, et un x muet à la fin.",
   faux:[['furieu',"Il y a un <b>x</b> muet à la fin : furieu<b>x</b>."],['furieus',"La fin s'écrit <b>eux</b> : furi<b>eux</b>."],['furrieux',"Un seul <b>r</b> : fu<b>r</b>ieux."],['fureux',"Il y a un <b>i</b> : fur<b>i</b>eux."],
         ['furie',"« furie » est un nom. Ici il faut un adjectif, qui dit comment est le chien : furieux."]]},
  {id:'toujours',m:'toujours',nat:'invariable',dev:"C'est le contraire de jamais.",
   tip:"toujour<b>s</b> : « jour » dedans, et un s muet à la fin.",
   faux:[['toujour',"Il y a un <b>s</b> muet à la fin : toujour<b>s</b>."],['toujous',"Il y a un <b>r</b> : tou<b>jour</b>s. Pense à « jour »."],['toujourt',"La lettre muette est un <b>s</b> : toujour<b>s</b>."]]},
  {id:'tandis',m:'tandis que',nat:'invariable',dev:"Ces deux mots veulent dire « pendant que ».",
   tip:"tandi<b>s</b> <b>que</b> : deux mots, avec un s muet à la fin de « tandis ».",
   faux:[['tandis qu',"Il faut un <b>e</b> à la fin : tandis qu<b>e</b>."],['tandi que',"Il y a un <b>s</b> muet à la fin de tandis : tandi<b>s</b>."],['tendis que',"Le son « an » s'écrit <b>an</b> : t<b>an</b>dis."],['tandisque',"Ce sont deux mots séparés : tandis <b>que</b>."]]}
];
/*FIN DATA*/
NOMS.forEach(w=>{w.nat='nom';w.skill='noms';});
VERBES.forEach(w=>{w.skill='verbes';});
MOTS.forEach(w=>{w.skill='mots';});
const POOL={noms:NOMS,verbes:VERBES,mots:MOTS};
const TOUS=NOMS.concat(VERBES,MOTS);   // les 24 mots : chacun est posé à chaque passe
const pluriel=w=>w.m.indexOf(' ')>=0;
const label=w=>w.nat==='nom'?`${w.det} ${w.m}`:w.m;
const cadre=w=>w.ex?`<p class="big-s">${esc(w.ex).replace(esc(w.m),'<span class="blank">______</span>')}</p>`:'';
const devinette=w=>`<p><b>Devinette :</b> ${w.dev}</p>${cadre(w)}`;
const fautesMot=w=>{const e={};w.faux.forEach(f=>{e[f[0]]=f[1];});return e;};
const correction=w=>`<p>Le mot : <b class="big-s">${label(w)}</b></p><p>${w.tip}</p>`;

/* ================= CONTENU : les deux sortes de question ================= */
// Étape 1 (niveau 1) : relier la devinette au mot, parmi 4 mots de la dictée de la même famille.
// Seuls des mots bien écrits sont montrés. Un mauvais choix rappelle ce que ce mot-là veut dire.
function mkQcm(w){
  const pool=POOL[w.skill],autres=others(pool,w,3);
  const ch=[C(w.m,label(w))].concat(autres.map(x=>C(x.m,label(x),`Ce n'est pas ce mot-là. <b>${label(x)}</b> : ${x.dev}`)));
  return Q(w.skill,1,`${devinette(w)}<p>Quel est le mot ?</p>`,ch,w.m,'<p>Relis la devinette.</p>',correction(w));
}
// Étape 2 (niveau 2) : écrire le mot, sans aide.
function mkEcrire(w){
  const ok=w.ok||(w.det?[w.m,`${w.det} ${w.m}`]:[w.m]);
  const verbe=w.nat==='verbe'?' (à l’infinitif)':'';
  const clavier=w.id==='oeil'?`<p class="small">Sur l'iPhone, appuie longtemps sur le o pour trouver œ (« oe » en deux lettres est accepté).</p>`:'';
  return W(w.skill,2,`${devinette(w)}<p>Écris ${pluriel(w)?'les mots':'le mot'} de la dictée${verbe}.</p>${clavier}`,ok,fautesMot(w),'<p>Écris le mot sans aide.</p>',correction(w));
}
const mk=(w,lv)=>lv===1?mkQcm(w):mkEcrire(w);

// Clés = ids des compétences de la fiche. Un générateur par compétence (pour le tirage automatique
// de tools/tirage.py) ; le parcours, lui, pose chaque mot de la liste.
const SKILLS={noms:{label:'Écrire les noms'},verbes:{label:'Écrire les verbes'},mots:{label:'Écrire les adjectifs et les petits mots'}};
const GEN={noms:lv=>mk(pick(NOMS),lv),verbes:lv=>mk(pick(VERBES),lv),mots:lv=>mk(pick(MOTS),lv)};
const LEVELS={1:{t:'Choisir',d:'relier la devinette au mot'},2:{t:'Écrire',d:'écrire le mot sans aide'}};
const ETAPES=[
  {k:'qcm',t:'Choisir le mot',court:'Choisir',lvl:1,
   intro:'Pour chaque devinette, choisis le bon mot parmi quatre.'},
  {k:'ecrit',t:'Écrire le mot',court:'Écrire',lvl:2,
   intro:'Maintenant, tu écris chaque mot toi-même, sans aide. Garde bien en tête les devinettes.'}
];

/* ================= MOTEUR : suivi miniprof (à garder tel quel) ================= */
const app=document.getElementById('app');
/* Les réponses vont dans le journal de l'enfant par ../js/suivi.js ; le bilan est celui de miniprof.
   Sans miniprof (page ouverte ailleurs), on révise sans rien garder. */
const secs=q=>q.t0?Math.round((Date.now()-q.t0)/1000):0;
// Chaque réponse de chaque passe est un premier essai : il n'y a pas de deuxième essai dans ce parcours.
// question = « étape-mot » (ex. « qcm-singe », « ecrit-singe »), difficulté = l'étape (1 choisir, 2 écrire).
function record(q,ok,rep,w){
  if(window.miniprof)window.miniprof.reponse({competence:q.skill,juste:ok,mode:'e',difficulte:q.level,question:ETAPES[q.level-1].k+'-'+w.id,reponse:rep==null?null:rep,duree:secs(q)});
}
let S={screen:'home'};      // écran courant (question en cours, choix, mot tapé)
let P=null;                 // le parcours : étape, passe, mots restants, fautes
function show(html){app.innerHTML=html;window.scrollTo(0,0);}
function topbar(title,backAct){
  return `<div class="topbar"><div class="topbar-in"><button class="back" data-act="${backAct||'home'}">← Quitter</button><span class="ttl">${title}</span></div></div>`;
}

/* ================= MOTEUR : le parcours (choisir, puis écrire, passe après passe) ================= */
// Une étape = des passes. La passe 1 pose les 24 mots (un par question, dans le désordre) ; chaque
// passe suivante ne repose que les mots ratés à la passe d'avant. L'étape est finie quand une passe
// se termine sans aucune faute. Puis vient l'étape suivante, puis le bilan.
function home(){
  S={screen:'home'};P=null;
  show(`<section class="hero"><div class="hero-in">
      <h1>Dictée 7 : Sans famille (2)</h1>
      <p>Les ${TOUS.length} mots à savoir, en deux étapes.</p>
    </div></section>
    <main class="wrap">
      <div class="card">
        <p><b>Étape 1 :</b> une devinette, tu choisis le bon mot.</p>
        <p><b>Étape 2 :</b> une devinette, tu écris le mot toi-même.</p>
        <p class="small">Chaque étape recommence avec les mots ratés, jusqu'à une passe sans faute.</p>
      </div>
      <div class="btns"><button class="btn primary" data-act="start" data-primary>Commencer</button></div>
    </main>`);
}
function start(){
  P={stage:0,pass:1,queue:shuffle(TOUS.slice()),i:0,fautes:[],errs:{},passes:[0,0],t0:Date.now()};
  stageIntro();
}
function stageIntro(){
  const e=ETAPES[P.stage];
  S={screen:'intro'};
  show(`${topbar('Étape '+(P.stage+1)+' sur '+ETAPES.length)}<main class="wrap">
    <h2>Étape ${P.stage+1} : ${e.t}</h2>
    <div class="card"><p>${e.intro}</p><p class="small">${P.queue.length} mot${P.queue.length>1?'s':''} à voir.</p></div>
    <div class="btns"><button class="btn primary" data-act="ask" data-primary>C'est parti</button></div></main>`);
}
function ask(){
  const w=P.queue[P.i],e=ETAPES[P.stage];
  const q=mk(w,e.lvl);
  S={screen:'q',q,w,choice:null,done:false};
  let d='';for(let i=0;i<P.queue.length;i++)d+=`<i class="${i<P.i?'done':i===P.i?'cur':''}"></i>`;
  show(`${topbar('Étape '+(P.stage+1)+' : '+e.court)}<main class="wrap qwrap">
    <div class="dots" aria-hidden="true">${d}</div>
    <p class="small">Passe ${P.pass}${P.pass>1?' (les mots à revoir)':''} · mot ${P.i+1} sur ${P.queue.length}</p>
    <div class="card"><div class="q-prompt">${q.prompt}</div>
      ${q.write
        ?`<div class="write"><input id="rep" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="Ta réponse" placeholder="Écris le mot"></div>`
        :`<div class="choices">${q.choices.map(c=>`<button class="choice" data-act="choose" data-v="${esc(c.v)}">${c.label}</button>`).join('')}</div>`}</div>
    <div id="fb"></div>
    <div class="btns"><span id="acts" class="acts"><button class="btn primary" id="ok" data-act="check" data-primary hidden>Valider</button></span></div>
    <div class="sigbar"><div id="sig"></div><button class="btn sigbtn" data-act="sig">⚑ Une erreur ?</button></div></main>`);
  q.t0=Date.now();
}
function aReponse(){
  const i=document.getElementById('rep');
  return i?!!norm(i.value):!!S.choice;
}
function majValider(){const b=document.getElementById('ok');if(b&&!S.done)b.hidden=!aReponse();}
function check(){
  if(S.done)return;
  const q=S.q,w=S.w;
  let ok,rep,v=null;
  if(q.write){
    const i=document.getElementById('rep');rep=i?i.value.slice(0,60):'';
    if(!norm(rep)){document.getElementById('fb').innerHTML='<div class="fb hint">Écris ta réponse.</div>';return;}
    v=judgeWrite(q,rep);ok=v.ok;
  }else{
    if(!S.choice){document.getElementById('fb').innerHTML='<div class="fb hint">Choisis une réponse.</div>';return;}
    rep=S.choice;ok=rep===q.exp.c;
  }
  S.done=true;
  record(q,ok,rep,w);
  if(!ok){P.fautes.push(w);P.errs[w.id]=(P.errs[w.id]||0)+1;}
  // on verrouille la saisie et on montre la correction (aussi quand c'est juste : l'astuce du mot)
  const inp=document.getElementById('rep');
  if(inp){inp.disabled=true;inp.classList.add(ok?'good':'bad');}
  app.querySelectorAll('.choice').forEach(c=>{c.classList.add('locked');c.disabled=true;
    if(c.dataset.v===q.exp.c)c.classList.add('good');else if(c.dataset.v===rep)c.classList.add('bad');});
  let why='';
  if(!ok){
    if(q.write)why=`<p>Tu as écrit : <b>${esc(rep)}</b>. ${v.why}</p>`;
    else{const c=q.choices.find(c=>c.v===rep);why=c&&c.why?`<p>${c.why}</p>`:'';}
  }
  const dernier=P.i>=P.queue.length-1;
  document.getElementById('fb').innerHTML=ok
    ?`<div class="fb good"><p><b>Bravo !</b></p>${q.explain}</div>`
    :`<div class="fb bad"><p><b>Pas tout à fait.</b></p>${why}</div><div class="fb info">${q.explain}<p class="small">Ce mot reviendra à la prochaine passe.</p></div>`;
  document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>${dernier?'Voir le résultat de la passe':'Mot suivant'}</button>`;
}
function next(){
  P.i++;
  if(P.i<P.queue.length)ask();else endPass();
}
function endPass(){
  const e=ETAPES[P.stage],n=P.queue.length,f=P.fautes;
  P.passes[P.stage]++;
  S={screen:'pass'};
  const liste=f.map(w=>label(w)).join(' · ');
  if(f.length===0){
    const fin=P.stage===ETAPES.length-1;
    show(`${topbar('Étape '+(P.stage+1)+' : '+e.court)}<main class="wrap">
      <div class="card center"><div class="score">${n}<span style="font-size:1.6rem;color:var(--muted)"> / ${n}</span></div>
        <p style="margin-top:10px"><b>Passe sans faute !</b> ${fin?"Tous les mots sont écrits sans aide.":"Tu as relié chaque devinette à son mot."}</p></div>
      <div class="btns"><button class="btn primary" data-act="${fin?'final':'nextStage'}" data-primary>${fin?'Voir mon bilan':"Passer à l'étape "+(P.stage+2)}</button></div></main>`);
    return;
  }
  show(`${topbar('Étape '+(P.stage+1)+' : '+e.court)}<main class="wrap">
    <div class="card center"><div class="score">${n-f.length}<span style="font-size:1.6rem;color:var(--muted)"> / ${n}</span></div>
      <p style="margin-top:10px">Il reste <b>${f.length} mot${f.length>1?'s':''}</b> à revoir.</p></div>
    <div class="rulebox"><p class="small" style="margin-top:0">À revoir :</p><p class="big-s" style="margin-bottom:0">${liste}</p></div>
    <div class="btns"><button class="btn primary" data-act="again" data-primary>Revoir ${f.length>1?'ces mots':'ce mot'}</button></div></main>`);
}
function again(){
  P.pass++;P.queue=shuffle(P.fautes.slice());P.fautes=[];P.i=0;ask();
}
function nextStage(){
  P.stage++;P.pass=1;P.queue=shuffle(TOUS.slice());P.i=0;P.fautes=[];
  stageIntro();
}
function final(){
  S={screen:'final'};
  const duree=Math.round((Date.now()-P.t0)/1000);
  const dur=TOUS.filter(w=>P.errs[w.id]).sort((a,b)=>P.errs[b.id]-P.errs[a.id]);
  const aSavoir=dur.length
    ?`<h2 style="margin:16px 0 6px">Les mots qui t'ont résisté</h2><div class="rulebox"><p class="big-s" style="margin:0">${dur.map(w=>label(w)+(P.errs[w.id]>1?` (${P.errs[w.id]} fautes)`:'')).join(' · ')}</p></div>`
    :`<p>Aucune faute du début à la fin : bravo !</p>`;
  show(`${topbar('Bilan','home')}<main class="wrap">
    <div class="card center"><div class="score">${TOUS.length}<span style="font-size:1.6rem;color:var(--muted)"> mots</span></div>
      <p style="margin-top:10px"><b>Tu sais écrire les ${TOUS.length} mots de la dictée.</b></p>
      <p class="small">Étape 1 : ${P.passes[0]} passe${P.passes[0]>1?'s':''} · Étape 2 : ${P.passes[1]} passe${P.passes[1]>1?'s':''} · ${Math.floor(duree/60)} min ${duree%60} s</p></div>
    ${aSavoir}
    <div class="btns"><button class="btn primary" data-act="bilan" data-primary>Mon bilan</button><button class="btn" data-act="start">Recommencer</button><button class="btn ghost" data-act="home">Accueil</button></div></main>`);
}

/* ================= MOTEUR : signaler un problème ================= */
// Bouton « Une erreur ? » : l'enfant confirme (Oui / Non), puis miniprof garde une copie de la question
// (énoncé, choix, réponse attendue, réponse donnée) avec un commentaire facultatif.
const txt=h=>{const d=document.createElement('div');d.innerHTML=h==null?'':h;return d.textContent.replace(/\s+/g,' ').trim();};
function sigAsk(){
  document.getElementById('sig').innerHTML=`<div class="fb info"><p><b>Tu penses qu'il y a une erreur dans cette question ?</b></p>
    <div class="btns"><button class="btn primary" data-act="sigyes">Oui, signaler</button><button class="btn" data-act="signo">Non</button></div></div>`;
}
function sigYes(){
  const q=S.q||{},ch=q.choices||[],zone=document.getElementById('sig');
  const lab=v=>{const c=ch.find(c=>c.v===v);return c?(txt(c.label)||'(image)'):'';};
  const champ=document.getElementById('rep');
  const att=q.write?String(q.write.ok[0]):(q.exp&&q.exp.c!==undefined?lab(q.exp.c):'');
  const id=window.miniprof?window.miniprof.signaler({enonce:txt(q.prompt),choix:ch.map(c=>txt(c.label)||'(image)'),
    attendue:att,reponse:champ?champ.value:(S.choice?lab(S.choice):'')}):null;
  zone.innerHTML=id
    ?`<div class="fb good"><p><b>Merci !</b> Un adulte va vérifier cette question.</p>
      <div style="margin:10px 0"><input id="sigtxt" style="width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)" type="text" maxlength="300" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Tu veux dire pourquoi ?" placeholder="Tu veux dire pourquoi ? (facultatif)"></div>
      <div class="btns"><button class="btn" data-act="sigsend" data-id="${esc(id)}">Envoyer</button></div></div>`
    :`<div class="fb bad"><p>Le signalement n'a pas pu être enregistré.</p></div>`;
}
function sigSend(el){
  const t=document.getElementById('sigtxt'),zone=document.getElementById('sig');
  if(t&&t.value.trim()&&window.miniprof)window.miniprof.commenter(el.dataset.id,t.value);
  zone.innerHTML='<div class="fb good"><p>Merci, c\'est noté.</p></div>';
}

/* ================= MOTEUR : bilan (celui de miniprof) ================= */
function bilan(){
  const m=window.miniprof;
  if(m)location.href=m.racine+'#/module/'+encodeURIComponent(m.module)+'/bilan';
}

/* ================= MOTEUR : actions ================= */
function act(a,el){
  switch(a){
    case 'home':home();break;
    case 'start':start();break;
    case 'ask':ask();break;
    case 'choose':if(S.done)break;S.choice=el.dataset.v;app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c===el));majValider();break;
    case 'check':check();break;
    case 'next':next();break;
    case 'again':again();break;
    case 'nextStage':nextStage();break;
    case 'final':final();break;
    case 'sig':sigAsk();break;
    case 'signo':document.getElementById('sig').innerHTML='';break;
    case 'sigyes':sigYes();break;
    case 'sigsend':sigSend(el);break;
    case 'bilan':bilan();break;
    default:break;
  }
}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t);});
// un mot tapé = une proposition : « Valider » apparaît
app.addEventListener('input',e=>{if(e.target.id==='rep')majValider();});
// touche Entrée (« OK » du clavier de l'iPhone) dans le champ de réponse = bouton principal
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rep'){e.preventDefault();const b=app.querySelector('[data-primary]');if(b&&!b.hidden)b.click();}});

// Tirage automatique (tools/tirage.py) : la page donne ses générateurs au lieu de s'afficher.
// window.__miniprofTirage n'existe que dans l'outil, jamais dans un navigateur.
if(window.__miniprofTirage){window.__miniprofTirage({GEN,LEVELS,LEARN:[],SKILLS,EVAL_SKILLS:[]});return;}
home();

})();
</script>
<script type="module" src="../js/suivi.js"></script>
</body>
</html>
