<script>
(function(){
'use strict';
/* ================= MOTEUR : utilitaires ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[R(0,arr.length-1)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
// n éléments distincts de la liste, sans celui à exclure
function others(list,not,n){return shuffle(list.filter(x=>x!==not)).slice(0,n);}
// Une question : prompt et libellés en HTML écrit dans ce script (sinon passer par esc()).
// choices : liste de C(valeur, libellé, pourquoi c'est faux) ; correct : la valeur juste.
function Q(skill,level,prompt,choices,correct,hint,explain){
  return {skill,level,prompt,choices:shuffle(choices.slice()),exp:{c:correct},hint,explain};
}
const C=(v,label,why)=>({v:String(v),label,why:why||''});
// Une question « à écrire » (décision D15) : l'enfant tape sa réponse au lieu de la choisir.
// Pourquoi : pour l'orthographe et la conjugaison, reconnaître le bon mot parmi des choix ne
// suffit pas, il faut l'écrire (« son » au lieu de « sont » a résisté à un module en QCM).
// ok : réponses acceptées (la première est montrée en correction) ; erreurs : {faute prévue : pourquoi}.
// Correction stricte sur les lettres, les accents, le trait d'union ; souple sur les majuscules,
// les espaces en trop et la forme de l'apostrophe (’ ou ').
const norm=s=>String(s).normalize('NFC').replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim().toLowerCase();
function W(skill,level,prompt,ok,erreurs,hint,explain){
  return {skill,level,prompt,choices:[],write:{ok:ok.map(String),erreurs:erreurs||{}},exp:{c:String(ok[0])},hint,explain};
}
function judgeWrite(q,rep){
  const r=norm(rep);
  if(q.write.ok.some(x=>norm(x)===r))return {ok:true};
  for(const k in q.write.erreurs)if(norm(k)===r)return {ok:false,why:q.write.erreurs[k]};
  const sans=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(q.write.ok.some(x=>sans(norm(x))===sans(r)))return {ok:false,why:'Les lettres sont bonnes : regarde bien les <b>accents</b>.'};
  return {ok:false,why:'Ce n’est pas la bonne orthographe. Relis ton mot lettre par lettre.'};
}

/* ================= CONTENU : les banques de questions ================= */
// Physique-chimie 6e, chapitre 2 « Transmission d'un signal ». Toutes les questions sont à choix (QCM).
// Une banque par compétence et par niveau : I(énoncé, bonne réponse, [[mauvais choix, pourquoi], …], explication, indice).
// Le générateur tire une question de la banque, garde 3 mauvais choix au hasard, et mélange. (Pas de nombre
// à tirer : les notions du cours sont des faits ; le moteur évite de reposer la même question.)
const I=(p,g,b,e,h)=>({p,g,b,e,h});

// Morse (exemple du cours) : 1 = lampe allumée, 0 = lampe éteinte. Suite tirée au hasard, 4 valeurs, avec
// au moins un 0 et un 1. Les 3 faux choix : tout inversé, ou une seule valeur changée (à deux endroits
// différents) : ils sont tous différents de la bonne suite et entre eux.
function morse(versNombres){
  return function(){
    let s;do{s=[R(0,1),R(0,1),R(0,1),R(0,1)];}while(s.indexOf(0)<0||s.indexOf(1)<0);
    const lamp=a=>a.map(v=>v?'allumée':'éteinte').join(' – '),nb=a=>a.join(' ');
    const fmt=versNombres?nb:lamp,src=versNombres?lamp:nb;
    const p=shuffle([0,1,2,3]),chg=k=>s.map((v,i)=>i===k?1-v:v);
    const inv=[fmt(s.map(v=>1-v)),"Tu as échangé les deux valeurs : 1 est une lampe <b>allumée</b>, 0 une lampe <b>éteinte</b>."];
    const f=k=>[fmt(chg(k)),"Compare les valeurs une par une : la valeur n° "+(k+1)+" ne correspond pas."];
    return I(versNombres
        ?"Dans l'exemple du cours (le morse), 1 est une lampe allumée et 0 une lampe éteinte. La lampe est : <b>"+src(s)+"</b>. Quelle suite de 0 et de 1 code ce signal ?"
        :"Dans l'exemple du cours (le morse), 1 est une lampe allumée et 0 une lampe éteinte. Le signal est : <b>"+src(s)+"</b>. Que fait la lampe ?",
      fmt(s),[inv,f(p[0]),f(p[1])],
      "Valeur par valeur : "+s.map(v=>v?'1 = allumée':'0 = éteinte').join(' ; ')+".",
      "<p>1 : lampe allumée. 0 : lampe éteinte. Avance valeur par valeur.</p>");
  };
}

const BANQUE={
signal:{
1:[
 I("Un signal sert à transporter :","une information codée",[["un objet","Un signal ne déplace pas d'objet : il transporte une information."],["de la matière","Un signal ne transporte pas de matière : il transporte une information."],["un son seulement","Un son est un exemple de signal, mais la lumière et les ondes radio en sont aussi."]],"Un signal (un son, de la lumière…) transporte une <b>information</b> codée."),
 I("Comment s'appelle la source qui envoie le signal ?","l'émetteur",[["le récepteur","Le récepteur <b>reçoit</b> le signal."],["le milieu de propagation","Le milieu de propagation, c'est ce que le signal traverse, entre l'émetteur et le récepteur."],["le code","Le code est la façon d'écrire l'information, pas la source du signal."]],"La source du signal s'appelle l'<b>émetteur</b>."),
 I("Comment s'appelle celui qui reçoit le signal (son destinataire) ?","le récepteur",[["l'émetteur","L'émetteur est la source qui <b>envoie</b> le signal."],["le milieu de propagation","Le milieu de propagation, c'est ce que le signal traverse."],["le signal","Le signal est ce qui voyage de l'émetteur au récepteur."]],"Le destinataire du signal s'appelle le <b>récepteur</b>."),
 I("Que trouve-t-on entre l'émetteur et le récepteur ?","le milieu de propagation",[["un second émetteur","La chaîne d'information du cours n'a qu'un émetteur."],["un second récepteur","La chaîne d'information du cours n'a qu'un récepteur."],["la source du signal","La source du signal, c'est l'émetteur, au début de la chaîne."]],"La chaîne d'information est : émetteur → <b>milieu de propagation</b> → récepteur."),
 I("Combien d'éléments la chaîne d'information comporte-t-elle ?","3 éléments",[["2 éléments","Il y en a un de plus : l'émetteur, le <b>milieu de propagation</b> et le récepteur."],["4 éléments","Il y en a seulement trois : émetteur, milieu de propagation, récepteur."],["5 éléments","Il y en a seulement trois : émetteur, milieu de propagation, récepteur."]],"Émetteur, milieu de propagation, récepteur : <b>3</b> éléments."),
 I("Quelle chaîne d'information est dans le bon ordre ?","émetteur → milieu de propagation → récepteur",[["récepteur → milieu de propagation → émetteur","Le sens est inversé : le signal part de l'émetteur et arrive au récepteur."],["milieu de propagation → émetteur → récepteur","L'émetteur est au début de la chaîne, le milieu est entre l'émetteur et le récepteur."],["émetteur → récepteur → milieu de propagation","Le milieu de propagation est entre l'émetteur et le récepteur, pas après."]],"Le signal part de l'émetteur, traverse le milieu de propagation, arrive au récepteur."),
 I("Pour comprendre l'information d'un signal, le récepteur doit pouvoir la :","décoder",[["coder","Coder, c'est ce que fait l'émetteur avant d'envoyer le signal."],["effacer","Effacer l'information ne permet pas de la comprendre."],["transporter","Transporter l'information, c'est le travail du signal."]],"L'information est codée ; le récepteur la <b>décode</b>.")
],
2:[
 I("Un élève lève la main et le professeur le voit. Quel est le récepteur ?","les yeux du professeur",[["l'élève qui lève la main","L'élève est la source du signal : c'est l'émetteur."],["les oreilles du professeur","Le professeur <b>voit</b> : ce sont ses yeux qui reçoivent la lumière, pas ses oreilles."],["l'air de la classe","L'air est le milieu de propagation, entre l'émetteur et le récepteur."]],"Le professeur voit : le récepteur est ses <b>yeux</b>."),
 I("Dans la chaîne d'information, le signal va :","de l'émetteur vers le récepteur",[["du récepteur vers l'émetteur","Le signal part de l'émetteur (la source) et arrive au récepteur."],["du milieu de propagation vers l'émetteur","Le signal part de l'émetteur, il ne revient pas vers lui."],["du récepteur vers le milieu de propagation","Le récepteur est à la fin de la chaîne : il reçoit le signal."]],"Le signal va de l'<b>émetteur</b> au <b>récepteur</b>."),
 I("Un élève parle à son voisin. Quel élément est le milieu de propagation ?","l'air",[["les cordes vocales de l'élève","Les cordes vocales produisent le son : elles sont l'émetteur."],["les oreilles du voisin","Les oreilles reçoivent le son : elles sont le récepteur."],["le mot prononcé","Le mot est l'information, pas le milieu qui la transporte."]],"Le son voyage dans l'<b>air</b>, entre l'émetteur et le récepteur."),
 I("Quelle phrase est juste ?","Le récepteur décode l'information.",[["L'émetteur décode l'information.","L'émetteur <b>code</b> l'information ; c'est le récepteur qui la décode."],["Le milieu de propagation décode l'information.","Le milieu de propagation laisse passer le signal ; il ne décode rien."],["Le récepteur code l'information.","C'est l'émetteur qui code l'information et le récepteur qui la décode."]],"L'information est codée au départ ; le <b>récepteur</b> la décode."),
 I("Quel est le point commun d'un son, d'une lumière et d'une onde radio ?","Ce sont des signaux qui transportent une information.",[["Ils se propagent tous dans le vide.","Le son ne se propage pas dans le vide."],["Ce sont tous des ondes mécaniques.","Seuls les sons sont des ondes mécaniques ; la lumière et les ondes radio sont électromagnétiques."],["On les perçoit tous avec les oreilles.","Les oreilles perçoivent les sons ; la lumière se perçoit avec la vue."]],"Un son, de la lumière, une onde radio : ce sont tous des <b>signaux</b> qui transportent une information.")
],
3:[
 I("Des élèves bavardent en classe. Quel est l'émetteur du son ?","les cordes vocales des élèves",[["les oreilles du professeur","Les oreilles du professeur reçoivent le son : ce sont le récepteur."],["l'air de la classe","L'air est le milieu de propagation."],["les yeux du professeur","Les yeux reçoivent la lumière ; ici, c'est un son."]],"Quand on parle, les <b>cordes vocales</b> produisent le son : elles sont l'émetteur."),
 I("Le professeur entend des élèves bavarder. Quelle chaîne d'information est juste ?","cordes vocales → air → oreilles",[["oreilles → air → cordes vocales","Le sens est inversé : le son part des cordes vocales (émetteur) vers les oreilles (récepteur)."],["cordes vocales → vide → oreilles","En classe, le son se propage dans l'air, et un son ne se propage pas dans le vide."],["cordes vocales → air → yeux","Un son se reçoit avec les oreilles, pas avec les yeux."]],"Émetteur : cordes vocales. Milieu : air. Récepteur : oreilles."),
 I("Le professeur voit que des élèves n'écrivent pas. Quelle chaîne d'information est juste ?","élèves → air → yeux du professeur",[["élèves → air → oreilles du professeur","Il <b>observe</b> : l'information arrive par la lumière, reçue par les yeux."],["yeux du professeur → air → élèves","Le sens est inversé : l'émetteur est du côté des élèves, le récepteur est le professeur."],["élèves → vide → yeux du professeur","En classe, le milieu de propagation est l'air, pas le vide."]],"Il observe : le récepteur est ses <b>yeux</b>, et le milieu est l'<b>air</b>."),
 I("Dehors, la lumière du Soleil arrive jusqu'à la Terre. Quel est le milieu de propagation entre le Soleil et la Terre ?","l'espace (le vide)",[["l'air","L'air n'entoure que la Terre. Entre le Soleil et la Terre, il y a l'espace."],["l'eau","Il n'y a pas d'eau entre le Soleil et la Terre."],["un solide","Il n'y a pas de solide entre le Soleil et la Terre."]],"Entre le Soleil et la Terre, il y a l'<b>espace</b> (le vide) : la lumière peut s'y propager."),
 I("La lumière du Soleil arrive aux yeux d'un élève. Quel est l'émetteur ?","le Soleil",[["l'espace","L'espace est le milieu de propagation."],["les yeux de l'élève","Les yeux sont le récepteur."],["la Terre","La Terre n'est pas la source de cette lumière : la source est le Soleil."]],"Le Soleil envoie la lumière : c'est l'<b>émetteur</b>.")
]},
sonores:{

 I("Les signaux sonores sont des ondes :","mécaniques",[["électromagnétiques","Les ondes électromagnétiques sont les signaux <b>lumineux</b> et <b>radio</b>."],["lumineuses","Les ondes lumineuses sont des signaux lumineux, pas des sons."],["radio","Les ondes radio sont électromagnétiques ; les sons sont des ondes mécaniques."]],"Les signaux sonores sont des ondes <b>mécaniques</b>."),
 I("Avec quoi l'Homme perçoit-il les sons ?","les oreilles (l'ouïe)",[["les yeux (la vue)","Les yeux perçoivent la lumière, pas les sons."],["les antennes","Les antennes détectent les ondes radio, pas les sons."],["le nez (l'odorat)","Le nez sent les odeurs ; les sons se perçoivent avec les oreilles."]],"Un son est perçu avec les <b>oreilles</b>, grâce à l'ouïe."),
 I("Un son que l'Homme entend est un son :","audible",[["inaudible","Inaudible veut dire « qu'on n'entend pas »."],["invisible","Invisible se dit de ce qu'on ne voit pas."],["silencieux","Un son silencieux, ça n'existe pas : le silence, c'est l'absence de son."]],"Un son perçu avec l'ouïe est <b>audible</b>."),
 I("Les ultrasons et les infrasons sont des sons :","inaudibles",[["audibles","Audibles, ce sont ceux qu'on entend. Les ultrasons et infrasons sont <b>inaudibles</b>."],["visibles","Un son ne se voit pas : on parle de sons audibles ou inaudibles."],["lumineux","Un son n'est pas lumineux : c'est une onde mécanique."]],"L'Homme n'entend ni les ultrasons ni les infrasons : ils sont <b>inaudibles</b>."),
 I("Quels sons inaudibles y a-t-il, en plus des ultrasons ?","les infrasons",[["les ultraviolets","Les ultraviolets sont de la lumière, pas des sons."],["les infrarouges","Les infrarouges sont de la lumière, pas des sons."],["les ondes radio","Les ondes radio sont des signaux radio, pas des sons."]],"Les sons inaudibles sont les ultrasons et les <b>infrasons</b>."),
 I("Pour se propager, un signal sonore a besoin :","de matière",[["de vide","Le son ne se propage <b>pas</b> dans le vide."],["d'antennes","Les antennes servent à détecter les ondes radio."],["de lumière","Un son n'a pas besoin de lumière pour se propager."]],"Un signal sonore a besoin de <b>matière</b> (air, eau, solides) pour se propager."),
 I("Quel animal utilise les ultrasons pour se repérer et repérer sa proie ?","la chauve-souris",[["le hibou","Le hibou se repère surtout avec la vue et l'ouïe. L'animal du cours est la <b>chauve-souris</b>."],["le chat","Le chat n'utilise pas d'ultrasons pour se repérer. L'animal du cours est la <b>chauve-souris</b>."],["l'écureuil","L'écureuil n'utilise pas d'ultrasons pour se repérer. L'animal du cours est la <b>chauve-souris</b>."]],"La <b>chauve-souris</b> émet des ultrasons qui reviennent quand ils rencontrent un obstacle ou une proie.")
],
2:[
 I("Un son peut-il se propager dans l'espace, où il y a du vide ?","Non : il lui faut de la matière.",[["Oui, comme la lumière.","La lumière se propage dans le vide, mais pas le son."],["Oui, mais moins vite.","Dans le vide, le son ne se propage pas du tout."],["Oui, s'il est très fort.","Même un son très fort ne se propage pas dans le vide."]],"<b>Non</b> : les signaux sonores ne se propagent pas dans le vide."),
 I("Dans quels milieux un son peut-il se propager ?","l'air, l'eau et les solides (de la matière)",[["seulement dans l'air","L'air est une matière, mais l'eau et les solides aussi."],["seulement dans le vide","Le son ne se propage pas dans le vide."],["dans l'air et dans le vide","Le son ne se propage pas dans le vide."]],"Le son se propage dans toute <b>matière</b> : air, eau, solides."),
 I("Quelle est la différence entre un son audible et un son inaudible ?","L'Homme entend le premier, pas le second.",[["Le second ne se propage pas.","Un son inaudible se propage aussi, mais l'Homme ne l'entend pas."],["Le premier est mécanique, pas le second.","Tous les sons sont des ondes mécaniques, audibles ou non."],["Le premier se voit, pas le second.","Un son ne se voit pas : on l'entend (ou pas)."]],"Un son audible est perçu par l'ouïe, un son inaudible non."),
 I("Laquelle de ces ondes est une onde mécanique ?","le son d'une voix",[["la lumière d'une lampe","La lumière est une onde électromagnétique."],["un signal radio","Un signal radio est une onde électromagnétique."],["la lumière rouge","La lumière rouge est une onde électromagnétique."]],"Les sons sont des ondes <b>mécaniques</b>."),
 I("Une chauve-souris envoie un ultrason. Qu'est-ce qui lui permet de repérer sa proie ?","le son qui revient après avoir rebondi",[["le son qui part, sans retour","C'est le <b>retour</b> du son qui lui apprend où est la proie."],["la lumière envoyée par la proie","Elle se repère avec des ultrasons, pas avec de la lumière."],["un signal radio","Elle utilise des ultrasons, qui sont des sons, pas des ondes radio."]],"Le son fait un aller, puis un <b>retour</b> : la chauve-souris reçoit le son qui revient.")
],
3:[
 I("Dans l'espace, il y a du vide. Un astronaute peut-il entendre le bruit d'une explosion à l'extérieur de son vaisseau ?","Non, car le son ne se propage pas dans le vide.",[["Oui, car le son se propage partout.","Le son ne se propage pas dans le vide."],["Oui, mais très faiblement.","Dans le vide, il n'y a pas de son qui se propage, même faible."],["Non, car une explosion est silencieuse.","Une explosion produit un son ; mais dans le vide, ce son ne se propage pas."]],"Le son a besoin de <b>matière</b> : dans le vide, il ne se propage pas."),
 I("Le cri d'une chauve-souris fait un aller, puis un retour. Que montre le retour ?","Que le son a rencontré un obstacle ou une proie.",[["Que le son est audible pour l'Homme.","Les ultrasons sont inaudibles pour l'Homme ; ce n'est pas ce que montre le retour."],["Que la proie a envoyé un signal radio.","La chauve-souris utilise des ultrasons, pas des ondes radio."],["Que le son s'est propagé dans le vide.","Le son ne se propage pas dans le vide."]],"Le son rebondit sur un obstacle ou sur une proie, puis <b>revient</b>."),
 I("Un élève tape contre un mur. Un camarade colle son oreille de l'autre côté du mur et entend. Dans quel milieu le son s'est-il propagé ?","dans un solide",[["dans le vide","Le son ne se propage pas dans le vide."],["dans la lumière","La lumière n'est pas un milieu de propagation du son."],["dans l'espace","Il n'y a pas d'espace entre les deux élèves, et un son ne s'y propagerait pas."]],"Un solide est de la <b>matière</b> : le son peut s'y propager."),
 I("Quelle phrase est juste pour un ultrason ?","C'est un son inaudible qui se propage dans la matière.",[["C'est une lumière invisible qui se propage dans le vide.","Un ultrason est un son, pas de la lumière."],["C'est un son audible qui se propage dans le vide.","Un ultrason est inaudible, et un son ne se propage pas dans le vide."],["C'est une onde radio qu'on détecte avec une antenne.","Un ultrason est un son, pas une onde radio."]],"Un ultrason est un <b>son inaudible</b> : il se propage dans la matière."),
 I("Un plongeur entend, sous l'eau, le bruit d'un bateau. Pourquoi est-ce possible ?","Parce que l'eau est de la matière, où le son se propage.",[["Parce que l'eau est du vide.","L'eau est de la matière, pas du vide."],["Parce que le son est une onde radio.","Le son est une onde mécanique, pas une onde radio."],["Parce que le son se propage seulement dans l'air.","Le son se propage aussi dans l'eau et dans les solides."]],"Le son se propage dans la <b>matière</b> : air, eau, solides.")
]},
lumineux:{
1:[
 I("Les signaux lumineux sont des ondes :","électromagnétiques",[["mécaniques","Les ondes mécaniques sont les signaux <b>sonores</b>."],["sonores","Les ondes sonores sont des sons, pas de la lumière."],["audibles","Audible se dit d'un son qu'on entend, pas d'une lumière."]],"Les signaux lumineux sont des signaux <b>électromagnétiques</b>."),
 I("Quelles ondes lumineuses l'Homme voit-il ?","les ondes visibles (rouge, jaune, bleu…)",[["les ultraviolets","Les ultraviolets sont des ondes lumineuses invisibles."],["les infrarouges","Les infrarouges sont des ondes lumineuses invisibles."],["toutes les ondes lumineuses","Les ultraviolets et les infrarouges sont des ondes lumineuses qu'on ne voit pas."]],"L'Homme voit les ondes lumineuses <b>visibles</b> : rouge, orange, jaune, vert, bleu, indigo, violet."),
 I("Les ultraviolets et les infrarouges sont des ondes lumineuses :","invisibles",[["visibles","Visibles, ce sont celles qu'on voit. Les UV et les infrarouges sont <b>invisibles</b>."],["audibles","Audible se dit d'un son, pas d'une lumière."],["mécaniques","Les ondes lumineuses sont électromagnétiques, pas mécaniques."]],"Les ultraviolets et les infrarouges sont des ondes lumineuses <b>invisibles</b>."),
 I("Que veut dire « UV » ?","ultraviolets",[["ultrasons","Les ultrasons sont des sons ; UV veut dire ultraviolets."],["infrarouges","Les infrarouges s'écrivent IR ; UV veut dire ultraviolets."],["ultravisibles","Ce mot n'existe pas : UV veut dire ultraviolets."]],"UV veut dire <b>ultraviolets</b>."),
 I("Les couleurs visibles sont : rouge, orange, jaune, vert, bleu, …, violet. Quelle couleur manque ?","indigo",[["rose","Le rose ne fait pas partie des couleurs du spectre de la lumière blanche."],["marron","Le marron ne fait pas partie des couleurs du spectre de la lumière blanche."],["blanc","Le blanc n'est pas une couleur du spectre : la lumière blanche les contient toutes."]],"L'ordre est : rouge, orange, jaune, vert, bleu, <b>indigo</b>, violet."),
 I("Les informations de la lumière sont perçues grâce à quel sens ?","la vue",[["l'ouïe","L'ouïe sert à percevoir les sons."],["le toucher","Le toucher ne permet pas de percevoir la lumière."],["l'odorat","L'odorat ne permet pas de percevoir la lumière."]],"La lumière est perçue grâce à la <b>vue</b>."),
 I("Sur la figure du cours, quel élément chimique a pour symbole Na ?","le sodium",[["le mercure","Le symbole du mercure est Hg."],["le lithium","Le symbole du lithium est Li."],["le néon","Le symbole du néon est Ne."]],"Na est le symbole du <b>sodium</b>.")
],
2:[
 I("Dans le spectre de la lumière blanche, quelle couleur est juste à côté des ultraviolets ?","le violet",[["l'indigo","L'indigo vient juste après le violet. Le violet touche les ultraviolets."],["le rouge","Le rouge est de l'autre côté, près des infrarouges."],["le vert","Le vert est au milieu du spectre."]],"Le spectre va des ultraviolets aux infrarouges : <b>violet</b>, indigo, bleu, vert, jaune, orange, rouge."),
 I("Dans le spectre de la lumière blanche, quelle couleur est juste à côté des infrarouges ?","le rouge",[["le violet","Le violet est de l'autre côté, près des ultraviolets."],["l'orange","L'orange vient juste avant le rouge. Le rouge touche les infrarouges."],["le bleu","Le bleu est vers les ultraviolets, pas près des infrarouges."]],"Le spectre va des ultraviolets aux infrarouges : violet, indigo, bleu, vert, jaune, orange, <b>rouge</b>."),
 I("Quel est l'ordre juste des couleurs de la lumière visible ?","rouge, orange, jaune, vert, bleu, indigo, violet",[["rouge, jaune, orange, vert, bleu, indigo, violet","L'orange est entre le rouge et le jaune."],["rouge, orange, jaune, bleu, vert, indigo, violet","Le vert est entre le jaune et le bleu."],["rouge, orange, jaune, vert, indigo, bleu, violet","Le bleu est avant l'indigo (dans le sens du rouge vers le violet)."]],"L'ordre est : rouge, orange, jaune, vert, bleu, indigo, violet (ou l'inverse)."),
 I("Que sont les infrarouges ?","des ondes lumineuses invisibles, juste après le rouge",[["des sons qu'on n'entend pas","Les sons inaudibles sont les ultrasons et les infrasons, pas les infrarouges."],["des ondes lumineuses visibles, avant le violet","Les ondes lumineuses visibles vont du rouge au violet, et les infrarouges sont invisibles."],["des ondes lumineuses invisibles, avant le violet","Avant le violet, ce sont les <b>ultraviolets</b>. Les infrarouges sont après le rouge."]],"Les <b>infrarouges</b> sont des ondes lumineuses invisibles, après le rouge."),
 I("Que permet de connaître le spectre d'émission d'une étoile ?","sa composition chimique",[["sa distance à la Terre","Le spectre ne donne pas la distance, mais la composition chimique."],["le son qu'elle émet","Une étoile ne se reconnaît pas à un son : on étudie sa lumière."],["sa taille","Le spectre ne donne pas la taille, mais la composition chimique."]],"Les spectres d'émission permettent de connaître la <b>composition chimique</b> d'une étoile ou de l'atmosphère d'une planète."),
 I("Sur la figure du cours, quel élément chimique a pour symbole Hg ?","le mercure",[["le sodium","Le symbole du sodium est Na."],["le lithium","Le symbole du lithium est Li."],["le néon","Le symbole du néon est Ne."]],"Hg est le symbole du <b>mercure</b>."),
 I("Sur la figure du cours, quel élément chimique a pour symbole Li ?","le lithium",[["le sodium","Le symbole du sodium est Na."],["le mercure","Le symbole du mercure est Hg."],["le néon","Le symbole du néon est Ne."]],"Li est le symbole du <b>lithium</b>.")
],
3:[
 I("Sur la thermographie d'un immeuble, une grande zone est violette. Que peut-on dire de l'immeuble ?","Il perd peu de chaleur : il est plutôt bien isolé.",[["Il perd beaucoup de chaleur.","Les grandes pertes de chaleur sont en <b>jaune</b>. Le violet représente de petites pertes."],["Il est très chauffé.","Une thermographie montre les pertes de chaleur, pas le chauffage."],["Il n'est pas isolé.","Peu de pertes de chaleur, c'est le contraire : l'immeuble est plutôt bien isolé."]],"Violet : de <b>petites</b> pertes de chaleur. Jaune : de grandes pertes de chaleur."),
 I("Sur la thermographie d'un immeuble, quelle couleur montre de grandes pertes de chaleur ?","le jaune",[["le violet","Le violet représente de petites pertes de chaleur."],["le vert","Dans le cours, les grandes pertes de chaleur sont en jaune."],["le bleu","Dans le cours, les grandes pertes de chaleur sont en jaune."]],"Jaune : de grandes pertes de chaleur. Violet : de petites pertes."),
 I("Quelle phrase est juste pour un signal lumineux ?","Il est électromagnétique et se propage dans le vide.",[["Il est mécanique et se propage dans le vide.","Un signal lumineux est électromagnétique, pas mécanique."],["Il est électromagnétique et ne se propage pas dans le vide.","Un signal lumineux se propage dans le vide : c'est ainsi que la lumière du Soleil arrive sur la Terre."],["Il est mécanique et ne se propage pas dans le vide.","C'est la description d'un son. Un signal lumineux est électromagnétique et se propage dans le vide."]],"La lumière est <b>électromagnétique</b> et se propage <b>dans le vide</b>."),
 I("Dans quel ordre trouve-t-on ces ondes, des ultraviolets vers les infrarouges ?","ultraviolets, violet, vert, rouge, infrarouges",[["ultraviolets, rouge, vert, violet, infrarouges","Les ultraviolets sont à côté du violet, et les infrarouges à côté du rouge."],["ultraviolets, vert, violet, rouge, infrarouges","Le violet est juste à côté des ultraviolets, avant le vert."],["ultraviolets, violet, rouge, vert, infrarouges","Le rouge est juste à côté des infrarouges, après le vert."]],"Du côté des ultraviolets : violet, puis vert, puis rouge, puis les infrarouges."),
 I("On veut connaître la composition chimique d'une étoile. Que regarde-t-on ?","son spectre d'émission",[["sa thermographie","La thermographie montre des pertes de chaleur, pas la composition chimique."],["son ombre","L'ombre ne dit rien de la composition chimique."],["son bruit","Une étoile ne se reconnaît pas à un son (le son ne se propage pas dans le vide)."]],"Le <b>spectre d'émission</b> donne la composition chimique.")
]},
radio:{
1:[
 I("Les signaux radio sont des ondes :","électromagnétiques",[["mécaniques","Les ondes mécaniques sont les sons. Les ondes radio sont <b>électromagnétiques</b>."],["sonores","Les ondes sonores sont des sons, pas des signaux radio."],["chimiques","Il n'y a pas d'ondes « chimiques » dans le cours : les signaux radio sont électromagnétiques."]],"Les signaux radio sont des ondes <b>électromagnétiques</b>."),
 I("Avec quoi détecte-t-on les signaux radio ?","des antennes",[["des oreilles","Les oreilles détectent les sons."],["des yeux","Les yeux détectent la lumière visible."],["des micros","Un micro transforme un son en signal électrique, il ne détecte pas les ondes radio."]],"Les signaux radio sont détectés par des <b>antennes</b>."),
 I("À quelle vitesse les ondes radio se propagent-elles ?","300 000 km/s (la vitesse de la lumière)",[["300 km/s","Trop lent : la vitesse de la lumière est de trois cent <b>mille</b> kilomètres par seconde."],["3 000 km/s","Trop lent : la vitesse de la lumière est de 300 000 km/s."],["30 000 km/s","Trop lent : la vitesse de la lumière est de 300 000 km/s."]],"Les ondes radio se propagent à la vitesse de la lumière : <b>300 000 km/s</b>."),
 I("À quoi sert une antenne ?","à détecter des signaux radio",[["à produire des sons","Produire des sons, c'est le rôle d'un haut-parleur."],["à voir la lumière","La lumière se voit avec les yeux."],["à enregistrer la voix","Enregistrer la voix, c'est le rôle d'un micro."]],"Une <b>antenne</b> détecte les signaux radio."),
 I("Les ondes radio se propagent à la même vitesse que :","la lumière",[["un avion","Un avion est beaucoup plus lent que les ondes radio."],["un train","Un train est beaucoup plus lent que les ondes radio."],["le vent","Le vent est beaucoup plus lent que les ondes radio."]],"Les ondes radio se propagent à la vitesse de la <b>lumière</b>.")
],
2:[
 I("Un signal radio peut-il se propager dans le vide ?","Oui, comme la lumière.",[["Non, comme le son.","C'est le <b>son</b> qui ne se propage pas dans le vide. Les ondes radio s'y propagent."],["Non, il lui faut de la matière.","Les ondes radio se propagent aussi bien dans la matière que dans le vide."],["Oui, mais seulement dans les solides.","Les ondes radio se propagent dans le vide, sans besoin de matière."]],"<b>Oui</b> : les ondes radio se propagent dans la matière et dans le vide."),
 I("Quelle ressemblance y a-t-il entre les ondes radio et la lumière ?","Ce sont toutes deux des ondes électromagnétiques.",[["Ce sont toutes deux des ondes mécaniques.","Les ondes mécaniques sont les sons."],["On les perçoit toutes deux avec les oreilles.","Les oreilles perçoivent les sons ; la lumière, c'est avec les yeux."],["Toutes deux ont besoin de matière pour se propager.","Ni la lumière ni les ondes radio n'ont besoin de matière : elles se propagent dans le vide."]],"Les ondes radio et la lumière sont des ondes <b>électromagnétiques</b>."),
 I("Quelle différence y a-t-il entre un son et une onde radio ?","Le son a besoin de matière, pas l'onde radio.",[["L'onde radio a besoin de matière, pas le son.","C'est l'inverse : le son a besoin de matière, l'onde radio s'en passe."],["Le son est électromagnétique, pas l'onde radio.","C'est l'inverse : l'onde radio est électromagnétique, le son est mécanique."],["Seule l'onde radio est perçue par l'ouïe.","L'ouïe perçoit les sons, pas les ondes radio."]],"Le <b>son</b> a besoin de matière ; l'<b>onde radio</b> se propage aussi dans le vide."),
 I("Quel signal peut se propager dans le vide ?","l'onde radio",[["le son d'une voix","Le son ne se propage pas dans le vide."],["le cri d'une chauve-souris","Ce cri est un ultrason, un son : il ne se propage pas dans le vide."],["le bruit d'un klaxon","Un bruit est un son : il ne se propage pas dans le vide."]],"Une <b>onde radio</b> se propage dans le vide (comme la lumière)."),
 I("Quel signal détecte une antenne ?","un signal radio",[["un son","Un son se détecte avec les oreilles (ou un micro)."],["la lumière rouge","La lumière rouge se détecte avec les yeux."],["un ultrason","Un ultrason est un son : une antenne ne le détecte pas."]],"Une antenne détecte les <b>signaux radio</b>.")
],
3:[
 I("Un satellite envoie un signal radio vers la Terre à travers l'espace. Dans quel milieu se propage-t-il ?","le vide",[["l'air","L'air entoure seulement la Terre : dans l'espace, il y a le vide."],["l'eau","Il n'y a pas d'eau dans l'espace."],["un solide","Il n'y a pas de solide dans l'espace."]],"Dans l'espace, il y a le <b>vide</b> : les ondes radio s'y propagent."),
 I("Un satellite émet un signal radio. Quel élément le détecte sur Terre ?","une antenne",[["un micro","Un micro capte les sons, pas les ondes radio."],["un haut-parleur","Un haut-parleur produit des sons, il ne détecte pas les ondes radio."],["un œil","L'œil capte la lumière visible, pas les ondes radio."]],"Les signaux radio sont détectés par des <b>antennes</b>."),
 I("Un signal lumineux et un signal radio partent en même temps. Lequel arrive le premier ?","Ils arrivent en même temps.",[["La lumière, car elle est plus rapide.","Les ondes radio se propagent à la même vitesse que la lumière."],["Le signal radio, car il est plus rapide.","Les ondes radio se propagent à la même vitesse que la lumière."],["Ça dépend de la couleur.","Le signal radio n'a pas de couleur : il se propage, comme la lumière, à 300 000 km/s."]],"Ondes radio et lumière : même vitesse, <b>300 000 km/s</b>."),
 I("Deux astronautes dans l'espace, hors de leur vaisseau, ne s'entendent pas. Peuvent-ils communiquer par radio ?","Oui, car les ondes radio se propagent dans le vide.",[["Non, car les ondes radio ont besoin d'air.","Les ondes radio n'ont pas besoin d'air : elles se propagent dans le vide."],["Non, car les ondes radio sont mécaniques.","Les ondes radio sont électromagnétiques, pas mécaniques."],["Oui, car les ondes radio sont des sons.","Les ondes radio ne sont pas des sons : ce sont des ondes électromagnétiques."]],"Dans le vide, le son ne passe pas, mais les <b>ondes radio</b> oui.")
]},
codage:{
1:[
 I("Pourquoi code-t-on l'information ?","pour contourner les obstacles et parcourir de longues distances",[["pour que le signal aille moins vite","Le codage ne sert pas à ralentir le signal."],["pour supprimer le récepteur","Il faut toujours un récepteur, qui décode l'information."],["pour que personne ne puisse la comprendre","Le récepteur doit pouvoir décoder l'information : le codage ne sert pas à la cacher."]],"La lumière et les sons rencontrent des <b>obstacles</b> : coder l'information permet de les contourner et d'aller loin."),
 I("Le codage le plus simple utilise combien de valeurs ?","2 valeurs : 0 et 1",[["1 valeur","Avec une seule valeur, le signal ne pourrait rien transporter : il en faut deux, 0 et 1."],["3 valeurs","Le codage le plus simple n'a que deux valeurs : 0 et 1."],["10 valeurs","Dix valeurs (de 0 à 9), c'est plus que le codage le plus simple : 0 et 1 seulement."]],"Dans le codage binaire, le signal prend seulement <b>deux</b> valeurs, 0 et 1."),

// Règles (docs/module-html.md) : une seule bonne réponse, pas de choix en double, un « pourquoi »
// pour chaque mauvais choix, une correction qui dit la réponse ET pourquoi.
function genBanque(skill){
  return function(level){
    const lv=BANQUE[skill][level]?level:1;
    let it=pick(BANQUE[skill][lv]);if(typeof it==='function')it=it();
    const mauvais=shuffle(it.b.slice()).slice(0,3);
    return Q(skill,level,`<p>${it.p}</p>`,
      [C(it.g,it.g)].concat(mauvais.map(m=>C(m[0],m[0],m[1]))),it.g,
      it.h&&it.h.charAt(0)==='<'?it.h:INDICE[skill],
      `<p>Bonne réponse : <b>${it.g}</b>.</p><p>${it.e}</p>`);
  };
}

const secs=q=>q.t0?Math.round((Date.now()-q.t0)/1000):0;
function record(q,ok,rep){
  // Rappel invisible (plan P013) : une question ratée du premier coup revient 4 questions plus tard,
  // sous une autre forme (même compétence, même niveau). L'enfant ne voit aucune « passe ».
  if(!ok&&S&&S.mode==='train'&&S.rappels)S.rappels.push({skill:q.skill,level:q.level,apres:S.tried+4});
  if(window.miniprof)window.miniprof.reponse({competence:q.skill,juste:ok,mode:'e',difficulte:q.level,question:q.skill,reponse:rep==null?null:rep,duree:secs(q)});
}
function genQuestion(skill,level){
  if(!skill||skill==='all')skill=pick(Object.keys(GEN));
  return GEN[skill](level);
}
// Jamais deux fois la même question dans une séance d'entraînement : on retire (jusqu'à 40 essais, au
// cas où la compétence aurait peu de questions : elle peut alors revenir, mais en dernier recours).
// Même question = même énoncé et même réponse (un énoncé comme « Lequel est l'intrus ? » revient
// légitimement, avec une autre réponse ; des choix différents autour de la même question ne comptent pas).
const cleQuestion=q=>String(q.prompt)+'|'+String(q.exp&&q.exp.c);
function questionNeuve(skill,level){
  let q,n=0;
  do{q=genQuestion(skill,level);n++;}while(S.vus&&S.vus.has(cleQuestion(q))&&n<40);
  if(S.vus)S.vus.add(cleQuestion(q));
  return q;
}

}
function sigYes(){
  const q=S.q||{},ch=q.choices||[],zone=document.getElementById('sig');
  const lab=v=>{const c=ch.find(c=>c.v===v);return c?(txt(c.label)||'(image)'):'';};
  const champ=document.getElementById('rep');
  const att=q.write?String(q.write.ok[0]):(q.exp&&q.exp.c!==undefined?lab(q.exp.c):'');
  const id=window.miniprof?window.miniprof.signaler({enonce:txt(q.prompt),choix:ch.map(c=>txt(c.label)||'(image)'),
    attendue:att,reponse:champ?champ.value:(S.choice?lab(S.choice):'')}):null;
  zone.innerHTML=id
    ?`<div class="fb good"><p><b>Merci !</b> Un adulte va vérifier cette question.</p>
      <div style="margin:10px 0"><input id="sigtxt" style="width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)" type="text" maxlength="300" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Tu veux dire pourquoi ?" placeholder="Tu veux dire pourquoi ? (facultatif)"></div>
      <div class="btns"><button class="btn" data-act="sigsend" data-id="${esc(id)}">Envoyer</button></div></div>`
    :`<div class="fb bad"><p>Le signalement n'a pas pu être enregistré.</p></div>`;
}
function sigSend(el){
  const t=document.getElementById('sigtxt'),zone=document.getElementById('sig');
  if(t&&t.value.trim()&&window.miniprof)window.miniprof.commenter(el.dataset.id,t.value);
  zone.innerHTML='<div class="fb good"><p>Merci, c\'est noté.</p></div>';
}
// Boutons de la question (P010, 12/10/2026). « Valider » n'apparaît que lorsque l'élève a proposé
// une réponse (mot tapé, choix, dessin non vide). Après une erreur, « Réessayer » efface sa
// proposition ; « Valider » revient (caché) tant qu'il n'a rien reproposé.
function aReponse(){
  if(S.q&&S.q.draw)return Object.keys(S.grid||{}).length>0;
  const i=document.getElementById('rep');
  return i?!!norm(i.value):!!S.choice;
}
function majValider(){const b=document.getElementById('ok');if(b)b.hidden=!aReponse();}
function boutons(){
  const ev=S.mode==='eval',last=ev&&S.i===S.total-1;
  const aide=ev?'':'<button class="btn ghost" data-act="hint">Un indice</button>'+(S.attempts>0?'<button class="btn ghost" data-act="reveal">Voir la correction</button>':'');
  const principal=S.retry
    ?'<button class="btn primary" data-act="retry" data-primary>Réessayer</button>'
    :`<button class="btn primary" id="ok" data-act="check" data-primary hidden>${ev?(last?'Valider et terminer':'Valider et continuer'):'Valider'}</button>`;
  document.getElementById('acts').innerHTML=principal+aide;
  majValider();
}
// L'élève propose (ou modifie) une réponse : si « Réessayer » attendait, « Valider » reprend sa place.
function surProposition(){if(S.retry){S.retry=false;boutons();}else majValider();}
function reessayer(){
  S.retry=false;S.choice=null;
  const i=document.getElementById('rep');
  if(i){i.value='';i.focus();}
  // QCM : la réponse fausse repasse en neutre (elle était rouge et grisée)
  app.querySelectorAll('.choice').forEach(c=>{c.classList.remove('sel','bad');c.disabled=false;});
  boutons();
}
function setFb(html){document.getElementById('fb').innerHTML=html;}
function lockChoices(){
  const inp=document.getElementById('rep');
  if(inp){inp.disabled=true;inp.classList.add(S.q.write&&judgeWrite(S.q,inp.value).ok?'good':'bad');}
  app.querySelectorAll('.choice').forEach(c=>{c.classList.add('locked');c.disabled=true;
    if(c.dataset.v===S.q.exp.c)c.classList.add('good');else if(c.dataset.v===S.choice)c.classList.add('bad');});
}
// la réponse tapée (question à écrire), coupée à 60 caractères pour le journal
function lireEcrit(){const i=document.getElementById('rep');return i?i.value.slice(0,60):'';}
function checkTrain(){
  let v=null;
  if(S.q.write){S.choice=lireEcrit();if(!norm(S.choice)){setFb('<div class="fb hint">Écris ta réponse.</div>');return;}v=judgeWrite(S.q,S.choice);}
  else if(!S.choice){setFb('<div class="fb hint">Choisis une réponse.</div>');return;}
  const q=S.q;S.attempts++;
  const ok=v?v.ok:S.choice===q.exp.c;
  // seul le premier essai compte dans le journal (sinon cliquer au hasard gonfle la réussite)
  if(S.attempts===1){S.tried++;if(ok){S.okCount++;S.streak++;}else S.streak=0;record(q,ok,S.choice);}
  if(ok){
    lockChoices();
    // le compteur monte à chaque bonne réponse, même au deuxième essai (sponsor, 21/11/2026)
    S.bonnes=(S.bonnes||0)+1;S.plus=true;
    let extra='';
    if(S.streak===5&&S.attempts===1&&S.level<MAXL)extra=`<p>${S.streak} réussites d'affilée : tu peux passer au niveau ${LEVELS[S.level+1].t}.</p>`;
    // bonne réponse : question suivante tout de suite, sans « Bravo » (sponsor, 21/11/2026)
    if(!extra){nextTrain();return;}
    setFb(`<div class="fb good"><p><b>${pick(CHEER)}</b>${S.attempts>1?' Tu as trouvé au deuxième essai.':''}</p>${q.explain}${extra}</div>`);
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>${extra?`<button class="btn" data-act="levelup">Niveau ${LEVELS[S.level+1].t}</button>`:''}`;
  }else if(S.attempts===1||(v&&S.attempts<3)){
    // une question à écrire laisse 3 essais : l'enfant corrige son mot lui-même
    const c=v?null:q.choices.find(c=>c.v===S.choice);
    const why=v?v.why+'<br><span class="small">Appuie sur « Réessayer » ou touche le champ, puis écris ta réponse à nouveau.</span>':(c&&c.why?c.why:'Relis la question et réessaie.');
    setFb(`<div class="fb bad"><p><b>Pas tout à fait.</b> ${why}</p></div>`);
    if(!v)app.querySelectorAll('.choice').forEach(b=>{if(b.dataset.v===S.choice){b.classList.remove('sel');b.classList.add('bad');b.disabled=true;}});
    S.choice=null;
    S.retry=true;boutons();
  }else revealTrain();
}
function revealTrain(){
  if(S.attempts===0){S.attempts=1;S.tried++;S.streak=0;record(S.q,false,null);}
  lockChoices();
  setFb(`<div class="fb info"><p><b>Correction</b></p>${S.q.explain}</div>`);
  document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>`;
}
function nextTrain(){
  const i=S.rappels?S.rappels.findIndex(r=>r.apres<=S.tried):-1;
  if(i>=0){const r=S.rappels.splice(i,1)[0];S.q=questionNeuve(r.skill,r.level);}
  else S.q=questionNeuve(S.skill,S.level);
  qScreen();
}

// Une évaluation ne pose jamais deux fois la même question : on retire une question déjà
// sortie (jusqu'à 30 essais, au cas où une compétence aurait peu de questions).
// Signalé par le sponsor le 12/10/2026 (la même question deux fois dans une évaluation).
function tirerSansDoublon(skills,niveau){
  const vus=new Set();
  // même question = même énoncé ET mêmes choix (un énoncé comme « Lequel est l'intrus ? » revient
  // légitimement avec d'autres mots)
  const cle=q=>q.prompt+'|'+(q.choices||[]).map(c=>c.v).sort().join(',')+'|'+q.exp.c;
  return skills.map((s,i)=>{let q,n=0;do{q=genQuestion(s,niveau(i));n++;}while(vus.has(cle(q))&&n<30);vus.add(cle(q));return q;});
}
function evalStart(){
  const lvl=S.level;
  // Mixte (0) : les niveaux tournent, pour que chacun soit représenté
  const qs=tirerSansDoublon(shuffle(EVAL_SKILLS.slice()),i=>lvl===0?LVL[i%LVL.length]:lvl);
  S={screen:'eval',mode:'eval',evalLevel:lvl,level:lvl,qs,i:0,total:qs.length,results:[],t0:Date.now(),
    cle:window.miniprof?window.miniprof.debutEvaluation(lvl):null};
  S.q=qs[0];qScreen();
}
function checkEval(){
  if(S.q.write){S.choice=lireEcrit();if(!norm(S.choice)){setFb('<div class="fb hint">Écris ta réponse avant de continuer.</div>');return;}}
  else if(!S.choice){setFb('<div class="fb hint">Choisis une réponse avant de continuer.</div>');return;}
  S.results.push({q:S.q,ans:S.choice,ok:S.q.write?judgeWrite(S.q,S.choice).ok:S.choice===S.q.exp.c,duree:secs(S.q)});
  S.i++;
  if(S.i>=S.total){evalEnd();return;}
  S.q=S.qs[S.i];qScreen();
}
const lblOf=(q,v)=>{if(q.write)return esc(v);const c=q.choices.find(c=>c.v===v);return c?c.label:'';};
function evalEnd(){
  const res=S.results,score=res.filter(r=>r.ok).length,total=res.length;
  const duree=Math.round((Date.now()-S.t0)/1000);
  const sk={};
  res.forEach(r=>{const s=sk[r.q.skill]||(sk[r.q.skill]=[0,0]);s[1]++;if(r.ok)s[0]++;});
  // l'évaluation est enregistrée d'un bloc à la fin : abandonnée au milieu, elle ne compte pas
  if(window.miniprof)window.miniprof.reponse(res.map(r=>({competence:r.q.skill,juste:r.ok,mode:'v',difficulte:r.q.level,
    question:r.q.skill,reponse:r.ans,duree:r.duree,evaluation:S.cle})));
  let weakest=null,wp=2;for(const k in sk){const p=sk[k][0]/sk[k][1];if(p<wp){wp=p;weakest=k;}}
  const pc=score/total;
  const msg=pc>=.9?"Excellent ! Tu maîtrises ta leçon.":pc>=.7?"Très bien ! Il ne reste que quelques détails à revoir.":pc>=.5?"Bon début. Regarde les corrections, puis entraîne-toi encore un peu.":"Pas de panique : relis les fiches Apprendre, puis entraîne-toi.";
  const bars=Object.keys(sk).map(k=>{const p=Math.round(100*sk[k][0]/sk[k][1]);return `<div><div class="row" style="justify-content:space-between"><span>${SKILLS[k].label}</span><b>${sk[k][0]}/${sk[k][1]}</b></div><div class="bar"><i class="${p<50?'low':p<80?'mid':''}" style="width:${p}%"></i></div></div>`;}).join('');
  const rev=res.map((r,i)=>`<details class="rev ${r.ok?'okk':'koo'}"><summary>${r.ok?'✓':'✗'} Question ${i+1} : ${SKILLS[r.q.skill].label}</summary>
    <div class="q-prompt">${r.q.prompt}</div>
    <p>Ta réponse :</p><div class="ans">${lblOf(r.q,r.ans)}</div>
    ${r.ok?'':`<p>Bonne réponse :</p><div class="ans good">${lblOf(r.q,r.q.exp.c)}</div>`}
    <div class="fb info">${r.q.explain}</div></details>`).join('');
  S.screen='result';S.weakest=weakest;
  show(`${topbar('Résultat','home')}<main class="wrap">
    <div class="card center"><div class="score">${score}<span style="font-size:1.6rem;color:var(--muted)"> / ${total}</span></div>
      <p style="margin-top:10px">${msg}</p><p class="small">Temps : ${Math.floor(duree/60)} min ${duree%60} s</p></div>
    <h2>Par compétence</h2><div style="margin-top:10px">${bars}</div>
    <h2 style="margin:16px 0 6px">Les corrections</h2>${rev}
    <div class="btns">
      ${weakest&&wp<1?`<button class="btn primary" data-act="trainWeak" data-primary>Travailler : ${SKILLS[weakest].label}</button>`:''}
      <button class="btn" data-act="evalSetup">Recommencer</button><button class="btn" data-act="bilan">Mon bilan</button><button class="btn ghost" data-act="home">Accueil</button>
    </div></main>`);
}

/* ================= MOTEUR : bilan (celui de miniprof) ================= */
function bilan(){
  const m=window.miniprof;
  if(m)location.href=m.racine+'#/module/'+encodeURIComponent(m.module)+'/bilan';
}

/* ================= MOTEUR : actions ================= */
// Ajouter ici les actions propres au module (ex. un labo) avant « default ».
function act(a,el){
  switch(a){
    case 'home':home();break;
    case 'learn':learn(0);break;
    case 'lchoose':learnChoose(el);break;
    case 'lnext':if(S.ls<LEARN.length-1){S.ls++;renderLearn();}break;
    case 'trainSetup':trainSetup(false);break;
    case 'lvl':S.level=Number(el.dataset.v);if(S.screen==='trainSetup')trainSetup(true);else evalSetup(true);break;
    case 'sk':S.skill=el.dataset.v;S.skillPref=S.skill;trainSetup(true);break;
    case 'trainStart':S={screen:'train',mode:'train',level:S.level,skill:S.skill,skillPref:S.skill,tried:0,okCount:0,streak:0,vus:new Set(),rappels:[]};nextTrain();break;
    case 'trainWeak':S={screen:'train',mode:'train',level:1,skill:S.weakest,skillPref:S.weakest,tried:0,okCount:0,streak:0,vus:new Set(),rappels:[]};nextTrain();break;
    case 'levelup':S.level=Math.min(S.level+1,MAXL);S.streak=0;nextTrain();break;
    case 'evalSetup':evalSetup(false);break;
    case 'evalStart':evalStart();break;
    case 'quitEval':evalSetup(false);break;
    case 'choose':S.choice=el.dataset.v;app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c===el));surProposition();break;
    case 'retry':reessayer();break;
    case 'check':S.mode==='eval'?checkEval():checkTrain();break;
    case 'hint':document.getElementById('hint').innerHTML=`<div class="fb hint"><p><b>Indice</b></p>${S.q.hint}</div>`;break;
    case 'reveal':revealTrain();break;
    case 'sig':sigAsk();break;
    case 'signo':document.getElementById('sig').innerHTML='';break;
    case 'sigyes':sigYes();break;
    case 'sigsend':sigSend(el);break;
    case 'next':nextTrain();break;
    case 'bilan':bilan();break;
    default:break;
  }
}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t);});
// un mot tapé = une proposition : « Valider » apparaît
app.addEventListener('input',e=>{if(e.target.id==='rep')surProposition();});
// Après une erreur, toucher le champ ou y taper efface l'ancien mot, comme « Réessayer » (P010, retour du 12/10).
const effacerSiReessai=e=>{if(S.retry&&e.target.id==='rep')reessayer();};
app.addEventListener('pointerdown',effacerSiReessai);
app.addEventListener('focusin',effacerSiReessai);
app.addEventListener('beforeinput',effacerSiReessai);
// touche Entrée (« OK » du clavier de l'iPhone) dans le champ de réponse = bouton principal
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rep'){e.preventDefault();const b=app.querySelector('[data-primary]');if(b&&!b.hidden)b.click();}});

// Pas de dictée vocale ni de collage : un mot s'écrit lettre par lettre. Une page web ne peut pas masquer la
// touche micro du clavier ; on refuse donc ce qui arrive d'un coup (plusieurs lettres en une seule saisie,
// collage, remplacement par suggestion) et on remet le champ comme il était (retour d'usage, 18 nov. 2026).
(function(){
  const champ=e=>e.target&&e.target.id==='rep';
  const refuser=(i,avant)=>{
    i.value=avant;
    const fb=document.getElementById('fb');
    if(fb)fb.innerHTML='<div class="fb hint"><p>Écris le mot toi-même, lettre par lettre : pas de micro ni de collage.</p></div>';
  };
  app.addEventListener('beforeinput',e=>{
    if(!champ(e))return;
    if(/FromPaste|FromDrop|FromYank|Dictation|Transcription|ReplacementText/.test(e.inputType||'')){e.preventDefault();refuser(e.target,e.target.value);return;}
    e.target.dataset.avant=e.target.value;   // le champ juste avant cette saisie
  },true);
  app.addEventListener('input',e=>{
    if(!champ(e))return;
    const i=e.target,avant=i.dataset.avant;
    delete i.dataset.avant;
    if(avant!==undefined&&i.value.length-avant.length>1){e.stopImmediatePropagation();refuser(i,avant);}
  },true);
  app.addEventListener('paste',e=>{if(champ(e)){e.preventDefault();refuser(e.target,e.target.value);}},true);
  app.addEventListener('drop',e=>{if(champ(e))e.preventDefault();},true);
})();

// Tirage automatique (tools/tirage.py) : la page donne ses générateurs au lieu de s'afficher.
// window.__miniprofTirage n'existe que dans l'outil, jamais dans un navigateur.
if(window.__miniprofTirage){window.__miniprofTirage({GEN,LEVELS,LEARN,SKILLS,EVAL_SKILLS});return;}
home();

})();
</script>
