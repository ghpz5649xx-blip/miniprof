<div id="app"></div>
<script>
(function(){
'use strict';
/* ================= utilitaires ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[R(0,arr.length-1)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= construction des circuits ================= */
function mk(){
  const c={nodes:{},edges:[],dots:[],shunts:[],comp:{},kind:''};
  let k=0;
  Object.defineProperty(c,'n',{value:(x,y)=>{const id='n'+(k++);c.nodes[id]=[x,y];return id;},enumerable:false});
  return c;
}
const Lp=(id)=>({t:'lamp',id,lab:id});
const Sw=(on,id)=>({t:'switch',id:id||'K',on:!!on,lab:id||''});
const Mo=(id)=>({t:'moteur',id:id||'M'});
/* DEL : rev = false si sa patte + (la base du triangle) est du côté a, celui d'où arrive le
   courant quand la pile est dans le sens habituel (+ en haut) */
const Dl=(id,rev)=>({t:'del',id:id||'D',rev:!!rev,lab:id||'D'});

function addComp(c,prev,pa,pb,it,lo,off){
  c.edges.push({t:'wire',a:prev,b:pa});
  const e=Object.assign({a:pa,b:pb,lo,off},it);
  c.edges.push(e);
  if(it.id)c.comp[it.id]={a:pa,b:pb,off};
  return pb;
}
function addPile(c,prev,start,X0,ym){
  const pa=c.n(X0,ym+22),pb=c.n(X0,ym-22);
  c.edges.push({t:'wire',a:prev,b:pa});
  c.edges.push({t:'pile',id:'P',a:pa,b:pb,plus:'b'});
  c.comp.P={a:pa,b:pb,off:[-30,0]};
  c.edges.push({t:'wire',a:pb,b:start});
}
/* circuit en série : une seule boucle, pile à gauche (+ en haut) */
function serie(items,opt){
  opt=opt||{};
  const c=mk();c.kind='serie';
  const X0=40,X1=280,Y0=40,Y1=170,ym=(Y0+Y1)/2;
  const SL={1:[['R',.5]],2:[['T',.5],['R',.5]],3:[['T',.5],['R',.5],['B',.5]],
    4:[['T',.3],['T',.7],['R',.5],['B',.5]],5:[['T',.3],['T',.7],['R',.5],['B',.7],['B',.3]]}[items.length];
  const start=c.n(X0,Y0);let prev=start;
  const corner=(x,y)=>{const id=c.n(x,y);c.edges.push({t:'wire',a:prev,b:id});prev=id;};
  const put=side=>items.forEach((it,i)=>{
    const [s,f]=SL[i];if(s!==side)return;
    if(s==='T'){const x=X0+(X1-X0)*f;prev=addComp(c,prev,c.n(x-25,Y0),c.n(x+25,Y0),it,[0,34],[0,-30]);}
    if(s==='R'){const y=Y0+(Y1-Y0)*f;prev=addComp(c,prev,c.n(X1,y-25),c.n(X1,y+25),it,[-34,0],[30,0]);}
    if(s==='B'){const x=X0+(X1-X0)*f;prev=addComp(c,prev,c.n(x+25,Y1),c.n(x-25,Y1),it,[0,-34],[0,30]);}
  });
  put('T');corner(X1,Y0);put('R');corner(X1,Y1);put('B');corner(X0,Y1);
  if(opt.noPile===true)c.edges.push({t:'wire',a:prev,b:start});
  else addPile(c,prev,start,X0,ym);
  return c;
}
/* circuit en dérivation : branches verticales entre deux fils horizontaux */
function deriv(branches,opt){
  opt=opt||{};
  const c=mk();c.kind='deriv';
  const X0=40,Y0=40,Y1=170,ym=(Y0+Y1)/2;
  const main=opt.main||[];
  const xb0=X0+(main.length?150:110),gap=110;
  const TL=c.n(X0,Y0);let prev=TL;
  main.forEach((it,i)=>{
    const x=X0+(xb0-X0)*(i+1)/(main.length+1);
    prev=addComp(c,prev,c.n(x-22,Y0),c.n(x+22,Y0),it,[0,-26],[0,-30]);
  });
  const J=[],K=[];
  branches.forEach((br,i)=>{const x=xb0+gap*i;J.push(c.n(x,Y0));K.push(c.n(x,Y1));});
  c.edges.push({t:'wire',a:prev,b:J[0]});
  for(let i=0;i+1<J.length;i++){c.edges.push({t:'wire',a:J[i],b:J[i+1]});c.edges.push({t:'wire',a:K[i+1],b:K[i]});}
  branches.forEach((br,i)=>{
    const x=xb0+gap*i;let p=J[i];
    const fr=br.length===1?[.5]:[.3,.72];
    br.forEach((it,j)=>{const y=Y0+(Y1-Y0)*fr[j];p=addComp(c,p,c.n(x,y-22),c.n(x,y+22),it,[-30,0],[30,0]);});
    c.edges.push({t:'wire',a:p,b:K[i]});
    if(i<branches.length-1)c.dots.push(J[i],K[i]);
  });
  const BL=c.n(X0,Y1);
  c.edges.push({t:'wire',a:K[0],b:BL});
  if(opt.noPile)c.edges.push({t:'wire',a:BL,b:TL});
  else addPile(c,BL,TL,X0,ym);
  return c;
}
function addShunt(c,id,on){
  const k=c.comp[id];if(!k)return c;
  c.shunts.push({id:'S'+id,target:id,a:k.a,b:k.b,off:k.off,on:on!==false});
  return c;
}
function setProp(c,id,prop,val){c.edges.forEach(e=>{if(e.id===id)e[prop]=val;});return c;}

/* ================= calcul électrique (lois des nœuds, pour être exact) ================= */
function solve(c){
  const res={byId:{},danger:false,hasPile:false,I:0};
  const comps=c.edges.filter(e=>e.t==='lamp'||e.t==='moteur'||e.t==='del');
  comps.forEach(e=>res.byId[e.id]={p:0,rel:0,lvl:'off'});
  const pile=c.edges.find(e=>e.t==='pile');
  if(!pile)return res;
  res.hasPile=true;
  const ids=Object.keys(c.nodes),N=ids.length,ix={};ids.forEach((id,i)=>ix[id]=i);
  const V0=1,r=0.05,BIG=1e6;
  const plus=pile.plus==='a'?pile.a:pile.b,minus=pile.plus==='a'?pile.b:pile.a;
  // la DEL ne laisse passer le courant que dans un sens : passe[id] dit si elle conduit
  const dels=c.edges.filter(e=>e.t==='del'&&!e.out),passe={};
  dels.forEach(e=>passe[e.id]=true);
  const nodal=()=>{
    const G=[];for(let i=0;i<N;i++){G.push(new Array(N).fill(0));}
    const I=new Array(N).fill(0);
    const add=(a,b,g)=>{a=ix[a];b=ix[b];G[a][a]+=g;G[b][b]+=g;G[a][b]-=g;G[b][a]-=g;};
    c.edges.forEach(e=>{
      if(e.t==='wire')add(e.a,e.b,BIG);
      else if(e.t==='switch'){if(e.on)add(e.a,e.b,BIG);}
      else if(e.t==='lamp'||e.t==='moteur'){if(!e.out)add(e.a,e.b,1);}
      else if(e.t==='del'){if(!e.out&&passe[e.id])add(e.a,e.b,1);}
      else if(e.t==='pile'){add(e.a,e.b,1/r);I[ix[plus]]+=V0/r;}
    });
    c.shunts.forEach(s=>{if(s.on)add(s.a,s.b,BIG);});
    for(let i=0;i<N;i++)G[i][i]+=1e-9;
    const g=ix[minus],keep=[];for(let i=0;i<N;i++)if(i!==g)keep.push(i);
    const n=keep.length,A=keep.map(i=>keep.map(j=>G[i][j]).concat([I[i]]));
    for(let col=0;col<n;col++){
      let best=col;for(let row=col+1;row<n;row++)if(Math.abs(A[row][col])>Math.abs(A[best][col]))best=row;
      [A[col],A[best]]=[A[best],A[col]];
      const pv=A[col][col];if(Math.abs(pv)<1e-15)continue;
      for(let row=0;row<n;row++){if(row===col)continue;const f=A[row][col]/pv;if(f===0)continue;for(let k=col;k<=n;k++)A[row][k]-=f*A[col][k];}
    }
    const V=new Array(N).fill(0);keep.forEach((i,k)=>{V[i]=Math.abs(A[k][k])<1e-15?0:A[k][n]/A[k][k];});
    return V;
  };
  // on résout, puis on bloque les DEL traversées à l'envers et on débloque celles qui seraient
  // dans le sens passant, jusqu'à ce que plus rien ne change (quelques tours pour nos petits circuits)
  let V=nodal();
  for(let tour=0;tour<8&&dels.length;tour++){
    let change=false;
    dels.forEach(e=>{
      const an=e.rev?e.b:e.a,ca=e.rev?e.a:e.b,d=V[ix[an]]-V[ix[ca]];
      const veut=passe[e.id]?d>-1e-9:d>1e-6;
      if(veut!==passe[e.id]){passe[e.id]=veut;change=true;}
    });
    if(!change)break;
    V=nodal();
  }
  const P0=Math.pow(V0/(1+r),2);
  comps.forEach(e=>{
    if(e.out)return;
    if(e.t==='del'&&!passe[e.id]){res.byId[e.id]={p:0,rel:0,lvl:'off',bloque:true};return;}
    const d=V[ix[e.a]]-V[ix[e.b]],p=d*d,rel=p/P0;
    res.byId[e.id]={p,rel,lvl:rel>=0.6?'normal':rel>=0.15?'faible':rel>=0.03?'tresfaible':'off'};
  });
  res.I=(V0-(V[ix[plus]]-V[ix[minus]]))/r;
  res.danger=res.I>6;
  return res;
}
const LAMPTXT={normal:'brille normalement',faible:'brille faiblement',tresfaible:'brille très faiblement',off:'est éteinte'};
const DELTXT=st=>st.bloque?'est éteinte (sens bloquant)':st.lvl==='off'?'est éteinte':'est allumée';
const MOTTXT={normal:'tourne',faible:'tourne lentement',tresfaible:'tourne très lentement',off:'ne tourne pas'};

/* ================= dessin SVG des schémas normalisés ================= */
const SYML={lamp:15,moteur:15,switch:13,pile:4,del:12};
let REDUCED=false;
function f1(v){return Math.round(v*10)/10;}
function drawCircuit(c,o){
  o=o||{};
  const res=o.res||solve(c);
  const P=c.nodes;
  let xs=[],ys=[];for(const k in P){xs.push(P[k][0]);ys.push(P[k][1]);}
  const m=o.margin||42;
  const minX=Math.min(...xs)-m,minY=Math.min(...ys)-m,W=Math.max(...xs)-Math.min(...xs)+2*m,H=Math.max(...ys)-Math.min(...ys)+2*m;
  const sc=o.scale||1;
  let s='',top='';
  const line=(x1,y1,x2,y2,cls)=>`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" class="${cls||'w'}"/>`;
  c.edges.forEach(e=>{
    const [x1,y1]=P[e.a],[x2,y2]=P[e.b];
    if(e.t==='wire'){s+=line(x1,y1,x2,y2);return;}
    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
    const mx=(x1+x2)/2,my=(y1+y2)/2,L=SYML[e.t];
    s+=line(x1,y1,mx-ux*L,my-uy*L)+line(mx+ux*L,my+uy*L,x2,y2);
    const ang=Math.round(Math.atan2(dy,dx)*180/Math.PI);
    let g='';
    if(e.t==='lamp'){
      const st=res.byId[e.id]||{lvl:'off'};
      if(e.out){
        g+=`<circle r="15" class="sym out"/><line x1="-10.6" y1="-10.6" x2="10.6" y2="10.6" class="sym out"/><line x1="-10.6" y1="10.6" x2="10.6" y2="-10.6" class="sym out"/>`;
      }else{
        if(st.lvl!=='off'){const h={normal:13,faible:8,tresfaible:4}[st.lvl],op={normal:.75,faible:.55,tresfaible:.4}[st.lvl];
          g+=`<circle r="${15+h}" class="halo" style="opacity:${op}"/>`;}
        g+=`<circle r="15" class="sym ${st.lvl!=='off'?'lit':'bulb'}"/><line x1="-10.6" y1="-10.6" x2="10.6" y2="10.6" class="sym"/><line x1="-10.6" y1="10.6" x2="10.6" y2="-10.6" class="sym"/>`;
      }
    }else if(e.t==='moteur'){
      const st=res.byId[e.id]||{lvl:'off'};
      g+=`<circle r="15" class="sym ${st.lvl!=='off'?'run':'bulb'}"/>`;
      top+=`<text x="${f1(mx)}" y="${f1(my+5.5)}" class="mt">M</text>`;
      if(st.lvl!=='off'){
        const dur={normal:1.2,faible:2.6,tresfaible:4}[st.lvl];
        top+=`<g transform="translate(${f1(mx)} ${f1(my)})"><g><path d="M -21 0 A 21 21 0 0 1 14.8 -14.8" class="arc"/><path d="M 14.8 -14.8 l -7 0.5 M 14.8 -14.8 l 0.4 6.6" class="arc"/>${REDUCED?'':`<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="${dur}s" repeatCount="indefinite"/>`}</g></g>`;
      }
    }else if(e.t==='del'){
      const st=res.byId[e.id]||{lvl:'off'},on=st.lvl!=='off';
      let d='';
      if(on)d+=`<circle r="20" class="halo" style="opacity:.6"/>`;
      d+=`<line x1="-12" y1="0" x2="12" y2="0" class="sym"/><path d="M -8 -11 L -8 11 L 8 0 Z" class="sym ${on?'lit':''}" style="stroke-linejoin:round"/><line x1="8" y1="-11" x2="8" y2="11" class="sym"/>`;
      d+=`<path d="M 0 -14 L 7 -23 M 7 -23 l -5 1 M 7 -23 l 0 5 M 6 -11 L 13 -20 M 13 -20 l -5 1 M 13 -20 l 0 5" class="sym" style="stroke-width:2"/>`;
      g+=e.rev?`<g transform="scale(-1 1)">${d}</g>`:d;
    }else if(e.t==='switch'){
      g+=`<circle cx="-12" cy="0" r="3.4" class="pt"/><circle cx="12" cy="0" r="3.4" class="pt"/>`;
      g+=e.on?`<line x1="-12" y1="0" x2="12" y2="0" class="sym"/>`:`<line x1="-12" y1="0" x2="10" y2="-14" class="sym"/>`;
    }else if(e.t==='pile'){
      const sg=e.plus==='b'?1:-1;
      g+=`<line x1="${4*sg}" y1="-17" x2="${4*sg}" y2="17" class="sym"/><line x1="${-4*sg}" y1="-8" x2="${-4*sg}" y2="8" class="sym thick"/>`;
      const nx=-uy,ny=ux;
      top+=`<text x="${f1(mx+ux*12*sg+nx*22)}" y="${f1(my+uy*12*sg+ny*22+6)}" class="pm">+</text><text x="${f1(mx-ux*12*sg+nx*22)}" y="${f1(my-uy*12*sg+ny*22+6)}" class="pm">−</text>`;
    }
    let inner=`<g transform="translate(${f1(mx)} ${f1(my)}) rotate(${ang})">${g}</g>`;
    if(o.inter&&(e.t==='switch'||e.t==='lamp'||e.t==='del')&&e.id){
      inner=`<g class="tap" data-act="${o.act||'labTog'}" data-id="${e.id}" role="button" aria-label="${e.t==='switch'?'Interrupteur '+(e.lab||''):e.t==='del'?'DEL '+e.lab:'Lampe '+e.lab}"><circle cx="${f1(mx)}" cy="${f1(my)}" r="26" class="hit"/>${inner}</g>`;
    }
    s+=inner;
    if(e.lab&&e.lo)top+=`<text x="${f1(mx+e.lo[0])}" y="${f1(my+e.lo[1]+5)}" class="lb">${esc(e.lab)}</text>`;
  });
  c.shunts.forEach(sh=>{
    if(!sh.on)return;
    const [ax,ay]=P[sh.a],[bx,by]=P[sh.b],[ox,oy]=sh.off;
    s+=`<path d="M ${ax} ${ay} L ${ax+ox} ${ay+oy} L ${bx+ox} ${by+oy} L ${bx} ${by}" class="sh"/><circle cx="${ax}" cy="${ay}" r="4" class="shd"/><circle cx="${bx}" cy="${by}" r="4" class="shd"/>`;
  });
  c.dots.forEach(d=>{const [x,y]=P[d];s+=`<circle cx="${x}" cy="${y}" r="4.5" class="dot"/>`;});
  return `<svg class="sch" viewBox="${minX} ${minY} ${W} ${H}" width="${Math.round(W*sc)}" role="img" aria-label="${esc(o.alt||'Schéma électrique')}">${o.under||''}${s}${top}${o.over||''}</svg>`;
}
/* un symbole seul, entre deux bouts de fil */
function symbolSVG(type,scale){
  const c=mk();const a=c.n(0,0),b=c.n(90,0);
  if(type==='pile')c.edges.push({t:'pile',a,b,plus:'a'});
  else if(type==='lampe')c.edges.push({t:'lamp',id:'x',a,b});
  else if(type==='moteur')c.edges.push({t:'moteur',id:'x',a,b});
  else if(type==='del')c.edges.push({t:'del',id:'x',a,b});
  else if(type==='ko')c.edges.push({t:'switch',a,b,on:false});
  else if(type==='kf')c.edges.push({t:'switch',a,b,on:true});
  else if(type==='fil')c.edges.push({t:'wire',a,b});
  return drawCircuit(c,{margin:24,scale:scale||1.1,res:{byId:{},danger:false},alt:'symbole'});
}

function genSymboles(level){
  const keys=Object.keys(SYM);const k=pick(keys);

      `<p>Chaque lampe <b>brille normalement</b> : en dérivation, chacune est branchée directement sur la pile.</p><div class="center">${drawCircuit(c,{scale:.8})}</div>`);
  }
  // interrupteur ouvert dans la branche principale ou dans une branche
  const n=R(2,3);const inMain=Math.random()<.4;

  const bi=R(0,n-1);

  const c=deriv(br,inMain?{main:[Sw(false,'K')]}:{});
  const all=lampsOf(c),lit=litSet(c),okL=setLabel(lit,all);
  const opts=new Set([okL,'Toutes les lampes','Aucune lampe']);
  all.forEach(id=>opts.add('Seulement '+id));

    :`L'interrupteur K est dans la branche de ${all[bi]} : il ne coupe que cette lampe. Les autres ont leur propre boucle avec la pile.`;
  return Q('derivation',level,`L'interrupteur K est ouvert. Quelles lampes brillent ?<div class="center">${drawCircuit(c,{res:{byId:{}},scale:.8})}</div>`,
    list.map(l=>C(l,l,why)),okL,"<p>Repère où est K : sur le fil qui part de la pile (branche principale) ou dans la branche d'une seule lampe ?</p>",
    `<p>${why}</p><div class="center">${drawCircuit(c,{scale:.75})}</div>`);
}

/* choisir le bon schéma à partir d'une description */
function clone(items){return items.map(x=>Object.assign({},x));}
function genSchema(level){
  const cfgs=[
    {d:"une pile, un interrupteur fermé et une lampe, branchés en série",k:'s',items:[Lp('L'),Sw(true)]},
    {d:"une pile, une lampe, un moteur et un interrupteur fermé, branchés en série",k:'s',items:[Lp('L'),Sw(true),Mo()]},
    {d:"une pile et deux lampes, branchées en série",k:'s',items:[Lp('L1'),Lp('L2')]},
    {d:"une pile et deux lampes, branchées en dérivation",k:'d',br:[[Lp('L1')],[Lp('L2')]]}
  ];
  if(level===2)cfgs.push(
    {d:"une pile, un interrupteur ouvert et un moteur, branchés en série",k:'s',items:[Sw(false),Mo()]},
    {d:"une pile, un interrupteur fermé sur la branche principale et deux lampes en dérivation",k:'d',br:[[Lp('L1')],[Lp('L2')]],main:[Sw(true)]}
  );
  const cf=pick(cfgs);
  const build=(cfg,mod)=>{
    if(cfg.k==='s'){let it=clone(cfg.items);
      if(mod==='flip')it=it.map(x=>x.t==='switch'?Object.assign(x,{on:!x.on}):x);
      if(mod==='swap'){const hasM=it.some(x=>x.t==='moteur');it=it.map(x=>hasM?(x.t==='moteur'?Lp('L2'):x):(x.t==='lamp'?Mo():x));}
      if(mod==='extra')it.push(Lp('L3'));
      if(mod==='deriv'){const l=it.filter(x=>x.t==='lamp');return deriv(l.map(x=>[x]),{main:it.filter(x=>x.t!=='lamp')});}
      return serie(it,{noPile:mod==='nopile'});}
    let br=cfg.br.map(clone),main=clone(cfg.main||[]);
    if(mod==='flip')main=main.map(x=>Object.assign(x,{on:!x.on}));
    if(mod==='extra')br.push([Lp('L3')]);
    if(mod==='serie')return serie(br.flat().concat(main));
    return deriv(br,{main,noPile:mod==='nopile'});
  };
  const hasSw=(cf.items||cf.main||[]).some(x=>x.t==='switch');
  const nL=(cf.items||(cf.br||[]).flat()).filter(x=>x.t==='lamp').length;
  let mods=['nopile','extra'];
  if(hasSw)mods.push('flip');
  if(cf.k==='d')mods.push('serie');
  if(cf.k==='s'&&nL===2)mods.push('deriv');
  if(cf.k==='s'&&nL===1)mods.push('swap');
  if(cf.k==='s'&&nL===0)mods.push('swap');
  mods=shuffle(mods).slice(0,2);
  const WHY={nopile:"Ce schéma n'a pas de pile.",extra:"Ce schéma a une lampe de trop.",flip:"Regarde l'interrupteur : il n'est pas dans le bon état.",serie:"Ce schéma est en série (une seule boucle), pas en dérivation.",deriv:"Ce schéma est en dérivation (avec des nœuds), pas en série.",swap:"Ce schéma n'a pas les bons composants : regarde bien les cercles (croix ou M ?)."};
  const nolab=c=>{c.edges.forEach(e=>{if(e.t==='lamp')e.lab='';});return c;};
  const ch=[C('ok',drawCircuit(nolab(build(cf,null)),{res:{byId:{}},scale:.8}))].concat(mods.map(m=>C(m,drawCircuit(nolab(build(cf,m)),{res:{byId:{}},scale:.8}),WHY[m])));
  return Q('schema',level,`Quel schéma correspond à ce montage : <b>${cf.d}</b> ?`,ch,'ok',
    "<p>Vérifie un par un : la pile, chaque composant, l'état de l'interrupteur, et s'il y a une ou plusieurs boucles.</p>",
    `<p>Le bon schéma contient ${cf.d} :</p><div class="center">${drawCircuit(nolab(build(cf,null)),{scale:.75})}</div>`);
}

function genFils(level){
  const sets=[
    {d:'une pile, un moteur et un interrupteur',items:[Mo(),Sw(true)]},
    {d:'une pile et une lampe',items:[Lp('L')]},
    {d:'une pile, une lampe et un interrupteur',items:[Lp('L'),Sw(true)]},
    {d:'une pile, deux lampes et un interrupteur',items:[Lp('L1'),Sw(true),Lp('L2')]},
    {d:'une pile, une lampe, un moteur et un interrupteur',items:[Lp('L'),Sw(true),Mo()]}
  ];
  const s=pick(level===1?sets.slice(0,3):sets);
  const n=s.items.length+1;
  const show=level===2&&Math.random()<.5;
  const ch=[];for(let k=Math.max(2,n-1);ch.length<4;k++)ch.push(C(String(k),k+' fils',k<n?"Il en manque un : n'oublie pas le fil qui revient à la pile pour fermer la boucle.":"Trop de fils : dans une boucle simple, il faut autant de fils que de composants."));
  return Q('fils',level,`On veut réaliser un circuit en série avec ${s.d}. Combien faut-il de fils de connexion ?${show?`<div class="center">${drawCircuit(serie(s.items.map(x=>Object.assign({},x,{lab:''}))),{res:{byId:{}},scale:.8})}</div>`:''}`,
    ch,String(n),"<p>Chaque composant est relié au suivant par un fil, et le dernier revient à la pile.</p>",
    `<p>Il y a ${n} composants (la pile compte !), donc <b>${n} fils</b> : dans une boucle simple, autant de fils que de composants.</p>`);
}
/* ================= la diode électroluminescente (DEL) =================
   Ce qu'on vérifie : la DEL ne laisse passer le courant que dans un sens. Les pièges visés :
   croire qu'elle s'allume dans les deux sens comme une lampe ; oublier qu'en série, une DEL
   dans le sens bloquant éteint aussi la lampe ; oublier qu'en retournant la pile, on change
   le sens du courant. La réponse est toujours calculée par solve(), jamais écrite à la main. */
const SENS_HINT="<p>Le courant sort par la borne <b>+</b> de la pile (le grand trait). Suis-le avec ton doigt jusqu'à la DEL : arrive-t-il sur la <b>base du triangle</b> (sens passant) ou sur la <b>barre</b> (sens bloquant) ?</p>";
const delOn=(c,id)=>solve(c).byId[id||'D'].lvl!=='off';
function genDel(level){
  const r=Math.random();
  // questions de cours
  if(r<.22){
    const QS=[
      {p:"Une DEL laisse passer le courant…",c:[C('un','dans un seul sens'),C('deux','dans les deux sens',"Ça, c'est une lampe. La DEL est une diode : elle ne laisse passer le courant que dans un seul sens, le sens passant."),C('jamais','jamais',"Si : dans le sens passant, le courant la traverse et elle s'allume.")],ok:'un',
       e:"<p>Une DEL ne laisse passer le courant que <b>dans un seul sens</b> : le <b>sens passant</b>. Dans l'autre sens (sens bloquant), elle reste éteinte et bloque le courant.</p>"},
      {p:"Pour qu'une DEL s'allume, sa patte la plus longue doit être reliée du côté de…",c:[C('plus','la borne + de la pile'),C('moins','la borne − de la pile',"C'est l'inverse : la patte la plus longue est la borne + de la DEL, on la relie du côté du + de la pile."),C('egal',"n'importe quelle borne","Non : la DEL n'a qu'un sens passant. Dans l'autre sens, elle reste éteinte.")],ok:'plus',
       e:"<p>La patte la plus longue de la DEL est sa borne <b>+</b>. On la relie du côté de la borne <b>+</b> de la pile : la DEL est alors dans le sens passant.</p>"},
      {p:"Une DEL branchée avec une pile reste éteinte, alors que le circuit est fermé. Que peut-on faire pour l'allumer ?",c:[C('ret','La retourner'),C('pile','Ajouter une deuxième pile',"Avec deux piles, le courant arrive toujours du même côté : la DEL reste dans le sens bloquant."),C('fil','Relier ses deux pattes avec un fil',"Ce fil la court-circuite : le courant passe par le fil et la DEL reste éteinte.")],ok:'ret',
       e:"<p>La DEL est dans le <b>sens bloquant</b>. Il faut la <b>retourner</b> (ou retourner la pile) pour qu'elle soit dans le sens passant.</p>"},
      {p:"Dans le symbole de la DEL, que montrent les deux petites flèches ?",c:[C('lum','Elle émet de la lumière'),C('sens','Le sens du courant',"Le sens passant, c'est la pointe du triangle qui le montre. Les flèches qui sortent, c'est la lumière."),C('pile','Où brancher la pile',"Non : les flèches sortent du symbole, comme la lumière qui sort de la DEL.")],ok:'lum',
       e:"<p>Les deux flèches qui sortent montrent que la DEL <b>émet de la lumière</b> (électroluminescente). La <b>pointe du triangle</b> montre le sens passant.</p>"}
    ];
    const x=pick(QS);
    return Q('del',level,x.p,x.c,x.ok,"<p>Une DEL, c'est une diode : pense à un tourniquet qui ne tourne que dans un sens.</p>",
      x.e+`<div class="center">${symbolSVG('del',1.3)}</div>`);
  }
  // pile + DEL (+ interrupteur fermé) : la DEL s'allume-t-elle ?
  if(r<.6||level===1&&r<.8){
    const rev=Math.random()<.5,items=[Dl('D',rev)];
    if(Math.random()<.5)items.push(Sw(true));
    const c=serie(shuffle(items));
    const pileRet=level===2&&Math.random()<.5;
    if(pileRet)setProp(c,'P','plus','a');
    const on=delOn(c);
    return Q('del',level,`${items.length>1?"L'interrupteur est fermé. ":''}La DEL s'allume-t-elle ?<div class="center">${drawCircuit(c,{res:{byId:{}},scale:.9})}</div>`,
      [C('oui','Oui, elle est dans le sens passant',"Suis le courant depuis la borne + : il arrive sur la barre de la DEL. Elle est dans le sens bloquant, elle reste éteinte."),
       C('non','Non, elle est dans le sens bloquant',"Suis le courant depuis la borne + : il arrive sur la base du triangle. La DEL est dans le sens passant, elle s'allume.")],
      on?'oui':'non',SENS_HINT,
      `<p>Le courant sort par la borne + de la pile${pileRet?' (attention, ici le + est en bas)':''}. Il arrive sur ${on?'la <b>base du triangle</b> : la DEL est dans le <b>sens passant</b>, elle s’allume.':'la <b>barre</b> : la DEL est dans le <b>sens bloquant</b>, elle reste éteinte.'}</p><div class="center">${drawCircuit(c,{scale:.8})}</div>`);
  }
  // DEL et lampe en série : une DEL bloquante éteint aussi la lampe
  if(r<.75){
    const rev=Math.random()<.5;
    const c=serie(shuffle([Dl('D',rev),Lp('L')]));
    const on=delOn(c);
    return Q('del',level,`Une DEL et une lampe sont branchées en série. Que se passe-t-il ?<div class="center">${drawCircuit(c,{res:{byId:{}},scale:.9})}</div>`,
      [C('deux','La DEL et la lampe s’allument',"La DEL est dans le sens bloquant : elle bloque le courant pour toute la boucle."),
       C('aucune','Les deux restent éteintes',"La DEL est dans le sens passant : le courant fait tout le tour de la boucle, les deux s'allument."),
       C('lampe','Seule la lampe s’allume',on?"La DEL est dans le sens passant : elle s'allume aussi.":"En série, il n'y a qu'une boucle : si la DEL bloque le courant, il ne passe pas non plus dans la lampe."),
       C('del','Seule la DEL s’allume',"En série, le même courant traverse la DEL et la lampe : elles sont allumées ou éteintes ensemble.")],
      on?'deux':'aucune',SENS_HINT+"<p>En série, il n'y a qu'une seule boucle.</p>",
      on?`<p>La DEL est dans le <b>sens passant</b> : le courant fait tout le tour de la boucle, la DEL et la lampe s'allument.</p><div class="center">${drawCircuit(c,{scale:.8})}</div>`
        :`<p>La DEL est dans le <b>sens bloquant</b> : elle bloque le courant. En série, il n'y a qu'une boucle : <b>la lampe reste éteinte aussi</b>.</p><div class="center">${drawCircuit(c,{scale:.8})}</div>`);
  }
  // DEL et lampe en dérivation : chaque branche a sa boucle
  if(r<.9){
    const rev=Math.random()<.5;
    const c=deriv(shuffle([[Lp('L')],[Dl('D',rev)]]));
    const res=solve(c),on=res.byId.D.lvl!=='off',lamp=res.byId.L.lvl!=='off';
    const ok=on&&lamp?'deux':lamp?'lampe':on?'del':'aucune';
    const W={deux:"La DEL est dans le sens bloquant : elle reste éteinte.",aucune:"La lampe a sa propre boucle avec la pile : elle brille quoi que fasse la DEL.",lampe:"La DEL est dans le sens passant : elle s'allume aussi.",del:"La lampe a sa propre boucle avec la pile : elle brille."};
    return Q('del',level,`Une DEL et une lampe sont branchées en dérivation. Que se passe-t-il ?<div class="center">${drawCircuit(c,{res:{byId:{}},scale:.85})}</div>`,
      [C('deux','La DEL et la lampe s’allument',W.deux),C('lampe','Seule la lampe s’allume',W.lampe),C('aucune','Les deux restent éteintes',W.aucune),C('del','Seule la DEL s’allume',W.del)],
      ok,SENS_HINT+"<p>En dérivation, chaque branche a sa propre boucle avec la pile.</p>",
      `<p>En dérivation, la lampe a sa propre boucle : elle <b>brille</b>. La DEL est dans le ${on?'<b>sens passant</b> : elle s’allume aussi':'<b>sens bloquant</b> : elle reste éteinte, mais elle ne coupe pas la branche de la lampe'}.</p><div class="center">${drawCircuit(c,{scale:.75})}</div>`);
  }
  // on retourne la pile
  const c=serie([Dl('D',false),Sw(true)]);
  const c2=setProp(serie([Dl('D',false),Sw(true)]),'P','plus','a');
  return Q('del',level,`Ici, la DEL est allumée. On retourne la pile. Que fait la DEL ?<div class="duo"><div>${drawCircuit(c,{scale:.75})}<p class="small center">Avant</p></div><div>${drawCircuit(c2,{res:{byId:{}},scale:.75})}<p class="small center">Pile retournée</p></div></div>`,
    [C('eteint','Elle s’éteint'),C('reste','Elle reste allumée',"En retournant la pile, le courant change de sens : il arrive maintenant sur la barre de la DEL, le sens bloquant."),C('plus','Elle brille plus fort',"Retourner la pile ne donne pas plus de courant : il change de sens, et la DEL le bloque.")],
    'eteint',"<p>Retourner la pile, c'est changer le sens du courant.</p>",
    `<p>En retournant la pile, on change le <b>sens du courant</b>. La DEL se retrouve dans le <b>sens bloquant</b> : elle s'éteint.</p><div class="center">${drawCircuit(c2,{scale:.75})}</div>`);
}
/* ================= dessiner un schéma (compétence « dessin ») =================
   L'élève dessine sur une grille de 4 × 3 points : il choisit un outil (fil, pile, lampe…),
   puis touche un trait de la grille pour y poser ce symbole. Pourquoi une grille plutôt qu'un
   dessin libre au doigt : on peut corriger automatiquement et expliquer l'erreur (choix du
   sponsor, 11/10/2026). La correction ne compare pas avec un dessin modèle : elle suit les
   boucles du circuit dessiné (réduction série / dérivation), donc toute disposition juste est
   acceptée, comme sur le cahier. */
const GW=4,GH=3,GS=90;
const DTYPES={fil:'Fil',pile:'Pile',lampe:'Lampe',moteur:'Moteur',ko:'Interr. ouvert',kf:'Interr. fermé',gomme:'Gomme'};
const DLEAF={lampe:'L',moteur:'M',ko:'Ko',kf:'Kf'};
const DNOM={lampe:'Une lampe est court-circuitée',moteur:'Le moteur est court-circuité',ko:'Un interrupteur est court-circuité',kf:'Un interrupteur est court-circuité'};
/* un trait de la grille : « h2_0 » = horizontal partant du point (2,0) ; « v1_0 » = vertical */
function segEnds(k){const [x,y]=k.slice(1).split('_').map(Number);return k[0]==='h'?[[x,y],[x+1,y]]:[[x,y],[x,y+1]];}
function allSegs(){const r=[];for(let y=0;y<GH;y++)for(let x=0;x+1<GW;x++)r.push('h'+x+'_'+y);for(let y=0;y+1<GH;y++)for(let x=0;x<GW;x++)r.push('v'+x+'_'+y);return r;}
const pid=(x,y)=>'p'+x+'_'+y;
/* la grille dessinée devient un circuit comme les autres (pour drawCircuit et solve) */
function gridCircuit(grid,crop){
  const c=mk();
  // crop : seulement les points utilisés (schéma modèle, sans la grille vide autour)
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(!crop)c.nodes[pid(x,y)]=[x*GS,y*GS];
  let nl=0,nm=0,nk=0;const deg={};
  Object.keys(grid).forEach(k=>{
    const [[x1,y1],[x2,y2]]=segEnds(k),a=pid(x1,y1),b=pid(x2,y2),t=grid[k];
    deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1;c.nodes[a]=[x1*GS,y1*GS];c.nodes[b]=[x2*GS,y2*GS];
    if(t==='fil')c.edges.push({t:'wire',a,b});
    else if(t==='pile')c.edges.push({t:'pile',id:'P',a,b,plus:'a'});
    else if(t==='lampe')c.edges.push({t:'lamp',id:'L'+(++nl),a,b,lab:''});
    else if(t==='moteur')c.edges.push({t:'moteur',id:'M'+(++nm),a,b});
    else c.edges.push({t:'switch',id:'K'+(++nk),a,b,on:t==='kf'});
  });
  // un point où se rejoignent trois traits ou plus est un nœud : on le dessine en noir
  for(const p in deg)if(deg[p]>=3)c.dots.push(p);
  return c;
}
/* o.edit : zones à toucher ; o.lit : lampes allumées (schéma juste) ; o.bad : points entourés en rouge ;
   o.crop : schéma modèle, sans la grille */
function drawGrid(grid,o){
  o=o||{};
  const c=gridCircuit(grid,o.crop);
  let under='',over='';
  if(!o.crop)allSegs().forEach(k=>{
    const [[x1,y1],[x2,y2]]=segEnds(k);
    if(!grid[k])under+=`<line x1="${x1*GS}" y1="${y1*GS}" x2="${x2*GS}" y2="${y2*GS}" class="seg0"/>`;
    if(o.edit)over+=k[0]==='h'
      ?`<rect x="${x1*GS+12}" y="${y1*GS-24}" width="${GS-24}" height="48" class="segtap" data-act="seg" data-k="${k}" role="button" aria-label="trait"/>`
      :`<rect x="${x1*GS-24}" y="${y1*GS+12}" width="48" height="${GS-24}" class="segtap" data-act="seg" data-k="${k}" role="button" aria-label="trait"/>`;
  });
  if(!o.crop)for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)under+=`<circle cx="${x*GS}" cy="${y*GS}" r="3" class="gp"/>`;
  const bad=(o.bad||[]).map(([x,y])=>`<circle cx="${x*GS}" cy="${y*GS}" r="11" class="gpbad"/>`).join('');
  const res=o.lit&&Object.values(grid).filter(t=>t==='pile').length===1?solve(c):{byId:{}};
  return drawCircuit(c,{res,under,over:bad+over,margin:34,alt:o.alt||'Ton schéma'});
}
/* arbre du circuit : feuilles L, M, Ko, Kf ; S = en série, P = en dérivation (ordre sans importance) */
function mkT(kind,kids){let k=[];kids.forEach(x=>{if(x.k===kind)k=k.concat(x.c);else k.push(x);});return k.length===1?k[0]:{k:kind,c:k};}
function tstr(t){return t.c?t.k+'('+t.c.map(tstr).sort().join(',')+')':t.k;}
function tleaves(t,acc){acc=acc||{L:0,M:0,Ko:0,Kf:0};if(t.c)t.c.forEach(x=>tleaves(x,acc));else acc[t.k]++;return acc;}
function hasP(t){return !!t.c&&(t.k==='P'||t.c.some(hasP));}
const BOUCLE="Je n'arrive pas à suivre le courant : vérifie que chaque composant est sur une boucle complète qui part de la pile et y revient.";
/* analyse d'un dessin : {tree} si c'est un vrai circuit, sinon {err, why, pts} */
function analyse(grid){
  const keys=Object.keys(grid);
  if(!keys.length)return {err:'vide',why:'Ta grille est vide : dessine le circuit.'};
  const deg={};keys.forEach(k=>segEnds(k).forEach(([x,y])=>{const p=pid(x,y);deg[p]=(deg[p]||0)+1;}));
  const nPiles=keys.filter(k=>grid[k]==='pile').length;
  if(!nPiles)return {err:'nopile',why:'Il manque la pile : sans générateur, aucun courant ne circule.'};
  if(nPiles>1)return {err:'piles',why:"Ce montage n'a qu'une seule pile : enlève celle en trop."};
  const free=Object.keys(deg).filter(p=>deg[p]===1);
  if(free.length)return {err:'bout',why:"Un fil ou un composant a un bout libre (entouré en rouge) : la boucle n'est pas fermée, le courant ne peut pas circuler.",
    pts:free.map(p=>p.slice(1).split('_').map(Number))};
  // des points reliés par des fils ne font qu'un seul point électrique
  const up={};const f=p=>{while(up[p])p=up[p];return p;};
  // des fils qui se referment sur eux-mêmes ne servent à rien : sur le cahier, ils seraient comptés faux
  let tour=false;
  keys.forEach(k=>{if(grid[k]!=='fil')return;const [a,b]=segEnds(k).map(([x,y])=>f(pid(x,y)));if(a!==b)up[a]=b;else tour=true;});
  if(tour)return {err:'fils',why:'Des fils forment une boucle sans aucun composant : efface les fils en trop.'};
  const comps=keys.filter(k=>grid[k]!=='fil').map(k=>{const [a,b]=segEnds(k).map(([x,y])=>f(pid(x,y)));return {t:grid[k],a,b};});
  const pile=comps.find(e=>e.t==='pile');
  if(pile.a===pile.b)return {err:'ccpile',why:"Court-circuit de la pile : des fils relient directement ses deux bornes. Le courant devient très fort : danger d'incendie !"};
  const cc=comps.find(e=>e.a===e.b);
  if(cc)return {err:'cc',why:`${DNOM[cc.t]} : un fil relie ses deux bornes, le courant passe par ce fil au lieu du composant.`};
  const used=new Set();comps.forEach(e=>{used.add(e.a);used.add(e.b);});
  if(Object.keys(deg).some(p=>!used.has(f(p))))return {err:'fil',why:"Un morceau de fil n'est relié à aucun composant : efface-le."};
  const A=pile.a,B=pile.b;
  let E=comps.filter(e=>e!==pile).map(e=>({a:e.a,b:e.b,t:{k:DLEAF[e.t]}}));
  for(let tour=0;tour<100;tour++){
    if(E.some(e=>e.a===e.b))return {err:'boucle',why:BOUCLE};
    let fait=false;
    // dérivation : deux morceaux entre les deux mêmes points
    for(let i=0;i<E.length&&!fait;i++)for(let j=i+1;j<E.length&&!fait;j++){
      const e=E[i],g=E[j];
      if((e.a===g.a&&e.b===g.b)||(e.a===g.b&&e.b===g.a)){E.splice(j,1);e.t=mkT('P',[e.t,g.t]);fait=true;}
    }
    if(fait)continue;
    // série : un point (autre que les bornes de la pile) où seuls deux morceaux se touchent
    const inc={};E.forEach(e=>{(inc[e.a]=inc[e.a]||[]).push(e);(inc[e.b]=inc[e.b]||[]).push(e);});
    for(const n in inc){
      if(n===A||n===B)continue;
      if(inc[n].length===1)return {err:'boucle',why:BOUCLE};
      if(inc[n].length===2){
        const [e,g]=inc[n],oa=e.a===n?e.b:e.a,ob=g.a===n?g.b:g.a;
        E=E.filter(x=>x!==e&&x!==g);E.push({a:oa,b:ob,t:mkT('S',[e.t,g.t])});fait=true;break;
      }
    }
    if(!fait)break;
  }
  if(E.length===1&&((E[0].a===A&&E[0].b===B)||(E[0].a===B&&E[0].b===A)))return {tree:E[0].t};
  return {err:'boucle',why:BOUCLE};
}
function nbx(n,mot,fem){
  if(n===0)return (fem?'aucune ':'aucun ')+mot;
  if(n===1)return (fem?'une ':'un ')+mot;
  return (['','','deux','trois','quatre'][n]||String(n))+' '+mot+'s';
}
/* compare le dessin au montage demandé ; why : une phrase qui dit ce qui ne va pas */
function judge(grid,q){
  const r=analyse(grid);
  if(r.err)return {ok:false,code:r.err,why:r.why,pts:r.pts};
  const got=tstr(r.tree);
  if(got===q.target)return {ok:true,code:got.slice(0,40)};
  const a=tleaves(r.tree),b=tleaves(q.tt),nK=x=>x.Ko+x.Kf;
  let why='';
  if(a.L!==b.L)why=`Le montage demande ${nbx(b.L,'lampe',true)}, et ton schéma en a ${a.L}.`;
  else if(a.M!==b.M)why=`Le montage demande ${nbx(b.M,'moteur')}, et ton schéma en a ${a.M}.`;
  else if(nK(a)!==nK(b))why=nK(b)?`Le montage demande ${nbx(nK(b),'interrupteur')}, et ton schéma en a ${nK(a)}.`:"Ce montage n'a pas d'interrupteur.";
  else if(a.Ko!==b.Ko)why=b.Ko>a.Ko?"Ton interrupteur est fermé, mais on le veut ouvert : un trait levé qui ne touche pas le deuxième point.":"Ton interrupteur est ouvert, mais on le veut fermé : un trait couché qui relie les deux points.";
  else if(!hasP(q.tt))why="Ton circuit a plusieurs boucles (des branches, avec des nœuds) : c'est une dérivation. On veut un circuit en série, avec une seule boucle.";
  else if(!hasP(r.tree))why="Ton circuit n'a qu'une seule boucle : il est en série. En dérivation, il faut des branches qui partent d'un nœud et se rejoignent.";
  else why="Les bons composants sont là, mais pas au bon endroit : relis dans quelle branche va chaque composant (la branche principale est celle de la pile).";
  return {ok:false,code:got.slice(0,40),why};
}
/* schémas modèles : un rectangle avec la pile à gauche (série), ou deux branches (dérivation) */
function refSerie(items){const g={v0_0:'pile'};['h0_0','h1_0','v2_0','h1_1','h0_1'].forEach((k,i)=>g[k]=items[i]||'fil');return g;}
function refDeriv(b1,b2,main){
  const g={v0_0:'pile',h0_0:main||'fil',h1_0:'fil',v1_0:b1[0],v2_0:b2[0]};
  if(b1.length>1||b2.length>1){g.v0_1='fil';g.v1_1=b1[1]||'fil';g.v2_1=b2[1]||'fil';g.h0_2='fil';g.h1_2='fil';}
  else{g.h0_1='fil';g.h1_1='fil';}
  return g;
}

function genDessin(level){
  // D'abord série ou dérivation à pile ou face, puis un montage de ce type : sans ça, le tirage
  // suivait le nombre de montages de chaque sorte (au niveau 1, il n'y avait que des séries ;
  // signalé par le sponsor le 11/10/2026).
  const pool=DCFG.filter(x=>x.lv===level),der=pool.filter(x=>x.t.indexOf('P(')>=0),ser=pool.filter(x=>x.t.indexOf('P(')<0);
  const cf=pick(der.length&&ser.length?(Math.random()<.5?der:ser):pool);
  const tt=analyse(cf.ref).tree,estDer=hasP(tt);
  let concept=estDer?"<p>En <b>dérivation</b>, le circuit a plusieurs boucles : les branches partent d'un nœud (point noir) et se rejoignent.</p>"
    :"<p>En <b>série</b>, tout est sur une seule boucle : la pile, puis chaque composant l'un après l'autre.</p>";
  if(cf.main)concept+="<p>L'interrupteur sur la branche principale commande les deux branches.</p>";
  if(cf.branche)concept+="<p>L'interrupteur dans une branche ne commande que la lampe de sa branche.</p>";
  const hint=(estDer?"<p>Fais un rectangle avec la pile à gauche, puis ajoute une deuxième branche verticale entre le fil du haut et le fil du bas.</p>"
    :"<p>Une seule boucle : pars de la pile, pose chaque composant l'un après l'autre sur le même chemin, puis reviens à la pile avec des fils.</p>")
    +(cf.main?"<p>La branche principale, c'est celle où se trouve la pile.</p>":'');
  return {skill:'dessin',level,draw:true,target:cf.t,tt,choices:[],exp:{c:cf.t},
    prompt:`Dessine le schéma normalisé de ce montage : <b>${cf.d}</b>.`,hint,
    explain:`${concept}<p>Un schéma juste :</p><div class="center">${drawGrid(cf.ref,{lit:true,crop:true,alt:'Un schéma juste'})}</div><p class="small">D'autres dispositions sont justes aussi : ce qui compte, ce sont les composants et les boucles.</p>`};
}

  {t:'Circuit fermé, circuit ouvert',body:()=>`<p>Pour qu'une lampe brille, il faut deux choses :</p>

    <div class="duo"><div>${drawCircuit(serie([Lp('L'),Sw(true)].map(x=>{x.lab='';return x;})),{scale:.75})}<p class="small center">Interrupteur fermé : la lampe brille.</p></div>
    <div>${drawCircuit(serie([Lp('L'),Sw(false)].map(x=>{x.lab='';return x;})),{scale:.75})}<p class="small center">Interrupteur ouvert : la boucle est coupée.</p></div></div>
    <div class="rulebox"><b>Le piège :</b> pour que le courant passe, l'interrupteur doit être <b>fermé</b>. Pense à un pont-levis : baissé (fermé), on traverse ; levé (ouvert), on ne passe plus.</div>`,
   q:{p:"Pour que le courant circule, l'interrupteur doit être…",c:[C('f','fermé'),C('o','ouvert',"Ouvert, il coupe la boucle comme un pont-levis levé : le courant ne passe plus.")],ok:'f'}},
  {t:'Le circuit en série',body:()=>{const c=serie([Lp('L1'),Lp('L2')]);setProp(c,'L1','out',true);return `<p>Dans un circuit <b>en série</b>, les composants sont branchés les uns après les autres : il n'y a <b>qu'une seule boucle</b>.</p>
    <p>Il faut autant de fils que de composants. Une pile, un moteur et un interrupteur, c'est 3 composants, donc <b>3 fils</b>.</p>
    <p>Si on dévisse une lampe, la boucle est coupée : <b>tout s'éteint</b>.</p><div class="center">${drawCircuit(c,{scale:.8})}</div><p class="small center">L1 dévissée : L2 s'éteint aussi.</p>`;},
   q:{p:'Yasmina veut un circuit avec une pile, un moteur et un interrupteur. Combien de fils lui faut-il ?',c:[C('2','2 fils',"Il manque le fil qui revient à la pile."),C('3','3 fils'),C('4','4 fils',"Un de trop : autant de fils que de composants.")],ok:'3'}},
  {t:"L'éclat des lampes en série",body:()=>`<p>Quand on ajoute des lampes identiques <b>en série</b>, elles se partagent la pile : chacune brille moins.</p>
    <div class="trio">${[1,2,3].map(n=>{const it=[];for(let i=1;i<=n;i++)it.push(Lp('L'+i));const c=serie(it);return `<div>${drawCircuit(c,{scale:.55})}<p class="small center"><b>${n} lampe${n>1?'s':''}</b> : ${['normal','faible','très faible'][n-1]}</p></div>`;}).join('')}</div>`,
   q:{p:'Une lampe seule branchée sur une pile brille…',c:[C('n','normalement'),C('f','faiblement',"Faiblement, c'est quand il y a 2 lampes en série."),C('t','très faiblement',"Très faiblement, c'est avec 3 lampes en série.")],ok:'n'}},
  {t:'Le circuit en dérivation',body:()=>{const c=deriv([[Lp('L1')],[Lp('L2')]]);setProp(c,'L1','out',true);return `<p>En <b>dérivation</b>, le circuit a plusieurs boucles. Les points noirs s'appellent des <b>nœuds</b> : le courant s'y sépare.</p>
    <div class="center">${drawCircuit(deriv([[Lp('L1')],[Lp('L2')]]),{scale:.8})}</div>
    <p>Chaque lampe a sa propre boucle avec la pile, donc :</p>
    <p>• des lampes identiques en dérivation brillent <b>normalement</b> ;<br>• si on dévisse L1, <b>L2 reste allumée</b> ;<br>• un interrupteur sur la branche de la pile commande tout, un interrupteur dans une branche ne commande que sa lampe.</p>
    <div class="center">${drawCircuit(c,{scale:.7})}</div><p class="small center">L1 dévissée : L2 brille toujours.</p>`;},
   q:{p:'En dérivation, on dévisse L1. Que fait L2 ?',c:[C('r','Elle reste allumée'),C('e','Elle s’éteint',"Ça, c'est en série ! En dérivation, L2 a sa propre boucle.")],ok:'r'}},
  {t:'Le court-circuit',body:()=>`<p>Un fil branché entre les deux bornes d'une lampe la <b>court-circuite</b> : le courant prend ce raccourci et la lampe s'éteint.</p>
    <div class="center">${drawCircuit(addShunt(serie([Lp('L1'),Lp('L2')]),'L1'),{scale:.75})}</div>
    <p>Si un fil relie directement les deux bornes de la <b>pile</b>, c'est un <b>court-circuit de la pile</b> : le courant devient très fort, la pile et les fils chauffent. <b>Risque d'incendie !</b></p>
    <div class="center">${drawCircuit(addShunt(serie([Lp('L'),Sw(true)].map(x=>{x.lab='';return x;})),'P'),{scale:.75})}</div>`,
   q:{p:"Quel est le danger d'un court-circuit de la pile ?",c:[C('i','L’incendie'),C('e','L’électrocution',"Une pile de classe ne peut pas t'électrocuter. Le danger, c'est qu'elle chauffe : l'incendie."),C('r','Aucun',"Si : la pile chauffe très fort.")],ok:'i'}},
  {t:'La diode électroluminescente (DEL)',body:()=>{const a=serie([Dl('D',false),Sw(true)]),b=serie([Dl('D',true),Sw(true)]);return `<p>Une <b>DEL</b> (diode électroluminescente) émet de la lumière, comme une lampe. Mais c'est une <b>diode</b> : elle ne laisse passer le courant que <b>dans un seul sens</b>.</p>
    <div class="center">${symbolSVG('del',1.4)}</div>
    <p class="small center">Son symbole : un triangle contre une barre ; les deux flèches, c'est la lumière.</p>
    <p>Le courant sort par la borne <b>+</b> de la pile. S'il arrive sur la <b>base du triangle</b>, la DEL est dans le <b>sens passant</b> : elle s'allume. S'il arrive sur la <b>barre</b>, elle est dans le <b>sens bloquant</b> : elle reste éteinte et bloque le courant.</p>
    <div class="duo"><div>${drawCircuit(a,{scale:.7})}<p class="small center">Sens passant : allumée.</p></div><div>${drawCircuit(b,{scale:.7})}<p class="small center">Sens bloquant : éteinte.</p></div></div>
    <div class="rulebox"><b>Sur la vraie DEL :</b> la patte la plus longue est sa borne +. On la relie du côté de la borne + de la pile. Si la DEL reste éteinte, on la retourne.</div>
    <p class="small">En série, une DEL dans le sens bloquant coupe le courant de toute la boucle : la lampe s'éteint aussi.</p>`;},
   q:{p:'On retourne une DEL qui était allumée. Que se passe-t-il ?',c:[C('e','Elle s’éteint'),C('r','Elle reste allumée',"Non : la DEL ne laisse passer le courant que dans un sens. Retournée, elle est dans le sens bloquant.")],ok:'e'}},
  {t:'La sécurité électrique',body:()=>`<p>Le courant peut être dangereux pour le corps à partir de <b>50 V</b> (en milieu sec). Les prises de la maison sont en <b>230 V</b> : elles sont dangereuses. Les piles de classe (4,5 V) sont sans danger, c'est pour ça qu'on les utilise.</p>
    <div class="rulebox"><b>Il ne faut surtout pas :</b><br>• mettre les doigts ou un objet conducteur dans une prise ;<br>• rincer un appareil encore branché ou l'utiliser avec les mains mouillées ;<br>• manipuler un fil électrique abîmé et branché.</div>`,
   q:{p:"Une prise de courant de la maison est-elle dangereuse ?",c:[C('o','Oui, elle est en 230 V'),C('n','Non, seulement les grosses machines',"Les prises sont en 230 V, bien plus que 50 V : elles peuvent électrocuter.")],ok:'o'}},
  {t:'Dessiner un schéma',body:()=>`<p>Pour dessiner un schéma <b>normalisé</b> :</p>
    <p>• un <b>symbole</b> pour chaque composant ;<br>• des fils en <b>traits droits</b>, avec des <b>angles droits</b> ;<br>• en dérivation, un <b>point noir</b> (un nœud) là où le courant se sépare.</p>
    <div class="duo"><div>${drawGrid(refSerie(['lampe','kf']),{lit:true,crop:true,alt:'Schéma en série'})}<p class="small center">En série : une seule boucle.</p></div>
    <div>${drawGrid(refDeriv(['lampe'],['lampe']),{lit:true,crop:true,alt:'Schéma en dérivation'})}<p class="small center">En dérivation : deux boucles, deux nœuds.</p></div></div>
    <div class="rulebox"><b>À toi de dessiner :</b> dans « S'entraîner », choisis « Dessiner un schéma ». Tu prends un outil (fil, pile, lampe…), puis tu touches un trait de la grille pour l'y poser.</div>`,
   q:{p:'Dans un schéma normalisé, les fils se dessinent…',c:[C('d','en traits droits, avec des angles droits'),C('c','avec des courbes, comme les vrais fils',"Non : un schéma simplifie. Traits droits et angles droits, pour que tout le monde le lise facilement."),C('n','on ne les dessine pas',"Si : les fils montrent le chemin du courant. Sans eux, pas de boucle.")],ok:'d'}},
  {t:'À retenir',recap:true}
];
function learn(step){S={screen:'learn',ls:step||0,done:false};renderLearn();}
function renderLearn(){
  const st=LEARN[S.ls];let body;
  if(st.recap){
    body=`<div class="card"><p>• Un circuit a toujours un <b>générateur</b> et doit être <b>fermé</b>.</p><p>• Interrupteur <b>fermé</b> = le courant passe.</p><p>• <b>Série</b> : une seule boucle. 1 lampe normal, 2 faible, 3 très faible. Une lampe dévissée : tout s'éteint.</p><p>• <b>Dérivation</b> : plusieurs boucles, chaque lampe brille normalement et reste allumée si on dévisse l'autre.</p><p>• <b>Court-circuit</b> de la pile : risque d'incendie.</p><p>• Une <b>DEL</b> ne laisse passer le courant que dans un sens : sens <b>passant</b>, elle s'allume ; sens <b>bloquant</b>, elle reste éteinte.</p><p>• Danger dès <b>50 V</b>, les prises sont en <b>230 V</b>.</p><p>• Un <b>schéma</b> : un symbole par composant, des traits droits, des angles droits.</p></div>
      <div class="btns"><button class="btn primary" data-act="labo" data-primary>Aller au labo</button><button class="btn" data-act="trainSetup">Je m'entraîne</button></div>`;
  }else{
    const q=st.q;
    body=`${st.body()}<div class="card"><p class="q-prompt"><b>À toi :</b> ${q.p}</p>
      <div class="choices">${q.c.map(c=>`<button class="choice" data-act="lchoose" data-v="${c.v}">${c.label}</button>`).join('')}</div><div id="lfb"></div></div>
      <div class="btns" id="lacts">${S.done?'':''}</div>`;
  }
  show(`${topbar('Apprendre')}<main class="wrap"><p class="small">Fiche ${S.ls+1} sur ${LEARN.length}</p><div class="dots" aria-hidden="true">${LEARN.map((x,i)=>`<i class="${i<S.ls?'done':i===S.ls?'cur':''}"></i>`).join('')}</div><h2>${st.t}</h2><div style="margin-top:8px">${body}</div></main>`);
}
function learnChoose(el){
  const q=LEARN[S.ls].q,v=el.dataset.v,fb=document.getElementById('lfb');
  if(v===q.ok){
    app.querySelectorAll('.choice').forEach(c=>{c.disabled=true;c.classList.add('locked');});
    el.classList.add('good');
    fb.innerHTML=`<div class="fb good"><p><b>${pick(CHEER)}</b></p></div>`;
    document.getElementById('lacts').innerHTML=`<button class="btn primary" data-act="lnext" data-primary>${S.ls<LEARN.length-2?'Fiche suivante':'Terminer'}</button>`;
  }else{
    el.classList.add('bad');el.disabled=true;
    fb.innerHTML=`<div class="fb hint"><p><b>Pas tout à fait.</b> ${q.c.find(c=>c.v===v).why}</p></div>`;
  }
}

/* ================= Labo ================= */
const LAB=[
  {t:'Une lampe',mk:()=>serie([Lp('L1'),Sw(false,'K')]),sh:[['L1','sur L1'],['P','sur la pile']]},
  {t:'Deux lampes en série',mk:()=>serie([Lp('L1'),Sw(false,'K'),Lp('L2')]),sh:[['L1','sur L1'],['P','sur la pile']]},
  {t:'Deux lampes en dérivation',mk:()=>deriv([[Lp('L1')],[Lp('L2'),Sw(true,'K2')]],{main:[Sw(false,'K1')]}),sh:[['L1','sur L1']]},
  {t:'Lampe et moteur',mk:()=>serie([Lp('L1'),Sw(false,'K'),Mo()]),sh:[['L1','sur L1'],['P','sur la pile']]},
  {t:'DEL et lampe',mk:()=>serie([Dl('D',true),Sw(false,'K'),Lp('L1')]),sh:[['P','sur la pile']]}
];
function labo(i){
  const L=LAB[i||0];const c=L.mk();
  L.sh.forEach(([id])=>addShunt(c,id,false));
  S={screen:'labo',li:i||0,c};renderLab();
}
function renderLab(){
  const L=LAB[S.li],c=S.c,res=solve(c);
  const parts=[];
  c.edges.forEach(e=>{
    if(e.t==='lamp')parts.push(`<li><b>${e.lab}</b> ${e.out?'est dévissée':LAMPTXT[res.byId[e.id].lvl]}</li>`);
    if(e.t==='moteur')parts.push(`<li><b>Le moteur</b> ${MOTTXT[res.byId[e.id].lvl]}</li>`);
    if(e.t==='del')parts.push(`<li><b>La DEL</b> ${DELTXT(res.byId[e.id])}</li>`);
  });
  const notes=[];
  if(res.danger)notes.push(`<div class="fb bad still"><p><b>Danger : court-circuit de la pile !</b> Le fil rouge relie ses deux bornes sans rien entre elles. Le courant devient très fort, la pile chauffe : risque d'incendie. En vrai, il faut débrancher tout de suite.</p></div>`);
  c.shunts.forEach(sh=>{const e=c.edges.find(x=>x.id===sh.target);if(sh.on&&e&&e.t==='lamp'&&!e.out)notes.push(`<p>${e.lab} est court-circuitée : le courant passe par le fil rouge au lieu de la lampe.</p>`);});
  if(res.I<0.01&&c.edges.some(e=>e.t==='del'&&res.byId[e.id].bloque&&c.edges.every(x=>x.t!=='switch'||x.on)))notes.push("<p>La DEL est dans le sens bloquant : elle empêche le courant de circuler dans toute la boucle. Retourne-la !</p>");
  else if(res.I<0.01)notes.push("<p>Le courant ne circule pas : aucune boucle fermée ne passe par la pile.</p>");
  else if(!res.danger)notes.push(c.kind==='serie'?"<p>Une seule boucle : le courant traverse tous les composants l'un après l'autre.</p>":"<p>Dérivation : chaque branche fermée forme sa propre boucle avec la pile.</p>");
  show(`${topbar('Le labo')}<main class="wrap">
    <div class="chips">${LAB.map((x,i)=>`<button class="chip ${i===S.li?'on':''}" data-act="labPick" data-v="${i}">${x.t}</button>`).join('')}</div>
    <div class="card center labcard">${drawCircuit(c,{res,inter:true,scale:1,alt:'Circuit du labo'})}
      <p class="small">Touche un interrupteur pour l'ouvrir ou le fermer. Touche une lampe pour la dévisser ou la revisser.${c.edges.some(e=>e.t==='del')?' Touche la DEL pour la retourner.':''}</p>
      <div class="chips" style="justify-content:center">${L.sh.map(([id,lab])=>{const sh=c.shunts.find(s=>s.target===id);return `<button class="chip shchip ${sh.on?'on':''}" data-act="labShunt" data-v="${id}">${sh.on?'Retirer le fil '+lab:'Ajouter un fil '+lab}</button>`;}).join('')}</div></div>
    <div class="card"><ul class="state">${parts.join('')}</ul>${notes.join('')}</div>
    <div class="btns"><button class="btn ghost" data-act="labReset">Remettre à zéro</button><button class="btn" data-act="trainSetup">Je m'entraîne</button></div>
  </main>`);
}

/* ================= entraînement / évaluation ================= */
const CHEER=['Bravo !','Bien joué !','Exact !','Parfait !','Essai transformé !','Ça s’allume !'];
function levelChips(sel,mix){
  let s='<div class="chips">';
  if(mix)s+=`<button class="chip ${sel===0?'on':''}" data-act="lvl" data-v="0">Mixte<small>un peu de tout</small></button>`;
  for(const i of [1,2])s+=`<button class="chip ${sel===i?'on':''}" data-act="lvl" data-v="${i}">${LEVELS[i].t}<small>${LEVELS[i].d}</small></button>`;
  return s+'</div>';
}
function skillChips(sel){
  let s=`<div class="chips"><button class="chip ${sel==='all'?'on':''}" data-act="sk" data-v="all">Tout mélangé</button>`;
  for(const k in SKILLS)s+=`<button class="chip ${sel===k?'on':''}" data-act="sk" data-v="${k}">${SKILLS[k].label}</button>`;
  return s+'</div>';
}
function trainSetup(keep){
  if(!keep||S.screen!=='trainSetup')S={screen:'trainSetup',level:S.level||1,skill:S.skillPref||'all'};
  show(`${topbar("S'entraîner")}<main class="wrap">
    <h2>Choisis ton niveau</h2>${levelChips(S.level,false)}
    <h2>Que veux-tu travailler ?</h2>${skillChips(S.skill)}
    <div class="btns"><button class="btn primary" data-act="trainStart" data-primary>Commencer</button></div></main>`);
}
function evalSetup(keep){
  if(!keep||S.screen!=='evalSetup')S={screen:'evalSetup',level:S.evalLevel===undefined?0:S.evalLevel};
  show(`${topbar('Évaluation')}<main class="wrap">
    <h2>On passe à l'évaluation ?</h2>
    <p>10 questions sur toute la leçon, sans indice. Tu vois les corrections à la fin.</p>
    <h2 style="margin-top:14px">Niveau</h2>${levelChips(S.level,true)}
    <div class="btns"><button class="btn primary" data-act="evalStart" data-primary>Lancer l'évaluation</button></div></main>`);
}
const hasPic=q=>q.choices.some(c=>c.label.indexOf('<svg')>=0);
function qScreen(){
  const q=S.q,ev=S.mode==='eval';
  let head;
  if(ev){let d='';for(let i=0;i<S.total;i++)d+=`<i class="${i<S.i?'done':i===S.i?'cur':''}"></i>`;
    head=`<div class="dots" aria-hidden="true">${d}</div><p class="small">Question ${S.i+1} sur ${S.total} : ${SKILLS[q.skill].label.toLowerCase()}</p>`;}
  else head=`<p class="small">${SKILLS[q.skill].label}. ${S.okCount} réussie${S.okCount>1?'s':''} du premier coup sur ${S.tried}</p>`;
  const last=ev&&S.i===S.total-1;
  if(q.draw){S.grid={};S.tool=S.tool||'fil';S.bad=null;S.lit=false;S.locked=false;}
  show(`${topbar(ev?'Évaluation':"S'entraîner",ev?'quitEval':'trainSetup')}<main class="wrap">
    ${head}
    <div class="card"><div class="q-prompt">${q.prompt}</div>
      ${q.draw?drawEditor():`<div class="choices ${hasPic(q)?'pics':''}">${q.choices.map((c,i)=>`<button class="choice" data-act="choose" data-v="${esc(c.v)}">${hasPic(q)?`<span class="pl">${'ABCD'[i]}</span>`:''}${c.label}</button>`).join('')}</div>`}</div>
    <div id="hint"></div><div id="fb"></div>
    <div class="btns" id="acts">
      <button class="btn primary" data-act="check" data-primary>${ev?(last?'Valider et terminer':'Valider et continuer'):'Valider'}</button>
      ${ev?'':'<button class="btn ghost" data-act="hint">Un indice</button>'}
    </div></main>`);
  S.choice=null;S.attempts=0;q.t0=Date.now();
}
function setFb(html){document.getElementById('fb').innerHTML=html;}
function lockChoices(){
  app.querySelectorAll('.choice').forEach(c=>{c.classList.add('locked');c.disabled=true;
    if(c.dataset.v===S.q.exp.c)c.classList.add('good');else if(c.dataset.v===S.choice)c.classList.add('bad');});
}
/* entraînement sur un dessin : on peut corriger son dessin autant de fois qu'on veut,
   seul le premier essai compte dans le bilan (comme pour les autres questions) */
function checkDrawTrain(){
  const q=S.q;
  if(!Object.keys(S.grid).length){setFb('<div class="fb hint">Dessine ton schéma, puis valide.</div>');return;}
  const v=judge(S.grid,q);S.attempts++;
  if(S.attempts===1){S.tried++;if(v.ok){S.okCount++;S.streak++;}else S.streak=0;record(q,v.ok,v.code);}
  if(v.ok){
    S.locked=true;S.lit=true;S.bad=null;refreshDraw();
    let extra='';
    if(S.streak>=5&&S.level<2)extra=`<p>${S.streak} réussites d'affilée : tu peux passer au niveau Match.</p>`;
    setFb(`<div class="fb good"><p><b>${pick(CHEER)}</b> Ton schéma est juste${S.attempts>1?', après quelques corrections':''}.</p>${q.explain}${extra}</div>`);
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>${extra?'<button class="btn" data-act="levelup">Niveau Match</button>':''}`;
  }else{
    S.bad=v.pts||null;refreshDraw();
    setFb(`<div class="fb bad"><p><b>Pas tout à fait.</b> ${v.why}</p><p class="small">Corrige ton dessin, puis valide à nouveau.</p></div>`);
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="check" data-primary>Valider</button><button class="btn ghost" data-act="hint">Un indice</button><button class="btn ghost" data-act="reveal">Voir la correction</button>`;
  }
}
function checkTrain(){
  if(S.q.draw){checkDrawTrain();return;}
  if(!S.choice){setFb('<div class="fb hint">Choisis une réponse.</div>');return;}
  const q=S.q;S.attempts++;
  const ok=S.choice===q.exp.c;
  if(S.attempts===1){S.tried++;if(ok){S.okCount++;S.streak++;}else S.streak=0;record(q,ok,S.choice);}
  if(ok){
    lockChoices();
    let extra='';
    if(S.streak>=5&&S.level<2)extra=`<p>${S.streak} réussites d'affilée : tu peux passer au niveau Match.</p>`;
    setFb(`<div class="fb good"><p><b>${pick(CHEER)}</b>${S.attempts>1?' Tu as trouvé au deuxième essai.':''}</p>${q.explain}${extra}</div>`);
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>${extra?'<button class="btn" data-act="levelup">Niveau Match</button>':''}`;
  }else if(S.attempts===1){
    const c=q.choices.find(c=>c.v===S.choice);
    setFb(`<div class="fb bad"><p><b>Pas tout à fait.</b> ${c&&c.why?c.why:'Relis la question et réessaie.'}</p></div>`);
    app.querySelectorAll('.choice').forEach(b=>{if(b.dataset.v===S.choice){b.classList.remove('sel');b.classList.add('bad');b.disabled=true;}});
    S.choice=null;
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="check" data-primary>Réessayer</button><button class="btn ghost" data-act="hint">Un indice</button><button class="btn ghost" data-act="reveal">Voir la correction</button>`;
  }else revealTrain();
}
function revealTrain(){
  if(S.attempts===0){S.attempts=1;S.tried++;S.streak=0;record(S.q,false,null);}
  lockChoices();
  if(S.q.draw){S.locked=true;S.bad=null;refreshDraw();}
  setFb(`<div class="fb info"><p><b>Correction</b></p>${S.q.explain}</div>`);
  document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>`;
}
function nextTrain(){S.q=genQuestion(S.skill,S.level);qScreen();}

function evalStart(){
  const lvl=S.level;
  const skills=shuffle(EVAL_SKILLS.slice()).slice(0,10);
  if(!skills.includes('derivation'))skills[0]='derivation';
  if(!skills.includes('dessin'))skills[1]='dessin';
  if(!skills.includes('del'))skills[2]='del';
  const mix=[1,2,1,2,1,2,2,1,2,2];
  const qs=skills.map((s,i)=>genQuestion(s,lvl===0?mix[i]:lvl));
  S={screen:'eval',mode:'eval',evalLevel:lvl,level:lvl,qs,i:0,total:qs.length,results:[],t0:Date.now(),
    cle:window.miniprof?window.miniprof.debutEvaluation(lvl):null};
  S.q=qs[0];qScreen();
}
function checkEval(){
  if(S.q.draw){
    if(!Object.keys(S.grid).length){setFb('<div class="fb hint">Dessine ton schéma avant de continuer.</div>');return;}
    const v=judge(S.grid,S.q);
    S.results.push({q:S.q,ans:v.code,ok:v.ok,duree:secs(S.q),grid:Object.assign({},S.grid),why:v.why,pts:v.pts});
  }else{
    if(!S.choice){setFb('<div class="fb hint">Choisis une réponse avant de continuer.</div>');return;}
    S.results.push({q:S.q,ans:S.choice,ok:S.choice===S.q.exp.c,duree:secs(S.q)});
  }
  S.i++;
  if(S.i>=S.total){evalEnd();return;}
  S.q=S.qs[S.i];qScreen();
}
const lblOf=(q,v)=>{const c=q.choices.find(c=>c.v===v);return c?c.label:'';};
function evalEnd(){
  const res=S.results,score=res.filter(r=>r.ok).length,total=res.length;
  const duree=Math.round((Date.now()-S.t0)/1000);
  const sk={};
  res.forEach(r=>{const s=sk[r.q.skill]||(sk[r.q.skill]=[0,0]);s[1]++;if(r.ok)s[0]++;});
  if(window.miniprof)window.miniprof.reponse(res.map(r=>({competence:r.q.skill,juste:r.ok,mode:'v',difficulte:r.q.level,
    question:r.q.skill,reponse:r.ans,duree:r.duree,evaluation:S.cle})));
  let weakest=null,wp=2;for(const k in sk){const p=sk[k][0]/sk[k][1];if(p<wp){wp=p;weakest=k;}}
  const msg=score>=9?"Excellent ! Tu maîtrises le circuit électrique.":score>=7?"Très bien ! Il ne reste que quelques détails à revoir.":score>=5?"Bon début. Regarde les corrections, puis entraîne-toi encore un peu.":"Pas de panique : relis les fiches Apprendre, passe au labo, puis entraîne-toi.";
  const bars=Object.keys(sk).map(k=>{const p=Math.round(100*sk[k][0]/sk[k][1]);return `<div><div class="row" style="justify-content:space-between"><span>${SKILLS[k].label}</span><b>${sk[k][0]}/${sk[k][1]}</b></div><div class="bar"><i class="${p<50?'low':p<80?'mid':''}" style="width:${p}%"></i></div></div>`;}).join('');
  const rev=res.map((r,i)=>`<details class="rev ${r.ok?'okk':'koo'}"><summary>${r.ok?'✓':'✗'} Question ${i+1} : ${SKILLS[r.q.skill].label}</summary>
    <div class="q-prompt">${r.q.prompt}</div>
    ${r.q.draw?`<p>Ton schéma :</p><div class="center">${drawGrid(r.grid,{bad:r.pts})}</div>${r.ok?'':`<p>${r.why}</p>`}`
    :`<p>Ta réponse :</p><div class="ans">${lblOf(r.q,r.ans)}</div>
    ${r.ok?'':`<p>Bonne réponse :</p><div class="ans good">${lblOf(r.q,r.q.exp.c)}</div>`}`}
    <div class="fb info">${r.q.explain}</div></details>`).join('');
  S.screen='result';S.weakest=weakest;
  show(`${topbar('Résultat','home')}<main class="wrap">
    <div class="card center"><div class="score">${score}<span style="font-size:1.6rem;color:var(--muted)"> / ${total}</span></div>
      <p style="margin-top:10px">${msg}</p><p class="small">Temps : ${Math.floor(duree/60)} min ${duree%60} s</p></div>
    <h2>Par compétence</h2><div style="margin-top:10px">${bars}</div>
    <h2 style="margin:16px 0 6px">Les corrections</h2>${rev}
    <div class="btns">
      ${weakest&&wp<1?`<button class="btn primary" data-act="trainWeak" data-primary>Travailler : ${SKILLS[weakest].label}</button>`:''}
      <button class="btn" data-act="evalSetup">Recommencer</button><button class="btn ghost" data-act="home">Accueil</button>
    </div></main>`);
}

/* ================= bilan ================= */
function bilan(){
  const m=window.miniprof;
  if(m)location.href=m.racine+'#/module/'+encodeURIComponent(m.module)+'/bilan';
}

/* ================= actions ================= */
function act(a,el){
  switch(a){
    case 'home':home();break;
    case 'heroTog':heroOn=!heroOn;document.getElementById('heroSch').innerHTML=heroSVG()+`<span class="hero-tip">${heroOn?'Allumée !':'Touche l’interrupteur'}</span>`;break;
    case 'learn':learn(0);break;
    case 'lchoose':learnChoose(el);break;
    case 'lnext':if(S.ls<LEARN.length-1){S.ls++;renderLearn();}break;
    case 'labo':labo(0);break;
    case 'labPick':labo(Number(el.dataset.v));break;
    case 'labReset':labo(S.li);break;
    case 'labTog':{const e=S.c.edges.find(x=>x.id===el.dataset.id);if(e){if(e.t==='switch')e.on=!e.on;else if(e.t==='lamp')e.out=!e.out;else if(e.t==='del')e.rev=!e.rev;}
      const y=window.scrollY;renderLab();window.scrollTo(0,y);break;}
    case 'labShunt':{const sh=S.c.shunts.find(s=>s.target===el.dataset.v);if(sh)sh.on=!sh.on;const y=window.scrollY;renderLab();window.scrollTo(0,y);break;}
    case 'trainSetup':trainSetup(false);break;
    case 'lvl':S.level=Number(el.dataset.v);if(S.screen==='trainSetup')trainSetup(true);else evalSetup(true);break;
    case 'sk':S.skill=el.dataset.v;S.skillPref=S.skill;trainSetup(true);break;
    case 'trainStart':S={screen:'train',mode:'train',level:S.level,skill:S.skill,skillPref:S.skill,tried:0,okCount:0,streak:0};nextTrain();break;
    case 'trainWeak':S={screen:'train',mode:'train',level:1,skill:S.weakest,skillPref:S.weakest,tried:0,okCount:0,streak:0};nextTrain();break;
    case 'levelup':S.level=2;S.streak=0;nextTrain();break;
    case 'evalSetup':evalSetup(false);break;
    case 'evalStart':evalStart();break;
    case 'quitEval':evalSetup(false);break;
    case 'choose':S.choice=el.dataset.v;app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c===el));break;
    case 'check':S.mode==='eval'?checkEval():checkTrain();break;
    case 'hint':document.getElementById('hint').innerHTML=`<div class="fb hint"><p><b>Indice</b></p>${S.q.hint}</div>`;break;
    case 'reveal':revealTrain();break;
    case 'next':nextTrain();break;
    case 'bilan':bilan();break;
    case 'tool':S.tool=el.dataset.v;refreshDraw();break;
    case 'seg':{if(S.locked)break;const k=el.dataset.k;
      if(S.tool==='gomme'||S.grid[k]===S.tool)delete S.grid[k];else S.grid[k]=S.tool;
      S.bad=null;refreshDraw();break;}
    case 'clearGrid':if(!S.locked){S.grid={};S.bad=null;refreshDraw();}break;
  }
}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t);});
app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('input')){e.preventDefault();const p=app.querySelector('[data-primary]:not([disabled])');if(p)p.click();}
});
// window.__miniprofTirage n'existe que dans l'outil, jamais dans un navigateur.
// Les questions à dessiner n'ont pas de choix : tirage.py ne sait pas les vérifier, on les
// retire de ce qu'on lui donne, et testDessin() contrôle à la place les schémas modèles.
if(window.__miniprofTirage){testDessin();const G=Object.assign({},GEN);delete G.dessin;
  window.__miniprofTirage({GEN:G,LEVELS,LEARN,SKILLS,EVAL_SKILLS:EVAL_SKILLS.filter(k=>k!=='dessin')});return;}
home();

})();
</script>
