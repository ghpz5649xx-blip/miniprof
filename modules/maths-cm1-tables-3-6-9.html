<div id="app"></div>
<script>
(function(){
'use strict';
/* ================= MOTEUR : utilitaires ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[R(0,arr.length-1)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
// n éléments distincts de la liste, sans celui à exclure
function others(list,not,n){return shuffle(list.filter(x=>x!==not)).slice(0,n);}
// Une question : prompt et libellés en HTML écrit dans ce script (sinon passer par esc()).
// choices : liste de C(valeur, libellé, pourquoi c'est faux) ; correct : la valeur juste.
function Q(skill,level,prompt,choices,correct,hint,explain){
  return {skill,level,prompt,choices:shuffle(choices.slice()),exp:{c:correct},hint,explain};
}
const C=(v,label,why)=>({v:String(v),label,why:why||''});

/* ================= CONTENU : données de la leçon ================= */
// Pas de photos : le module suit le programme de CM1 (tables de multiplication, double, triple,
// multiples). Idée centrale : 6 = 2 × 3 et 9 = 3 × 3, donc la table de 6 est le double de la
// table de 3, et la table de 9 en est le triple. Les tables vont de × 1 à × 10.
const X=' × ';
// Choix numériques : la bonne réponse, puis des erreurs fréquentes [valeur, pourquoi c'est faux].
// Les valeurs en double, nulles ou non entières sont écartées ; on garde 3 mauvais choix au plus.
function opts(ok,cands){
  const seen=new Set([String(ok)]),out=[];
  for(const [v,w] of cands){
    if(!Number.isInteger(v)||v<=0||seen.has(String(v)))continue;
    seen.add(String(v));out.push(C(v,v,w));
  }
  return [C(ok,ok)].concat(out.slice(0,3));
}
// Pourquoi un nombre n'est pas dans la table de t : il tombe entre deux résultats de la table.
function entre(d,t){const f=Math.floor(d/t);return `${t}${X}${f} = ${t*f} et ${t}${X}${f+1} = ${t*(f+1)}`;}
// Tableau des trois tables, côte à côte (fiches Apprendre).
function tableau(){
  let h='<table class="tbl"><tr><th>× </th>';
  for(let n=1;n<=10;n++)h+=`<th>${n}</th>`;
  h+='</tr>';
  for(const t of [3,6,9]){
    h+=`<tr><th>${t}</th>`;
    for(let n=1;n<=10;n++)h+=`<td class="t${t}">${t*n}</td>`;
    h+='</tr>';
  }
  return h+'</table>';
}

/* ================= CONTENU : un générateur par compétence ================= */
// Règles (docs/module-html.md) : une seule bonne réponse, pas de choix en double, un « pourquoi »
// pour chaque mauvais choix, une correction qui dit la réponse ET pourquoi.
// Niveau 1 : le résultat direct ; niveau 2 : se servir d'un résultat connu ; niveau 3 : à l'envers
// et pièges (double et triple confondus, ajouter au lieu de multiplier).

// Table de 3
function genTable3(level){
  if(level===1){
    const n=R(1,10),p=3*n;
    return Q('table3',1,`Combien fait <span class="big">3${X}${n}</span> ?`,
      opts(p,[[p+3,`C'est 3${X}${n+1}.`],[p-3,`C'est 3${X}${n-1}.`],
        [n+3,`Tu as fait 3 + ${n}, une addition. Ici, on multiplie.`],
        [2*n,`C'est 2${X}${n}, la table de 2.`],[4*n,`C'est 4${X}${n}, la table de 4.`],
        [5*n,`C'est 5${X}${n}, la table de 5.`]]),String(p),
      `<p>Compte de 3 en 3 : 3, 6, 9, 12…</p>`,
      `<p>3${X}${n} = <b>${p}</b> : c'est ${n} fois 3.</p>`);
  }
  if(level===2){
    const n=R(2,10),p=3*n;
    return Q('table3',2,`Complète : <span class="big">3${X}___ = ${p}</span>`,
      opts(n,[[n+1,`3${X}${n+1} = ${3*n+3}, c'est trop.`],[n-1,`3${X}${n-1} = ${3*n-3}, ce n'est pas assez.`],
        [n+2,`3${X}${n+2} = ${3*n+6}, c'est trop.`],[p-3,`Tu as enlevé 3 à ${p}. On cherche combien de fois 3 il faut pour faire ${p}.`]]),String(n),
      `<p>Récite la table de 3 jusqu'à ${p}.</p>`,
      `<p>3${X}${n} = ${p}, donc il manque <b>${n}</b>.</p>`);
  }
  // niveau 3 : d'un résultat à son voisin (on ajoute ou on enlève 3, pas 1)
  const n=R(3,9),p=3*n,up=Math.random()<.5,m=up?n+1:n-1,ok=3*m;
  return Q('table3',3,`On sait que <b>3${X}${n} = ${p}</b>.<br>Combien fait <span class="big">3${X}${m}</span> ?`,
    opts(ok,up?[[p+1,`De 3${X}${n} à 3${X}${n+1}, on ajoute 3, pas 1.`],[p+n+1,`Tu as ajouté ${n+1}. On ajoute seulement une fois 3.`],
        [p+6,`Tu as ajouté 6 : c'est 3${X}${n+2}.`],[p-3,`C'est 3${X}${n-1} : il fallait avancer, pas reculer.`]]
      :[[p-1,`De 3${X}${n} à 3${X}${n-1}, on enlève 3, pas 1.`],[p-n+1,`Tu as enlevé ${n-1}. On enlève seulement une fois 3.`],
        [p-6,`Tu as enlevé 6 : c'est 3${X}${n-2}.`],[p+3,`C'est 3${X}${n+1} : il fallait reculer, pas avancer.`]]),String(ok),
    `<p>3${X}${m}, c'est une fois 3 de ${up?'plus':'moins'} que 3${X}${n}.</p>`,
    `<p>3${X}${m} = ${p} ${up?'+':'−'} 3 = <b>${ok}</b> : d'une ligne à l'autre, la table de 3 avance de 3.</p>`);
}

// Table de 6 = double de la table de 3
function genTable6(level){
  if(level===1){
    const n=R(2,10),x=3*n,ok=6*n;
    return Q('table6',1,`On sait que <b>3${X}${n} = ${x}</b>.<br>Combien fait <span class="big">6${X}${n}</span> ?`,
      opts(ok,[[x+3,`Tu as ajouté 3. Mais 6${X}${n}, c'est le double de 3${X}${n} : ${x} + ${x}.`],
        [x+6,`Tu as ajouté 6. Il faut doubler : ${x} + ${x}.`],
        [3*x,`Tu as pris le triple : ça donne 9${X}${n}. 6, c'est 2 fois 3 : on double.`],
        [ok+6,`C'est 6${X}${n+1}.`]]),String(ok),
      `<p>6 = 2${X}3. Le résultat de la table de 6 est le double de celui de la table de 3.</p>`,
      `<p>6 = 2${X}3, donc 6${X}${n} est le <b>double</b> de 3${X}${n} : ${x} + ${x} = <b>${ok}</b>.</p>`);
  }
  if(level===2){
    const n=R(3,10),x=3*n,ok=6*n;
    return Q('table6',2,`Combien fait <span class="big">6${X}${n}</span> ?`,
      opts(ok,[[ok-6,`C'est 6${X}${n-1}.`],[ok+6,`C'est 6${X}${n+1}.`],
        [x,`C'est 3${X}${n}. Il faut encore le doubler.`],[6+n,`Tu as fait 6 + ${n}, une addition. Ici, on multiplie.`]]),String(ok),
      `<p>Calcule d'abord 3${X}${n}, puis double le résultat.</p>`,
      `<p>3${X}${n} = ${x}, et le double de ${x}, c'est ${x} + ${x} = ${ok}. Donc 6${X}${n} = <b>${ok}</b>.</p>`);
  }
  // niveau 3 : à l'envers
  const n=R(2,10),y=6*n,x=3*n;
  if(Math.random()<.5){
    return Q('table6',3,`On sait que <b>6${X}${n} = ${y}</b>.<br>Combien fait <span class="big">3${X}${n}</span> ?`,
      opts(x,[[y-3,`Tu as enlevé 3. 3${X}${n} est la moitié de 6${X}${n}.`],
        [2*y,`Tu as doublé. Or 3${X}${n} est plus petit que 6${X}${n} : c'est la moitié.`],
        [y-6,`Tu as enlevé 6 : c'est 6${X}${n-1}.`],
        [2*n,`Tu as cherché « 3${X}… = ${y} ». Ici, on veut le résultat de 3${X}${n} : la moitié de ${y}.`]]),String(x),
      `<p>6, c'est le double de 3. Donc 3${X}${n}, c'est la moitié de 6${X}${n}.</p>`,
      `<p>3${X}${n} est la <b>moitié</b> de 6${X}${n} : ${x} + ${x} = ${y}, donc 3${X}${n} = <b>${x}</b>.</p>`);
  }
  return Q('table6',3,`Complète : <span class="big">6${X}___ = ${y}</span>`,
    opts(n,[[2*n,`3${X}${2*n} = ${y} : ça, c'est la table de 3. Dans la table de 6, il en faut deux fois moins.`],
      [n+1,`6${X}${n+1} = ${y+6}, c'est trop.`],[n-1,`6${X}${n-1} = ${y-6}, ce n'est pas assez.`]]),String(n),
    `<p>Cherche ${y} dans la table de 6 : 6, 12, 18, 24…</p>`,
    `<p>6${X}${n} = ${y}, donc il manque <b>${n}</b>. Attention : ${y} = 3${X}${2*n} dans la table de 3.</p>`);
}

// Table de 9 = triple de la table de 3
function genTable9(level){
  if(level===1){
    const n=R(2,10),x=3*n,ok=9*n;
    return Q('table9',1,`On sait que <b>3${X}${n} = ${x}</b>.<br>Combien fait <span class="big">9${X}${n}</span> ?`,
      opts(ok,[[2*x,`Tu as pris le double : ça donne 6${X}${n}. 9, c'est 3 fois 3 : on prend le triple.`],
        [x+9,`Tu as ajouté 9. Il faut prendre le triple : ${x} + ${x} + ${x}.`],
        [x+6,`Tu as ajouté 6. Il faut prendre le triple : ${x} + ${x} + ${x}.`],
        [ok+9,`C'est 9${X}${n+1}.`]]),String(ok),
      `<p>9 = 3${X}3. Le résultat de la table de 9 est le triple de celui de la table de 3.</p>`,
      `<p>9 = 3${X}3, donc 9${X}${n} est le <b>triple</b> de 3${X}${n} : ${x} + ${x} + ${x} = <b>${ok}</b>.</p>`);
  }
  if(level===2){
    const n=R(3,10),x=3*n,ok=9*n;
    return Q('table9',2,`Combien fait <span class="big">9${X}${n}</span> ?`,
      opts(ok,[[ok-9,`C'est 9${X}${n-1}.`],[ok+9,`C'est 9${X}${n+1}.`],
        [6*n,`C'est 6${X}${n}, le double de 3${X}${n}. Pour 9, il faut le triple.`],
        [x,`C'est 3${X}${n}. Il faut encore le tripler.`]]),String(ok),
      `<p>Calcule d'abord 3${X}${n}, puis prends-le 3 fois.</p>`,
      `<p>3${X}${n} = ${x}, et le triple de ${x}, c'est ${x} + ${x} + ${x} = ${ok}. Donc 9${X}${n} = <b>${ok}</b>.</p>`);
  }
  // niveau 3 : à l'envers
  const n=R(2,10),y=9*n,x=3*n;
  if(Math.random()<.5){
    return Q('table9',3,`On sait que <b>9${X}${n} = ${y}</b>.<br>Combien fait <span class="big">3${X}${n}</span> ?`,
      opts(x,[[y/2,`Tu as pris la moitié. 9, c'est 3 fois 3 : 9${X}${n}, c'est 3 fois 3${X}${n}.`],
        [6*n,`C'est 6${X}${n}. Cherche le nombre qui, pris 3 fois, donne ${y}.`],
        [y-3,`Tu as enlevé 3. 9${X}${n}, c'est 3${X}${n} pris 3 fois.`],
        [y-6,`Tu as enlevé 6. 9${X}${n}, c'est 3${X}${n} pris 3 fois.`],
        [n,`${n}, c'est le nombre de fois. 3${X}${n} vaut plus.`]]),String(x),
      `<p>9${X}${n}, c'est 3${X}${n} + 3${X}${n} + 3${X}${n}. Ou récite la table de 3 jusqu'à 3${X}${n}.</p>`,
      `<p>3${X}${n} = <b>${x}</b>, et ${x} + ${x} + ${x} = ${y} : 9${X}${n} est bien le triple de 3${X}${n}.</p>`);
  }
  return Q('table9',3,`Complète : <span class="big">9${X}___ = ${y}</span>`,
    opts(n,[[3*n,`3${X}${3*n} = ${y} : ça, c'est la table de 3. Dans la table de 9, il en faut trois fois moins.`],
      [n+1,`9${X}${n+1} = ${y+9}, c'est trop.`],[n-1,`9${X}${n-1} = ${y-9}, ce n'est pas assez.`],
      [2*n,`9${X}${2*n} = ${18*n}, c'est trop.`]]),String(n),
    `<p>Cherche ${y} dans la table de 9 : 9, 18, 27, 36…</p>`,
    `<p>9${X}${n} = ${y}, donc il manque <b>${n}</b>.</p>`);
}

// Passer d'une table à l'autre : double, triple, moitié ; 9 × n = 3 × n + 6 × n ; 6 × n = 3 × (2n)
function genRelations(level){
  if(level===1){
    const n=R(2,10),k=pick(['6/3','9/3','3/6']);
    const ta=+k.split('/')[0],tb=+k.split('/')[1],a=ta*n,b=tb*n;
    const ok=k==='6/3'?'double':k==='9/3'?'triple':'moitie';
    const plusGrand=a>b;
    const why={
      double:plusGrand?`Le double de ${b}, c'est ${b} + ${b} = ${2*b}, pas ${a}.`:`Le double est plus grand. Or ${a} est plus petit que ${b}.`,
      triple:plusGrand?`Le triple de ${b}, c'est ${b} + ${b} + ${b} = ${3*b}, pas ${a}.`:`Le triple est plus grand. Or ${a} est plus petit que ${b}.`,
      moitie:`La moitié est plus petite. Or ${a} est plus grand que ${b}.`,
      tiers:plusGrand?`Le tiers est plus petit. Or ${a} est plus grand que ${b}.`:`Le tiers de ${b}, c'est ${b/3}, car ${b/3} + ${b/3} + ${b/3} = ${b}.`
    };
    const lab={double:'le double',triple:'le triple',moitie:'la moitié',tiers:'le tiers'};
    const ch=['double','triple','moitie','tiers'].map(v=>v===ok?C(v,lab[v]):C(v,lab[v],why[v]));
    const rule=ok==='double'?`6 = 2${X}3 : la table de 6 est le double de la table de 3`
      :ok==='triple'?`9 = 3${X}3 : la table de 9 est le triple de la table de 3`
      :`3 est la moitié de 6 : la table de 3 est la moitié de la table de 6`;
    return Q('relations',1,`${ta}${X}${n} = <b>${a}</b> et ${tb}${X}${n} = <b>${b}</b>.<br>Complète : <span class="big">${a}</span> est ___ de <span class="big">${b}</span>.`,
      ch,ok,
      `<p>Compare ${ta} et ${tb} : combien de fois ${Math.min(ta,tb)} dans ${Math.max(ta,tb)} ?</p>`,
      `<p>${a} est <b>${lab[ok]}</b> de ${b}. ${rule}.</p>`);
  }
  if(level===2){
    // 9 × n = 3 × n + 6 × n (n ≥ 2 : pour n = 1, 6 + 3 = 9 serait aussi « 6 × 1 + 3 »)
    const n=R(2,10),x=3*n,y=6*n,ok=9*n;
    return Q('relations',2,`On sait que <b>3${X}${n} = ${x}</b> et <b>6${X}${n} = ${y}</b>.<br>Combien fait <span class="big">9${X}${n}</span> ?`,
      opts(ok,[[y+3,`Tu as ajouté 3. Mais 9${X}${n}, c'est 6${X}${n} plus 3${X}${n} : ${y} + ${x}.`],
        [2*y,`Tu as doublé 6${X}${n} : ça donne 12${X}${n}.`],
        [y+9,`Tu as ajouté 9. Mais 9${X}${n}, c'est 6${X}${n} plus 3${X}${n} : ${y} + ${x}.`],
        [ok+9,`C'est 9${X}${n+1}.`]]),String(ok),
      `<p>9 = 6 + 3. Donc 9 fois, c'est 6 fois plus 3 fois.</p>`,
      `<p>9 = 6 + 3, donc 9${X}${n} = 6${X}${n} + 3${X}${n} = ${y} + ${x} = <b>${ok}</b>.</p>`);
  }
  // niveau 3 : 6 × n = 3 × (2n) ou 9 × n = 3 × (3n)
  const n=R(2,10);
  if(Math.random()<.5){
    const p=6*n,ok=2*n;
    return Q('relations',3,`Complète : <span class="big">6${X}${n} = 3${X}___</span>`,
      opts(ok,[[n,`3${X}${n} = ${3*n}, c'est la moitié de ${p}.`],
        [n+3,`Tu as ajouté 3 à ${n}. 3${X}${n+3} = ${3*(n+3)}, pas ${p}.`],
        [3*n,`3${X}${3*n} = ${9*n} : c'est 9${X}${n}, pas 6${X}${n}.`],
        [n+2,`3${X}${n+2} = ${3*(n+2)}, pas ${p}.`]]),String(ok),
      `<p>6${X}${n} = ${p}. Combien de fois 3 dans ${p} ?</p>`,
      `<p>6 = 2${X}3, donc 6${X}${n} = 3${X}${n}${X}2 = 3${X}<b>${ok}</b> = ${p}.</p>`);
  }
  const p=9*n,ok=3*n;
  return Q('relations',3,`Complète : <span class="big">9${X}${n} = 3${X}___</span>`,
    opts(ok,[[n,`3${X}${n} = ${3*n}, c'est trop petit : il faut ${p}.`],
      [2*n,`3${X}${2*n} = ${6*n} : c'est 6${X}${n}, pas 9${X}${n}.`],
      [n+6,`Tu as ajouté 6 à ${n}. 3${X}${n+6} = ${3*(n+6)}, pas ${p}.`],
      [n+3,`3${X}${n+3} = ${3*(n+3)}, pas ${p}.`]]),String(ok),
    `<p>9${X}${n} = ${p}. Combien de fois 3 dans ${p} ?</p>`,
    `<p>9 = 3${X}3, donc 9${X}${n} = 3${X}${n}${X}3 = 3${X}<b>${ok}</b> = ${p}.</p>`);
}

// Multiples de 3, 6 et 9
function nonMultiples(t,ok,cond,n){
  // n nombres distincts entre t + 1 et 10 × t, qui vérifient cond, différents de ok
  const pool=[];for(let d=t+1;d<=10*t;d++)if(d!==ok&&cond(d))pool.push(d);
  return shuffle(pool).slice(0,n);
}
function genMultiples(level){
  if(level===1||level===2){
    const t=level===1?pick([3,6,9]):pick([6,9]),k=R(2,10),m=t*k;
    // niveau 1 : intrus hors de la table de 3 ; niveau 2 : intrus de la table de 3 (le piège)
    const faux=level===1?nonMultiples(t,m,d=>d%3!==0,3):nonMultiples(t,m,d=>d%3===0&&d%t!==0,3);
    const ch=[C(m,m)].concat(faux.map(d=>C(d,d,level===1
      ?`${d} n'est pas dans la table de ${t} : ${entre(d,t)}.`
      :`${d} = 3${X}${d/3} est dans la table de 3, mais pas dans celle de ${t} : ${entre(d,t)}.`)));
    return Q('multiples',level,`Quel nombre est un <b>multiple de ${t}</b> ?`,ch,String(m),
      `<p>Un multiple de ${t} est un résultat de la table de ${t}. Récite-la : ${t}, ${2*t}, ${3*t}…</p>`,
      `<p><b>${m}</b> = ${t}${X}${k} : c'est un multiple de ${t}.${level===2?` Attention : un multiple de 3 n'est pas toujours un multiple de ${t}.`:''}</p>`);
  }
  // niveau 3 : un multiple de 6 ou de 9 est-il multiple de 3 ? et l'inverse ?
  const t=pick([6,9]);
  const sur=`<p>Si, on peut savoir : cherche le nombre dans la table.</p>`;
  if(Math.random()<1/3){
    const k=R(2,10),y=t*k;
    return Q('multiples',3,`${y} est un multiple de ${t}.<br>Est-ce aussi un <b>multiple de 3</b> ?`,
      [C('oui','Oui'),C('non','Non',`${y} = ${t}${X}${k} = 3${X}${t/3*k}. Il est donc dans la table de 3.`),
       C('?','On ne peut pas savoir',`On peut savoir : ${t} = ${t/3}${X}3, donc ${y} = 3${X}${t/3*k}.`)],'oui',
      `<p>${t} = ${t/3}${X}3. Écris ${y} avec un 3 : ${y} = 3${X}…</p>`,
      `<p><b>Oui</b> : ${y} = ${t}${X}${k} = 3${X}${t/3*k}. Tout multiple de ${t} est un multiple de 3.</p>`);
  }
  // l'inverse : un multiple de 3 n'est pas toujours un multiple de 6 ou de 9 (oui et non à parts égales)
  const yes=Math.random()<.5;
  const cands=[];for(let m=2;m<=(t===6?20:30);m++)if((3*m%t===0)===yes)cands.push(m);
  const m=pick(cands),y=3*m;
  return Q('multiples',3,`${y} = 3${X}${m} est un multiple de 3.<br>Est-ce aussi un <b>multiple de ${t}</b> ?`,
    [C('oui','Oui',yes?'':`${y} n'est pas dans la table de ${t} : ${entre(y,t)}.`),
     C('non','Non',yes?`${y} = ${t}${X}${y/t} : il est dans la table de ${t}.`:''),
     C('?','On ne peut pas savoir',`On peut savoir : cherche ${y} dans la table de ${t}.`)],yes?'oui':'non',
    `<p>Cherche ${y} dans la table de ${t} : ${t}, ${2*t}, ${3*t}…</p>`,
    yes?`<p><b>Oui</b> : ${y} = ${t}${X}${y/t}.</p>`
       :`<p><b>Non</b> : ${entre(y,t)}, et ${y} est entre les deux. Un multiple de 3 n'est pas toujours un multiple de ${t}.</p>`);
}

   q:{p:`Combien fait 3${X}7 ?`,c:[C('21','21'),C('10','10',`Tu as fait 3 + 7. Ici, on multiplie : 7 fois 3.`),C('24','24',`24, c'est 3${X}8.`)],ok:'21'}},

  {t:'Table de 9 : le triple',body:()=>`<p><b>9 = 3${X}3.</b> Donc chaque résultat de la table de 9 est le <b>triple</b> du résultat de la table de 3.</p>

   q:{p:`3${X}4 = 12. Combien fait 9${X}4 ?`,c:[C('36','36'),C('24','24',`Tu as pris le double : ça, c'est 6${X}4. Pour 9, il faut le triple.`),C('21','21',`Tu as ajouté 9. Il faut prendre le triple : 12 + 12 + 12.`)],ok:'36'}},
  {t:'Les trois tables côte à côte',body:()=>`<p>Regarde chaque colonne : le nombre de la ligne 6 est le double de celui de la ligne 3, celui de la ligne 9 en est le triple.</p>
    ${tableau()}
    <p>Un <b>multiple de 3</b>, c'est un résultat de la table de 3, même au-delà de 3${X}10 : 42 = 3${X}14.</p>`,
   q:{p:`Dans le tableau, que vaut 6${X}5 ?`,c:[C('30','30'),C('15','15',`15, c'est 3${X}5, la ligne du 3.`),C('45','45',`45, c'est 9${X}5, la ligne du 9.`)],ok:'30'}},
  {t:'Les multiples',body:()=>`<p>Tout multiple de 6 est aussi un multiple de 3 : 42 = 6${X}7 = 3${X}14.</p>
    <p>Tout multiple de 9 est aussi un multiple de 3 : 27 = 9${X}3 = 3${X}9.</p>
    <div class="rulebox">Mais pas l'inverse ! 15 = 3${X}5 est un multiple de 3, mais 15 n'est pas dans la table de 6 ni dans celle de 9.</div>`,
   q:{p:'Quel nombre est un multiple de 6 ?',c:[C('18','18'),C('15','15',`15 est dans la table de 3, mais pas dans celle de 6 : 6${X}2 = 12 et 6${X}3 = 18.`),C('21','21',`21 est dans la table de 3, mais pas dans celle de 6 : 6${X}3 = 18 et 6${X}4 = 24.`)],ok:'18'}},
  {t:'À retenir',recap:true,body:()=>`<p>• <b>6 = 2${X}3</b> : la table de 6 est le <b>double</b> de la table de 3.</p>
    <p>• <b>9 = 3${X}3</b> : la table de 9 est le <b>triple</b> de la table de 3.</p>

    ?`<div class="fb good"><p><b>Merci !</b> Un adulte va vérifier cette question.</p>
      <div style="margin:10px 0"><input id="sigtxt" style="width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)" type="text" maxlength="300" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Tu veux dire pourquoi ?" placeholder="Tu veux dire pourquoi ? (facultatif)"></div>
      <div class="btns"><button class="btn" data-act="sigsend" data-id="${esc(id)}">Envoyer</button></div></div>`
    :`<div class="fb bad"><p>Le signalement n'a pas pu être enregistré.</p></div>`;
}
function sigSend(el){
  const t=document.getElementById('sigtxt'),zone=document.getElementById('sig');
  if(t&&t.value.trim()&&window.miniprof)window.miniprof.commenter(el.dataset.id,t.value);
  zone.innerHTML='<div class="fb good"><p>Merci, c\'est noté.</p></div>';
}
// Boutons de la question (P010, 12/10/2026). « Valider » n'apparaît que lorsque l'élève a proposé
// une réponse (mot tapé, choix, dessin non vide). Après une erreur, « Réessayer » efface sa
// proposition ; « Valider » revient (caché) tant qu'il n'a rien reproposé.
function aReponse(){
  if(S.q&&S.q.draw)return Object.keys(S.grid||{}).length>0;
  const i=document.getElementById('rep');
  return i?!!norm(i.value):!!S.choice;
}
function majValider(){const b=document.getElementById('ok');if(b)b.hidden=!aReponse();}
function boutons(){
  const ev=S.mode==='eval',last=ev&&S.i===S.total-1;
  const aide=ev?'':'<button class="btn ghost" data-act="hint">Un indice</button>'+(S.attempts>0?'<button class="btn ghost" data-act="reveal">Voir la correction</button>':'');
  const principal=S.retry
    ?'<button class="btn primary" data-act="retry" data-primary>Réessayer</button>'
    :`<button class="btn primary" id="ok" data-act="check" data-primary hidden>${ev?(last?'Valider et terminer':'Valider et continuer'):'Valider'}</button>`;
  document.getElementById('acts').innerHTML=principal+aide;
  majValider();
}
// L'élève propose (ou modifie) une réponse : si « Réessayer » attendait, « Valider » reprend sa place.
function surProposition(){if(S.retry){S.retry=false;boutons();}else majValider();}
function reessayer(){
  S.retry=false;S.choice=null;
  const i=document.getElementById('rep');
  if(i){i.value='';i.focus();}
  app.querySelectorAll('.choice.sel').forEach(c=>c.classList.remove('sel'));
  boutons();
}
function setFb(html){document.getElementById('fb').innerHTML=html;}
function lockChoices(){
  app.querySelectorAll('.choice').forEach(c=>{c.classList.add('locked');c.disabled=true;
    if(c.dataset.v===S.q.exp.c)c.classList.add('good');else if(c.dataset.v===S.choice)c.classList.add('bad');});
}
function checkTrain(){
  if(!S.choice){setFb('<div class="fb hint">Choisis une réponse.</div>');return;}
  const q=S.q;S.attempts++;
  const ok=S.choice===q.exp.c;
  // seul le premier essai compte dans le journal (sinon cliquer au hasard gonfle la réussite)
  if(S.attempts===1){S.tried++;if(ok){S.okCount++;S.streak++;}else S.streak=0;record(q,ok,S.choice);}
  if(ok){
    lockChoices();
    let extra='';
    if(S.streak>=5&&S.level<MAXL)extra=`<p>${S.streak} réussites d'affilée : tu peux passer au niveau ${LEVELS[S.level+1].t}.</p>`;
    setFb(`<div class="fb good"><p><b>${pick(CHEER)}</b>${S.attempts>1?' Tu as trouvé au deuxième essai.':''}</p>${q.explain}${extra}</div>`);
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>${extra?`<button class="btn" data-act="levelup">Niveau ${LEVELS[S.level+1].t}</button>`:''}`;
  }else if(S.attempts===1){
    const c=q.choices.find(c=>c.v===S.choice);
    setFb(`<div class="fb bad"><p><b>Pas tout à fait.</b> ${c&&c.why?c.why:'Relis la question et réessaie.'}</p></div>`);
    app.querySelectorAll('.choice').forEach(b=>{if(b.dataset.v===S.choice){b.classList.remove('sel');b.classList.add('bad');b.disabled=true;}});
    S.choice=null;
    S.retry=true;boutons();
  }else revealTrain();
}
function revealTrain(){
  if(S.attempts===0){S.attempts=1;S.tried++;S.streak=0;record(S.q,false,null);}
  lockChoices();
  setFb(`<div class="fb info"><p><b>Correction</b></p>${S.q.explain}</div>`);
  document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>`;
}
function nextTrain(){S.q=genQuestion(S.skill,S.level);qScreen();}

// Une évaluation ne pose jamais deux fois la même question : on retire une question déjà
// sortie (jusqu'à 30 essais, au cas où une compétence aurait peu de questions).
// Signalé par le sponsor le 12/10/2026 (la même question deux fois dans une évaluation).
function tirerSansDoublon(skills,niveau){
  const vus=new Set();
  // même question = même énoncé ET mêmes choix (un énoncé comme « Lequel est l'intrus ? » revient
  // légitimement avec d'autres mots)
  const cle=q=>q.prompt+'|'+(q.choices||[]).map(c=>c.v).sort().join(',')+'|'+q.exp.c;
  return skills.map((s,i)=>{let q,n=0;do{q=genQuestion(s,niveau(i));n++;}while(vus.has(cle(q))&&n<30);vus.add(cle(q));return q;});
}
function evalStart(){
  const lvl=S.level;
  // Mixte (0) : les niveaux tournent, pour que chacun soit représenté
  const qs=tirerSansDoublon(shuffle(EVAL_SKILLS.slice()),i=>lvl===0?LVL[i%LVL.length]:lvl);
  S={screen:'eval',mode:'eval',evalLevel:lvl,level:lvl,qs,i:0,total:qs.length,results:[],t0:Date.now(),
    cle:window.miniprof?window.miniprof.debutEvaluation(lvl):null};
  S.q=qs[0];qScreen();
}
function checkEval(){
  if(!S.choice){setFb('<div class="fb hint">Choisis une réponse avant de continuer.</div>');return;}
  S.results.push({q:S.q,ans:S.choice,ok:S.choice===S.q.exp.c,duree:secs(S.q)});
  S.i++;
  if(S.i>=S.total){evalEnd();return;}
  S.q=S.qs[S.i];qScreen();
}
const lblOf=(q,v)=>{const c=q.choices.find(c=>c.v===v);return c?c.label:'';};
function evalEnd(){
  const res=S.results,score=res.filter(r=>r.ok).length,total=res.length;
  const duree=Math.round((Date.now()-S.t0)/1000);
  const sk={};
  res.forEach(r=>{const s=sk[r.q.skill]||(sk[r.q.skill]=[0,0]);s[1]++;if(r.ok)s[0]++;});
  // l'évaluation est enregistrée d'un bloc à la fin : abandonnée au milieu, elle ne compte pas
  if(window.miniprof)window.miniprof.reponse(res.map(r=>({competence:r.q.skill,juste:r.ok,mode:'v',difficulte:r.q.level,
    question:r.q.skill,reponse:r.ans,duree:r.duree,evaluation:S.cle})));
  let weakest=null,wp=2;for(const k in sk){const p=sk[k][0]/sk[k][1];if(p<wp){wp=p;weakest=k;}}
  const pc=score/total;
  const msg=pc>=.9?"Excellent ! Tu maîtrises ta leçon.":pc>=.7?"Très bien ! Il ne reste que quelques détails à revoir.":pc>=.5?"Bon début. Regarde les corrections, puis entraîne-toi encore un peu.":"Pas de panique : relis les fiches Apprendre, puis entraîne-toi.";
  const bars=Object.keys(sk).map(k=>{const p=Math.round(100*sk[k][0]/sk[k][1]);return `<div><div class="row" style="justify-content:space-between"><span>${SKILLS[k].label}</span><b>${sk[k][0]}/${sk[k][1]}</b></div><div class="bar"><i class="${p<50?'low':p<80?'mid':''}" style="width:${p}%"></i></div></div>`;}).join('');
  const rev=res.map((r,i)=>`<details class="rev ${r.ok?'okk':'koo'}"><summary>${r.ok?'✓':'✗'} Question ${i+1} : ${SKILLS[r.q.skill].label}</summary>
    <div class="q-prompt">${r.q.prompt}</div>
    <p>Ta réponse :</p><div class="ans">${lblOf(r.q,r.ans)}</div>
    ${r.ok?'':`<p>Bonne réponse :</p><div class="ans good">${lblOf(r.q,r.q.exp.c)}</div>`}
    <div class="fb info">${r.q.explain}</div></details>`).join('');
  S.screen='result';S.weakest=weakest;
  show(`${topbar('Résultat','home')}<main class="wrap">
    <div class="card center"><div class="score">${score}<span style="font-size:1.6rem;color:var(--muted)"> / ${total}</span></div>
      <p style="margin-top:10px">${msg}</p><p class="small">Temps : ${Math.floor(duree/60)} min ${duree%60} s</p></div>
    <h2>Par compétence</h2><div style="margin-top:10px">${bars}</div>
    <h2 style="margin:16px 0 6px">Les corrections</h2>${rev}
    <div class="btns">
      ${weakest&&wp<1?`<button class="btn primary" data-act="trainWeak" data-primary>Travailler : ${SKILLS[weakest].label}</button>`:''}
      <button class="btn" data-act="evalSetup">Recommencer</button><button class="btn" data-act="bilan">Mon bilan</button><button class="btn ghost" data-act="home">Accueil</button>
    </div></main>`);
}

/* ================= MOTEUR : bilan (celui de miniprof) ================= */
function bilan(){
  const m=window.miniprof;
  if(m)location.href=m.racine+'#/module/'+encodeURIComponent(m.module)+'/bilan';
}

/* ================= MOTEUR : actions ================= */
// Ajouter ici les actions propres au module (ex. un labo) avant « default ».
function act(a,el){
  switch(a){
    case 'home':home();break;
    case 'learn':learn(0);break;
    case 'lchoose':learnChoose(el);break;
    case 'lnext':if(S.ls<LEARN.length-1){S.ls++;renderLearn();}break;
    case 'trainSetup':trainSetup(false);break;
    case 'lvl':S.level=Number(el.dataset.v);if(S.screen==='trainSetup')trainSetup(true);else evalSetup(true);break;
    case 'sk':S.skill=el.dataset.v;S.skillPref=S.skill;trainSetup(true);break;
    case 'trainStart':S={screen:'train',mode:'train',level:S.level,skill:S.skill,skillPref:S.skill,tried:0,okCount:0,streak:0};nextTrain();break;
    case 'trainWeak':S={screen:'train',mode:'train',level:1,skill:S.weakest,skillPref:S.weakest,tried:0,okCount:0,streak:0};nextTrain();break;
    case 'levelup':S.level=Math.min(S.level+1,MAXL);S.streak=0;nextTrain();break;
    case 'evalSetup':evalSetup(false);break;
    case 'evalStart':evalStart();break;
    case 'quitEval':evalSetup(false);break;
    case 'choose':S.choice=el.dataset.v;app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c===el));surProposition();break;
    case 'retry':reessayer();break;
    case 'check':S.mode==='eval'?checkEval():checkTrain();break;
    case 'hint':document.getElementById('hint').innerHTML=`<div class="fb hint"><p><b>Indice</b></p>${S.q.hint}</div>`;break;
    case 'reveal':revealTrain();break;
    case 'sig':sigAsk();break;
    case 'signo':document.getElementById('sig').innerHTML='';break;
    case 'sigyes':sigYes();break;
    case 'sigsend':sigSend(el);break;
    case 'next':nextTrain();break;
    case 'bilan':bilan();break;
    default:break;
  }
}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t);});
// un mot tapé = une proposition : « Valider » apparaît
app.addEventListener('input',e=>{if(e.target.id==='rep')surProposition();});
// Après une erreur, toucher le champ ou y taper efface l'ancien mot, comme « Réessayer » (P010, retour du 12/10).
const effacerSiReessai=e=>{if(S.retry&&e.target.id==='rep')reessayer();};
app.addEventListener('pointerdown',effacerSiReessai);
app.addEventListener('focusin',effacerSiReessai);
app.addEventListener('beforeinput',effacerSiReessai);

// Tirage automatique (tools/tirage.py) : la page donne ses générateurs au lieu de s'afficher.
// window.__miniprofTirage n'existe que dans l'outil, jamais dans un navigateur.
if(window.__miniprofTirage){window.__miniprofTirage({GEN,LEVELS,LEARN,SKILLS,EVAL_SKILLS});return;}
home();

})();
</script>
