  {id:'sauvage',m:'sauvage',nat:'adjectif',ex:'un animal sauvage',dev:"Il vit en liberté dans la nature : on ne l'a jamais apprivoisé.",
   tip:"<b>sau</b>va<b>ge</b> : le son « o » s'écrit <b>au</b>, et le g devant e fait « j ».",
   faux:[['sovage',"Le son « o » s'écrit <b>au</b> : s<b>au</b>vage."],['sauvaje',"Le son « j » s'écrit <b>g</b> devant e : sauva<b>ge</b>."],['sauvag',"Il y a un <b>e</b> à la fin : sauvag<b>e</b>."],['sauvages',"Un seul animal : sauvage, sans s."],['libre',"« libre » est proche, mais le mot de la dictée est <b>sauvage</b>."]]},
  {id:'atravers',m:'à travers',nat:'invariable',ex:'il court à travers les champs',dev:"Ces deux mots veulent dire « en passant d'un bout à l'autre ».",
   tip:"<b>à</b> <b>travers</b> : deux mots, un accent grave sur le à, et un s muet à la fin de travers.",
   faux:[['a travers',"Il faut un accent grave sur le <b>à</b> : <b>à</b> travers."],['à traver',"Il y a un <b>s</b> muet à la fin : travers."],['à travert',"La lettre muette est un <b>s</b> : travers."],['atravers',"Ce sont deux mots séparés : <b>à</b> <b>travers</b>."],['au travers',"« au travers » veut dire presque la même chose, mais le mot de la dictée commence par <b>à</b> : à travers."]]},
  {id:'enfin',m:'enfin',nat:'invariable',ex:'Ouf, on arrive enfin !',dev:"On le dit quand ce qu'on attendait depuis longtemps arrive.",
   tip:"<b>en</b>f<b>in</b> : « en » au début, « in » à la fin.",
   faux:[['anfin',"Le son « an » s'écrit <b>en</b> au début : <b>en</b>fin."],['enfain',"Le son « in » s'écrit <b>in</b> : enf<b>in</b>."],['enfein',"Le son « in » s'écrit <b>in</b> : enf<b>in</b>."],['en fin',"C'est un seul mot : <b>enfin</b>."],['finalement',"« finalement » veut dire presque la même chose, mais le mot de la dictée est <b>enfin</b>."]]},
  {id:'courageusement',m:'courageusement',nat:'invariable',ex:'Il avance courageusement.',dev:"Il vient de « courage » : il dit comment on agit quand on n'a pas peur du danger.",
   tip:"courageu<b>sement</b> : courageu<b>se</b> (au féminin) + <b>ment</b>.",
   faux:[['courageuxement',"On part du féminin « courageuse » : courageu<b>s</b>ement."],['courageusment',"Il faut un <b>e</b> avant ment : courageus<b>e</b>ment."],['courrageusement',"Un seul <b>r</b> : cou<b>r</b>ageusement."],['courageusemant',"La fin s'écrit <b>ment</b> : courageuse<b>ment</b>."],['couragieusement',"Il n'y a pas de <b>i</b> : courag<b>eu</b>sement."],['bravement',"« bravement » veut dire presque la même chose, mais le mot de la dictée vient de « courage » : <b>courageusement</b>."]]}
];
/*FIN DATA*/
NOMS.forEach(w=>{w.nat='nom';w.skill='noms';});
VERBES.forEach(w=>{w.skill='verbes';});
MOTS.forEach(w=>{w.skill='mots';});
const POOL={noms:NOMS,verbes:VERBES,mots:MOTS};
const TOUS=NOMS.concat(VERBES,MOTS);   // les 18 mots : chacun est posé une fois, puis reposé s'il a été raté
const pluriel=w=>w.m.indexOf(' ')>=0;
const label=w=>w.nat==='nom'?`${w.det} ${w.m}`:w.m;
const cadre=w=>w.ex?`<p class="big-s">${esc(w.ex).replace(esc(w.m),'<span class="blank">______</span>')}</p>`:'';
const devinette=w=>`<p><b>Devinette :</b> ${w.dev}</p>${cadre(w)}`;
const fautesMot=w=>{const e={};w.faux.forEach(f=>{e[f[0]]=f[1];});return e;};
const correction=w=>`<p>Le mot : <b class="big-s">${label(w)}</b></p><p>${w.tip}</p>`;

/* ================= CONTENU : la question ================= */
// Une devinette, l'enfant écrit le mot sans aide. (Le QCM « relier la devinette au mot » a été supprimé
// le 17 nov. 2026 : il ne servait à rien, et la bonne réponse ne montre plus de message.)
function mkEcrire(w){
  const ok=w.ok||(w.det?[w.m,`${w.det} ${w.m}`]:[w.m]);
  const verbe=w.nat==='verbe'?' (à l’infinitif)':'';
  const clavier=w.id==='oeil'?`<p class="small">Sur l'iPhone, appuie longtemps sur le o pour trouver œ (« oe » en deux lettres est accepté).</p>`:'';
  return W(w.skill,2,`${devinette(w)}<p>Écris ${pluriel(w)?'les mots':'le mot'} de la dictée${verbe}.</p>${clavier}`,ok,fautesMot(w),'<p>Écris le mot sans aide.</p>',correction(w));
}

// Clés = ids des compétences de la fiche. Un générateur par compétence (pour le tirage automatique
// de tools/tirage.py) ; le parcours, lui, pose chaque mot de la liste.
const SKILLS={noms:{label:'Écrire les noms'},verbes:{label:'Écrire les verbes'},mots:{label:'Écrire les adjectifs et les petits mots'}};
const GEN={noms:()=>mkEcrire(pick(NOMS)),verbes:()=>mkEcrire(pick(VERBES)),mots:()=>mkEcrire(pick(MOTS))};
const LEVELS={2:{t:'Écrire',d:'écrire le mot sans aide'}};

/* ================= MOTEUR : suivi miniprof (à garder tel quel) ================= */
const app=document.getElementById('app');
/* Les réponses vont dans le journal de l'enfant par ../js/suivi.js ; le bilan est celui de miniprof.
   Sans miniprof (page ouverte ailleurs), on révise sans rien garder. */
const secs=q=>q.t0?Math.round((Date.now()-q.t0)/1000):0;
// Chaque réponse est un premier essai : il n'y a pas de deuxième essai dans ce parcours (un mot raté revient plus tard).
// question = « ecrit-<mot> » (ex. « ecrit-singe »), difficulté 2 (comme avant la suppression du QCM).
function record(q,ok,rep,w){
  if(window.miniprof)window.miniprof.reponse({competence:q.skill,juste:ok,mode:'e',difficulte:q.level,question:'ecrit-'+w.id,reponse:rep==null?null:rep,duree:secs(q)});
}
let S={screen:'home'};      // écran courant (question en cours, choix, mot tapé)
let P=null;                 // le parcours : mots à poser, rappels, fautes
function show(html){app.innerHTML=html;window.scrollTo(0,0);}
function topbar(title,backAct){
  return `<div class="topbar"><div class="topbar-in"><button class="back" data-act="${backAct||'home'}">← Quitter</button><span class="ttl">${title}</span></div></div>`;
}

/* ================= MOTEUR : le parcours (écrire les mots, rappels invisibles) ================= */
// Chaque mot est posé une fois, dans le désordre : une devinette, l'enfant écrit le mot. Une bonne
// réponse enchaîne tout de suite sur le mot suivant (aucun message). Un mot raté montre sa correction,
// puis revient 4 questions plus tard (rappel), sans que l'enfant voie de « passe » : une jauge montre
// seulement les mots acquis. Quand tous les mots ont été posés, les mots qui ont eu une faute sont
// reposés une dernière fois (vérification cachée), jusqu'à une vérification sans faute. Alors : bilan.
// Un mot réussi du premier coup n'est jamais reposé (plan P013, règle des dictées).
function home(){
  S={screen:'home'};P=null;
  show(`<section class="hero"><div class="hero-in">
      <h1>Dictée 8 : Sans famille (3)</h1>
      <p>Les ${TOUS.length} mots à savoir.</p>
    </div></section>
    <main class="wrap">
      <div class="card">
        <p>Une devinette : tu écris le mot toi-même.</p>
        <p class="small">Les mots ratés reviennent un peu plus tard, jusqu'à ce que tu les saches.</p>
      </div>
      <div class="btns"><button class="btn primary" data-act="start" data-primary>Commencer</button></div>
    </main>`);
}
// P.queue : les mots (puis, en vérification, ceux à reposer) ; P.rappels : mots ratés qui reviennent ;
// P.aVerifier : ids des mots ratés pas encore revalidés à la vérification ; P.n : réponses données
// (sert à espacer les rappels).
function start(){
  P={errs:{},t0:Date.now(),mode:'principal',queue:shuffle(TOUS.slice()),i:0,rappels:[],aVerifier:new Set(),n:0};
  ask();
}
// Le mot suivant : un rappel échu, sinon la suite, sinon les rappels restants, sinon une vérification
// des mots ratés ; null quand tout est fini.
function prochainMot(){
  const k=P.rappels.findIndex(r=>r.apres<=P.n);
  if(k>=0)return P.rappels.splice(k,1)[0].w;
  if(P.i<P.queue.length)return P.queue[P.i++];
  if(P.rappels.length)return P.rappels.shift().w;
  if(P.aVerifier.size>0){
    P.mode='verif';P.queue=shuffle(TOUS.filter(w=>P.aVerifier.has(w.id)));P.i=0;
    return P.queue[P.i++];
  }
  return null;
}
function ask(){
  const w=prochainMot();
  if(w===null){final();return;}
  const q=mkEcrire(w);
  S={screen:'q',q,w,done:false};
  // jauge : les mots pas encore posés ou pas encore revalidés ne sont pas « acquis »
  const attente=(P.mode==='principal'?P.queue.length-P.i:0)+P.aVerifier.size+(P.aVerifier.has(w.id)?0:1);
  const acquis=Math.max(0,TOUS.length-attente),pc=Math.round(100*acquis/TOUS.length);
  show(`${topbar('Écrire les mots')}<main class="wrap qwrap">
    <div class="bar" aria-hidden="true"><i style="width:${pc}%"></i></div>
    <p class="small">${acquis} mot${acquis>1?'s':''} acquis sur ${TOUS.length}</p>
    <div class="card"><div class="q-prompt">${q.prompt}</div>
      <div class="write"><input id="rep" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="Ta réponse" placeholder="Écris le mot"></div></div>
    <div id="fb"></div>
    <div class="btns"><span id="acts" class="acts"><button class="btn primary" id="ok" data-act="check" data-primary hidden>Valider</button></span></div>
    <div class="sigbar"><div id="sig"></div><button class="btn sigbtn" data-act="sig">⚑ Une erreur ?</button></div></main>`);
  q.t0=Date.now();
  const champ=document.getElementById('rep');
  if(champ)champ.focus();   // le clavier reste ouvert d'un mot au suivant
}
function aReponse(){
  const i=document.getElementById('rep');
  return !!(i&&norm(i.value));
}
function majValider(){const b=document.getElementById('ok');if(b&&!S.done)b.hidden=!aReponse();}
function check(){
  if(S.done)return;
  const q=S.q,w=S.w;
  const i=document.getElementById('rep'),rep=i?i.value.slice(0,60):'';
  if(!norm(rep)){document.getElementById('fb').innerHTML='<div class="fb hint">Écris ta réponse.</div>';return;}
  const v=judgeWrite(q,rep),ok=v.ok;
  S.done=true;
  record(q,ok,rep,w);
  // un mot raté revient 4 questions plus tard, et sera reposé à la vérification ; réussi à la vérification : acquis
  P.n++;
  if(!ok){P.errs[w.id]=(P.errs[w.id]||0)+1;P.aVerifier.add(w.id);P.rappels.push({w,apres:P.n+4});}
  else if(P.mode==='verif')P.aVerifier.delete(w.id);
  // bonne réponse : on enchaîne, sans message (ça fait perdre du temps)
  if(ok){ask();return;}
  i.disabled=true;i.classList.add('bad');
  document.getElementById('fb').innerHTML=`<div class="fb bad"><p><b>Pas tout à fait.</b></p><p>Tu as écrit : <b>${esc(rep)}</b>. ${v.why}</p></div><div class="fb info">${q.explain}<p class="small">Ce mot reviendra un peu plus tard.</p></div>`;
  document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="ask" data-primary>Mot suivant</button>`;
}
function final(){
  S={screen:'final'};
  const duree=Math.round((Date.now()-P.t0)/1000);
  const dur=TOUS.filter(w=>P.errs[w.id]).sort((a,b)=>P.errs[b.id]-P.errs[a.id]);
  const aSavoir=dur.length
    ?`<h2 style="margin:16px 0 6px">Les mots qui t'ont résisté</h2><div class="rulebox"><p class="big-s" style="margin:0">${dur.map(w=>label(w)+(P.errs[w.id]>1?` (${P.errs[w.id]} fautes)`:'')).join(' · ')}</p></div>`
    :`<p>Aucune faute du début à la fin : bravo !</p>`;
  show(`${topbar('Bilan','home')}<main class="wrap">
    <div class="card center"><div class="score">${TOUS.length}<span style="font-size:1.6rem;color:var(--muted)"> mots</span></div>
      <p style="margin-top:10px"><b>Tu sais écrire les ${TOUS.length} mots de la dictée.</b></p>
      <p class="small">${Math.floor(duree/60)} min ${duree%60} s</p></div>
    ${aSavoir}
    <div class="btns"><button class="btn primary" data-act="bilan" data-primary>Mon bilan</button><button class="btn" data-act="start">Recommencer</button><button class="btn ghost" data-act="home">Accueil</button></div></main>`);
}

/* ================= MOTEUR : signaler un problème ================= */
// Bouton « Une erreur ? » : l'enfant confirme (Oui / Non), puis miniprof garde une copie de la question
// (énoncé, choix, réponse attendue, réponse donnée) avec un commentaire facultatif.
const txt=h=>{const d=document.createElement('div');d.innerHTML=h==null?'':h;return d.textContent.replace(/\s+/g,' ').trim();};
function sigAsk(){
  document.getElementById('sig').innerHTML=`<div class="fb info"><p><b>Tu penses qu'il y a une erreur dans cette question ?</b></p>
    <div class="btns"><button class="btn primary" data-act="sigyes">Oui, signaler</button><button class="btn" data-act="signo">Non</button></div></div>`;
}
function sigYes(){
  const q=S.q||{},ch=q.choices||[],zone=document.getElementById('sig');
  const lab=v=>{const c=ch.find(c=>c.v===v);return c?(txt(c.label)||'(image)'):'';};
  const champ=document.getElementById('rep');
  const att=q.write?String(q.write.ok[0]):(q.exp&&q.exp.c!==undefined?lab(q.exp.c):'');
  const id=window.miniprof?window.miniprof.signaler({enonce:txt(q.prompt),choix:ch.map(c=>txt(c.label)||'(image)'),
    attendue:att,reponse:champ?champ.value:(S.choice?lab(S.choice):'')}):null;
  zone.innerHTML=id
    ?`<div class="fb good"><p><b>Merci !</b> Un adulte va vérifier cette question.</p>
      <div style="margin:10px 0"><input id="sigtxt" style="width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)" type="text" maxlength="300" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Tu veux dire pourquoi ?" placeholder="Tu veux dire pourquoi ? (facultatif)"></div>
      <div class="btns"><button class="btn" data-act="sigsend" data-id="${esc(id)}">Envoyer</button></div></div>`
    :`<div class="fb bad"><p>Le signalement n'a pas pu être enregistré.</p></div>`;
}
function sigSend(el){
  const t=document.getElementById('sigtxt'),zone=document.getElementById('sig');
  if(t&&t.value.trim()&&window.miniprof)window.miniprof.commenter(el.dataset.id,t.value);
  zone.innerHTML='<div class="fb good"><p>Merci, c\'est noté.</p></div>';
}

/* ================= MOTEUR : bilan (celui de miniprof) ================= */
function bilan(){
  const m=window.miniprof;
  if(m)location.href=m.racine+'#/module/'+encodeURIComponent(m.module)+'/bilan';
}

/* ================= MOTEUR : actions ================= */
function act(a,el){
  switch(a){
    case 'home':home();break;
    case 'start':start();break;
    case 'ask':ask();break;
    case 'choose':if(S.done)break;S.choice=el.dataset.v;app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c===el));majValider();break;
    case 'check':check();break;
    case 'sig':sigAsk();break;
    case 'signo':document.getElementById('sig').innerHTML='';break;
    case 'sigyes':sigYes();break;
    case 'sigsend':sigSend(el);break;
    case 'bilan':bilan();break;
    default:break;
  }
}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t);});
// un mot tapé = une proposition : « Valider » apparaît
app.addEventListener('input',e=>{if(e.target.id==='rep')majValider();});
// touche Entrée (« OK » du clavier de l'iPhone) dans le champ de réponse = bouton principal
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rep'){e.preventDefault();const b=app.querySelector('[data-primary]');if(b&&!b.hidden)b.click();}});

// Pas de dictée vocale ni de collage : un mot s'écrit lettre par lettre. Une page web ne peut pas masquer la
// touche micro du clavier ; on refuse donc ce qui arrive d'un coup (plusieurs lettres en une seule saisie,
// collage, remplacement par suggestion) et on remet le champ comme il était (retour d'usage, 18 nov. 2026).
(function(){
  const champ=e=>e.target&&e.target.id==='rep';
  const refuser=(i,avant)=>{
    i.value=avant;
    const fb=document.getElementById('fb');
    if(fb)fb.innerHTML='<div class="fb hint"><p>Écris le mot toi-même, lettre par lettre : pas de micro ni de collage.</p></div>';
  };
  app.addEventListener('beforeinput',e=>{
    if(!champ(e))return;
    if(/FromPaste|FromDrop|FromYank|Dictation|Transcription|ReplacementText/.test(e.inputType||'')){e.preventDefault();refuser(e.target,e.target.value);return;}
    e.target.dataset.avant=e.target.value;   // le champ juste avant cette saisie
  },true);
  app.addEventListener('input',e=>{
    if(!champ(e))return;
    const i=e.target,avant=i.dataset.avant;
    delete i.dataset.avant;
    if(avant!==undefined&&i.value.length-avant.length>1){e.stopImmediatePropagation();refuser(i,avant);}
  },true);
  app.addEventListener('paste',e=>{if(champ(e)){e.preventDefault();refuser(e.target,e.target.value);}},true);
  app.addEventListener('drop',e=>{if(champ(e))e.preventDefault();},true);
})();

// Tirage automatique (tools/tirage.py) : la page donne ses générateurs au lieu de s'afficher.
// window.__miniprofTirage n'existe que dans l'outil, jamais dans un navigateur.
if(window.__miniprofTirage){window.__miniprofTirage({GEN,LEVELS,LEARN:[],SKILLS,EVAL_SKILLS:[]});return;}
home();

})();
</script>
