   faux:[['conduir',"À l'infinitif, ce verbe finit par <b>re</b> : condui<b>re</b>."],['condure',"N'oublie pas le <b>i</b> : cond<b>ui</b>re."],['condhuire',"Pas de <b>h</b> : cond<b>u</b>ire."],['conduirre',"Un seul <b>r</b> : condui<b>r</b>e."]]},

   faux:[['reguarder',"Pas de <b>u</b> après le g : re<b>g</b>arder."],['reggarder',"Un seul <b>g</b> : re<b>g</b>arder."],['regardre',"À l'infinitif, ce verbe finit par <b>er</b> : regard<b>er</b>."],['regarer',"N'oublie pas le <b>d</b> : regar<b>d</b>er."]]},
  {m:"s'arrêter",nat:'verbe',conj:"je m'arrête",dev:"C'est ce que fait une voiture au feu rouge (verbe à l'infinitif).",ph:'Au feu rouge, la voiture doit ___.',
   faux:[["s'arreter","N'oublie pas l'accent circonflexe : s'arr<b>ê</b>ter."],["s'arêter","Il faut deux <b>r</b> : s'a<b>rr</b>êter."],["s'arrèter","L'accent est un circonflexe (^) : s'arr<b>ê</b>ter."],['sarrêter',"N'oublie pas l'apostrophe : <b>s'</b>arrêter."]]},
  {m:'long',nat:'adjectif',dev:"C'est le contraire de court.",ph:'Ce serpent est très ___.',
   faux:[['lon',"Il y a un <b>g</b> muet à la fin : lon<b>g</b>. Pense à « longue »."],['lont',"La lettre muette est un <b>g</b> : lon<b>g</b>. Pense à « longue »."],['longt',"Pas de <b>t</b> à la fin : lon<b>g</b>."],['lomg',"Le son « on » s'écrit <b>on</b> : l<b>on</b>g."]]},
  {m:'derrière',nat:'invariable',dev:"C'est le contraire de devant.",ph:'Le chat se cache ___ le rideau.',
   faux:[['derière',"Il faut deux <b>r</b> : de<b>rr</b>ière."],['dérrière',"Pas d'accent sur le premier e : d<b>e</b>rrière."],['derriere',"N'oublie pas l'accent grave : derri<b>è</b>re."],['derrièr',"Il y a un <b>e</b> à la fin : derrièr<b>e</b>."]]},
  {m:'au-dessus',nat:'invariable',dev:"C'est le contraire de au-dessous.",ph:"L'avion passe ___ de la maison.",
   faux:[['au dessus',"N'oublie pas le trait d'union : au<b>-</b>dessus."],['au-dessu',"Il y a un <b>s</b> muet à la fin : au-dessu<b>s</b>."],['au-desus',"Il faut deux <b>s</b> au milieu : au-de<b>ss</b>us."]]},
  {m:'dans',nat:'invariable',dev:"Petit mot qui veut dire « à l'intérieur de ».",ph:'Le pompier monte ___ son camion.',
   faux:[['dan',"Il y a un <b>s</b> muet à la fin : dan<b>s</b>."],['dant',"La lettre muette est un <b>s</b> : dan<b>s</b>."],['dens',"Le son « an » s'écrit <b>an</b> : d<b>an</b>s."],['dhans',"Pas de <b>h</b> : d<b>a</b>ns."]]}
];
NOMS.forEach(w=>{w.nat='nom';});
const TOUS=NOMS.concat(MOTS);
const NAT={nom:'un nom',verbe:'un verbe',adjectif:'un adjectif',invariable:'un mot invariable'};
// Pourquoi ce mot a cette nature (même phrase dans les corrections et les fiches)
function carNat(w){
  if(w.nat==='nom')return `on peut dire « ${w.det} ${w.m} » : c'est <b>un nom</b>.`;
  if(w.nat==='verbe')return `on peut le conjuguer (${w.conj}) : c'est <b>un verbe</b>.`;
  if(w.nat==='adjectif')return `il dit comment est le nom (un camion ${w.m}) : c'est <b>un adjectif</b>.`;
  return `il ne change jamais, ni au pluriel ni au féminin : c'est <b>un mot invariable</b>.`;
}
// Phrase de la leçon avec le mot en gras (le trou ___ rempli)
const phraseAvec=w=>w.ph.replace('___',`<b>${w.m}</b>`);
const trou=s=>s.replace('___','<span class="blank">______</span>');

// Présent de avoir et être : une forme par personne (je, tu, il/elle/on, nous, vous, ils/elles)
const FORMES={avoir:['ai','as','a','avons','avez','ont'],etre:['suis','es','est','sommes','êtes','sont']};
const NOMV={avoir:'avoir',etre:'être'};
const PERS=['je','tu','il, elle ou on','nous','vous','ils ou elles'];
// Mots qui se prononcent comme une forme du verbe : le piège classique du CM1.
const HOMO={
  'à':"« à » avec un accent n'est pas un verbe : il dit où l'on va (à la maison). Le verbe avoir s'écrit <b>a</b>, sans accent.",
  'et':"« et » relie deux mots (toi et moi) : ce n'est pas un verbe. Le verbe être s'écrit <b>est</b>.",
  'on':"« on » est un pronom (on = quelqu'un) : ce n'est pas un verbe. Le verbe avoir s'écrit <b>ont</b>, avec un t.",
  'son':"« son » veut dire « le sien » (son camion) : ce n'est pas un verbe. Le verbe être s'écrit <b>sont</b>, avec un t.",
  'ais':"Avec je, avoir s'écrit sans s : j'<b>ai</b>.",
  'etes':"Il manque l'accent circonflexe : vous <b>êtes</b>."
};
// Pièges du niveau 3 : 3 mauvaises réponses par verbe et par personne (toutes différentes de la bonne).
const PIEGES={
  avoir:[['ais','es','est'],['a','à','es'],['à','as','est'],['avez','ont','sommes'],['avons','êtes','ont'],['on','sont','a']],
  etre:[['es','est','ai'],['est','et','as'],['et','es','a'],['êtes','sont','avons'],['sommes','etes','avez'],['son','ont','est']]
};
// Pourquoi ce mot ne va pas, pour le verbe v à la personne p
function pourquoiForme(tok,v,p){
  if(HOMO[tok])return HOMO[tok];
  const i=FORMES[v].indexOf(tok);
  if(i>=0)return `« ${tok} » va avec ${PERS[i]}. Ici, il faut la forme qui va avec ${PERS[p]}.`;
  const autre=v==='avoir'?'etre':'avoir';
  return `« ${tok} », c'est le verbe ${NOMV[autre]}. Ici, il faut le verbe ${NOMV[v]}.`;
}
// Pronom + forme, avec l'apostrophe de « j'ai »
const avecPronom=(pr,v,f)=>pr==='je'&&v==='avoir'?`j'${f}`:`${pr} ${f}`;
const avecPronomB=(pr,v,f)=>avecPronom(pr,v,`<b>${f}</b>`);
// Sujet suivi du trou : « J'___ » pour je + avoir, sinon « Sujet ___ »
function sujetTrou(s,v,p){
  if(p===0&&v==='avoir')return s.replace(/je$/,"j'").replace(/^Je$/,"J'")+'<span class="blank">______</span>';
  return s+' <span class="blank">______</span>';
}
// Sujets des phrases : [texte, personne 0..5, pronom qui le remplace]
const SUJ2=[['Je',0,'je'],['Tu',1,'tu'],['Le pompier',2,'il'],['La conductrice',2,'elle'],['Mon frère',2,'il'],['On',2,'on'],
  ['Nous',3,'nous'],['Vous',4,'vous'],['Les pompiers',5,'ils'],['Mes parents',5,'ils'],['Mes cousines',5,'elles'],['Il',2,'il']];
// Niveau 3 : sujets à deux noms, et sujets où un nom proche du verbe trompe (piège : on accorde avec le vrai sujet).
const SUJ3=[['Mon frère et moi',3,'nous'],['Papa et moi',3,'nous'],['Toi et ton amie',4,'vous'],['Ta sœur et toi',4,'vous'],
  ['Le pompier et le chauffeur',5,'ils'],['Maman et papa',5,'ils'],['Ma cousine et sa mère',5,'elles'],
  ['Les amis de mon frère',5,'ils',"Le sujet est « les amis » (plusieurs), pas « mon frère »."],
  ['Le chauffeur des camions',2,'il',"Le sujet est « le chauffeur » (un seul), pas « les camions »."],
  ['Ce matin, je',0,'je'],['Toi, tu',1,'tu']];
// Compléments qui vont avec tous les sujets (personnes), pour que la phrase ait du sens
const COMPL={avoir:['une montre neuve','un camion rouge','une longue voiture','peur des avions','rendez-vous chez le docteur'],
  etre:['dans la voiture','derrière le camion',"dans l'ambulance",'en retard',"dans l'avion",'derrière la maison']};

/* ================= CONTENU : un générateur par compétence ================= */
// Écrire un mot (questions à écrire, décision D15 : écrire le mot, pas le choisir) :
// 1 = devinette ; 2 = phrase à trous ; 3 = un mot mal écrit à corriger.
// Les fautes fréquentes de chaque mot (w.faux) deviennent des fautes prévues, avec leur pourquoi.
function fautesMot(w){const e={};w.faux.forEach(f=>{e[f[0]]=f[1];});return e;}
function genEcrire(skill,liste,level){
  const w=pick(liste),e=fautesMot(w);
  // pour un nom, on accepte aussi le mot avec son déterminant (« une voiture »)
  const ok=w.det?[w.m,`${w.det} ${w.m}`]:[w.m];
  const fin=`<p>On écrit <b>${w.m}</b> : ${phraseAvec(w)}</p>`;
  if(level===3){
    const f=pick(w.faux);
    e[f[0]]="Tu as recopié le mot mal écrit : cherche la faute et corrige-la.";
    return W(skill,level,`<p>Ce mot est <b>mal écrit</b> : <span class="big-s">${f[0]}</span></p><p>Écris-le correctement.</p>`,ok,e,
      `<p>Regarde bien les lettres muettes, les lettres doublées et les accents.</p>`,
      `<p>${f[1]}</p>${fin}`);
  }
  const prompt=level===1
    ?`<p><b>Devinette :</b> ${w.dev}</p><p>Écris le mot.</p>`
    :`<p>Écris le mot qui manque :</p><p class="big-s">${trou(w.ph)}</p>`;
  return W(skill,level,prompt,ok,e,
    `<p>Le mot commence par « ${w.m.slice(0,2)} ». Pense à la fiche Apprendre.</p>`,fin);
}
const genNoms=level=>genEcrire('noms',NOMS,level);
const genMots=level=>genEcrire('mots',MOTS,level);

// Nature : 1 = un mot dans sa phrase ; 2 = lequel est un… ; 3 = l'intrus.
// « montre » (il montre) et « derrière » (un derrière) peuvent changer de nature : on ne les
// montre que dans leur phrase (niveau 1), jamais seuls, pour qu'il n'y ait qu'une bonne réponse.
const SURS=TOUS.filter(w=>w.m!=='montre'&&w.m!=='derrière');
function genNature(level){
  if(level===1){
    const w=pick(TOUS);
    const ch=Object.keys(NAT).map(k=>k===w.nat?C(k,NAT[k]):C(k,NAT[k],`« ${w.m} » : ${carNat(w)}`));
    return Q('nature',level,`<p>Dans la phrase :</p><p class="big-s">${phraseAvec(w)}</p><p>Le mot <b>${w.m}</b> est…</p>`,ch,w.nat,
      `<p>Un nom : on peut mettre un ou une devant. Un verbe : on peut le conjuguer. Un adjectif : il dit comment est le nom. Un mot invariable ne change jamais.</p>`,
      `<p>« ${w.m} » : ${carNat(w)}</p>`);
  }
  if(level===2){
    // un mot de chaque nature : une seule bonne réponse
    const mots=Object.keys(NAT).map(k=>pick(SURS.filter(w=>w.nat===k)));
    const cible=pick(mots);
    const ch=mots.map(w=>w===cible?C(w.m,w.m):C(w.m,w.m,`« ${w.m} » est ${NAT[w.nat]}.`));
    return Q('nature',level,`<p>Lequel de ces mots est <b>${NAT[cible.nat]}</b> ?</p>`,ch,cible.m,
      `<p>Essaie chaque mot : peux-tu mettre « un » devant ? le conjuguer ? le mettre après « un camion » ?</p>`,
      `<p>« ${cible.m} » : ${carNat(cible)}</p>`);
  }
  // niveau 3 : trois noms ou trois verbes, et un intrus d'une autre nature
  const groupe=pick(['nom','verbe']);
  const trois=shuffle(SURS.filter(w=>w.nat===groupe)).slice(0,3);
  const intrus=pick(SURS.filter(w=>w.nat!==groupe));
  const ch=trois.map(w=>C(w.m,w.m,`« ${w.m} » est bien ${NAT[groupe]}.`)).concat([C(intrus.m,intrus.m)]);
  return Q('nature',level,`<p>Trois mots sont de la même nature. <b>Lequel est l'intrus ?</b></p>`,ch,intrus.m,
    `<p>Cherche d'abord la nature commune aux trois autres mots.</p>`,
    `<p>Les trois autres sont des ${groupe}s. « ${intrus.m} » : ${carNat(intrus)}</p>`);
}

// Avoir et être (questions à écrire, D15) : 1 = un pronom ; 2 = une phrase ;
// 3 = sujets pièges. L'enfant écrit la forme ; les autres formes et les mots qui se prononcent
// pareil (son / sont, on / ont, à / a, et / est) sont des fautes prévues, avec leur pourquoi.
const HOMOV={'à':'avoir','on':'avoir','ais':'avoir','et':'etre','son':'etre','etes':'etre'};
function fautesVerbe(v,p){
  const f=FORMES[v][p],e={};
  FORMES.avoir.concat(FORMES.etre).concat(Object.keys(HOMOV).filter(k=>HOMOV[k]===v))
    .forEach(k=>{if(k!==f&&!e[k])e[k]=pourquoiForme(k,v,p);});
  return e;
}
// Astuce pour les pluriels qui se prononcent comme un autre mot (sont / son, ont / on)
function astuce(v,p){
  if(p!==5)return '';
  return v==='etre'?" Astuce : si tu peux dire « ils <b>étaient</b> », c'est le verbe être : <b>sont</b>, avec un t."
    :" Astuce : si tu peux dire « ils <b>avaient</b> », c'est le verbe avoir : <b>ont</b>, avec un t.";
}
function genVerbe(v,level){
  const nomV=NOMV[v];
  if(level===1){
    const p=R(0,5),pr=p===2?pick(['il','elle','on']):p===5?pick(['ils','elles']):PERS[p];
    const f=FORMES[v][p];
    const debut=pr==='je'&&v==='avoir'?"j'":pr+' ';
    return W(v,level,`<p>Conjugue <b>${nomV}</b> au présent. Écris le verbe :</p><p class="big">${debut}<span class="blank">______</span></p>`,
      [f,avecPronom(pr,v,f)],fautesVerbe(v,p),
      `<p>Récite dans l'ordre : ${avecPronom('je',v,FORMES[v][0])}, tu ${FORMES[v][1]}, il ${FORMES[v][2]}…</p>`,
      `<p>Avec ${pr}, ${nomV} s'écrit <b>${f}</b> : ${avecPronomB(pr,v,f)}.${astuce(v,p)}</p>`);
  }
  const s=pick(level===2?SUJ2:SUJ3),p=s[1],f=FORMES[v][p],cpl=pick(COMPL[v]);
  const remplace=s[0].toLowerCase()===s[2]||/, /.test(s[0])?`Avec ${s[2]}`:`« ${s[0]} », c'est « ${s[2]} »`;
  return W(v,level,`<p>Écris le verbe <b>${nomV}</b> au présent :</p><p class="big-s">${sujetTrou(s[0],v,p)} ${cpl}.</p>`,[f],fautesVerbe(v,p),
    `<p>Par quel pronom peux-tu remplacer le sujet ? Je, tu, il, nous, vous ou ils ?${level===3?' Rappel : … et moi = nous ; … et toi = vous.':''}</p>`,
    `<p>${s[3]?s[3]+' ':''}${remplace} : ${avecPronomB(s[2],v,f)}.${astuce(v,p)}</p>`);
}

// Clés = ids des compétences de la fiche (même ordre).
const SKILLS={noms:{label:'Écrire les noms'},mots:{label:'Écrire les verbes et les petits mots'},
  nature:{label:'Reconnaître la nature des mots'},avoir:{label:'Avoir au présent'},etre:{label:'Être au présent'}};
const GEN={noms:genNoms,mots:genMots,nature:genNature,avoir:l=>genVerbe('avoir',l),etre:l=>genVerbe('etre',l)};
const LEVELS={1:{t:'Facile',d:'devinettes et pronoms'},2:{t:'Moyen',d:'des phrases à compléter'},3:{t:'Défi',d:'corriger les fautes, sujets pièges'}};
// 10 questions : 2 par compétence
const EVAL_SKILLS=['noms','noms','mots','mots','nature','nature','avoir','avoir','etre','etre'];
const CHEER=['Bravo !','Bien joué !','Exact !','Parfait !'];

/* ================= CONTENU : fiches Apprendre ================= */
const tableVerbe=v=>`<table class="conj">${FORMES[v].map((f,i)=>`<tr><td>${['je','tu','il, elle, on','nous','vous','ils, elles'][i]}</td><td><b>${f}</b></td></tr>`).join('')}</table>`
  .replace('<td>je</td><td><b>ai</b>','<td>j\'</td><td><b>ai</b>');
const LEARN=[
  {t:'Les noms à savoir',body:()=>`<p>Les 6 noms de la dictée :</p>
    <div class="rulebox">une voiture · un camion · une ambulance<br>un pompier · un avion · une montre</div>
    <p><b>Attention :</b> devant <b>m</b>, <b>b</b> et <b>p</b>, on écrit <b>m</b> (et pas n) : a<b>m</b>bulance, po<b>m</b>pier.</p>
    <p>Lettres muettes : voitur<b>e</b>, montr<b>e</b>. Un seul m dans ca<b>m</b>ion.</p>`,
   q:{p:'Quel mot est bien écrit ?',c:[C('ambulance','ambulance'),C('anbulance','anbulance',"Devant b, on écrit m : a<b>m</b>bulance.")],ok:'ambulance'}},
  {t:'Les autres mots à savoir',body:()=>`<div class="rulebox"><b>Verbes :</b> conduire · regarder · s'arrêter<br><b>Adjectif :</b> long<br><b>Mots invariables :</b> derrière · au-dessus · dans</div>
    <p>• s'arr<b>ê</b>ter : deux r et un accent circonflexe.</p>
    <p>• lon<b>g</b> : le g muet s'entend dans « longue ».</p>
    <p>• au<b>-</b>dessu<b>s</b> : un trait d'union et un s muet. dan<b>s</b> : un s muet.</p>
    <p>• de<b>rr</b>i<b>è</b>re : deux r et un accent grave.</p>`,
   q:{p:'Quel mot est bien écrit ?',c:[C('au-dessus','au-dessus'),C('au dessus','au dessus',"N'oublie pas le trait d'union : au<b>-</b>dessus.")],ok:'au-dessus'}},
  {t:'La nature des mots',body:()=>`<p>Sur la feuille, les mots sont rangés par <b>nature</b> :</p>
    <p>• un <b>nom</b> : on peut mettre un ou une devant (un avion).</p>
    <p>• un <b>verbe</b> : on peut le conjuguer (je regarde). On l'apprend à l'infinitif : regarder.</p>
    <p>• un <b>adjectif</b> : il dit comment est le nom (un camion <b>long</b>).</p>
    <p>• un <b>mot invariable</b> : il ne change jamais (dans, derrière, au-dessus).</p>`,
   q:{p:'« long » est…',c:[C('adjectif','un adjectif'),C('nom','un nom',"Un nom désigne une chose ; « long » dit comment est cette chose (un camion long)."),C('verbe','un verbe',"On ne peut pas conjuguer « long ».")],ok:'adjectif'}},
  {t:'Avoir au présent',body:()=>`${tableVerbe('avoir')}<p>Remplace le sujet par un pronom : <i>Les pompiers</i> → ils → ils <b>ont</b>.</p>
    <div class="rulebox">Ne confonds pas : il <b>a</b> (verbe) et <b>à</b> (à la maison) ; ils <b>ont</b> (verbe) et <b>on</b>.</div>`,
   q:{p:'nous …',c:[C('avons','avons'),C('avez','avez',"« avez » va avec vous."),C('ont','ont',"« ont » va avec ils.")],ok:'avons'}},
  {t:'Être au présent',body:()=>`${tableVerbe('etre')}<p>« Mon frère et moi » = nous → nous <b>sommes</b>. « Ta sœur et toi » = vous → vous <b>êtes</b>.</p>
    <div class="rulebox">Ne confonds pas : il <b>est</b> (verbe) et <b>et</b> (toi et moi) ; ils <b>sont</b> (verbe) et <b>son</b> (son camion).</div>`,
   q:{p:'Les pompiers … dans le camion.',c:[C('sont','sont'),C('son','son',"« son » veut dire « le sien ». Le verbe être avec ils : sont."),C('est','est',"« est » va avec il : ici, les pompiers = ils.")],ok:'sont'}},
  {t:'À retenir',recap:true,body:()=>`<p>• Devant m, b, p : on écrit m (ambulance, pompier).</p>

    <p>• Être : je suis, tu es, il est, nous sommes, vous êtes, ils sont.</p>`}
];

/* ================= MOTEUR : suivi miniprof (à garder tel quel) ================= */
const app=document.getElementById('app');
/* Les réponses vont dans le journal de l'enfant par ../js/suivi.js ; le bilan est celui de miniprof.
   Sans miniprof (page ouverte ailleurs), on révise sans rien garder. */
const secs=q=>q.t0?Math.round((Date.now()-q.t0)/1000):0;
function record(q,ok,rep){
  if(window.miniprof)window.miniprof.reponse({competence:q.skill,juste:ok,mode:'e',difficulte:q.level,question:q.skill,reponse:rep==null?null:rep,duree:secs(q)});
}
function genQuestion(skill,level){
  if(!skill||skill==='all')skill=pick(Object.keys(GEN));
  return GEN[skill](level);
}
const LVL=Object.keys(LEVELS).map(Number);
const MAXL=LVL[LVL.length-1];

let S={screen:'home'};
function show(html){app.innerHTML=html;window.scrollTo(0,0);}
// Écran d'où l'on vient : le parcours, ou les autres exercices (le retour y ramène).
let ACCUEIL='parcours';
function topbar(title,backAct){
  return `<div class="topbar"><div class="topbar-in"><button class="back" data-act="${backAct||ACCUEIL}">← Retour</button><span class="ttl">${title}</span></div></div>`;
}

/* ================= MOTEUR : Apprendre ================= */
function learn(step){S={screen:'learn',ls:step||0};renderLearn();}

      <div class="btns" id="lacts"></div>`;

function learnChoose(el){

/* ================= MOTEUR : entraînement / évaluation ================= */
function levelChips(sel,mix){
  let s='<div class="chips">';
  if(mix)s+=`<button class="chip ${sel===0?'on':''}" data-act="lvl" data-v="0">Mixte<small>un peu de tout</small></button>`;
  for(const i of LVL)s+=`<button class="chip ${sel===i?'on':''}" data-act="lvl" data-v="${i}">${LEVELS[i].t}<small>${LEVELS[i].d}</small></button>`;
  return s+'</div>';
}
function skillChips(sel){
  let s=`<div class="chips"><button class="chip ${sel==='all'?'on':''}" data-act="sk" data-v="all">Tout mélangé</button>`;
  for(const k in SKILLS)s+=`<button class="chip ${sel===k?'on':''}" data-act="sk" data-v="${k}">${SKILLS[k].label}</button>`;
  return s+'</div>';
}
function trainSetup(keep){
  if(!keep||S.screen!=='trainSetup')S={screen:'trainSetup',level:S.level||1,skill:S.skillPref||'all'};
  show(`${topbar("S'entraîner")}<main class="wrap">
    <h2>Choisis ton niveau</h2>${levelChips(S.level,false)}
    <h2>Que veux-tu travailler ?</h2>${skillChips(S.skill)}
    <div class="btns"><button class="btn primary" data-act="trainStart" data-primary>Commencer</button></div></main>`);
}
function evalSetup(keep){
  if(!keep||S.screen!=='evalSetup')S={screen:'evalSetup',level:S.evalLevel===undefined?0:S.evalLevel};
  show(`${topbar('Évaluation')}<main class="wrap">
    <h2>On passe à l'évaluation ?</h2>
    <p>${EVAL_SKILLS.length} questions sur toute la leçon, sans indice. Tu vois les corrections à la fin.</p>
    <h2 style="margin-top:14px">Niveau</h2>${levelChips(S.level,true)}
    <div class="btns"><button class="btn primary" data-act="evalStart" data-primary>Lancer l'évaluation</button></div></main>`);
}
const hasPic=q=>q.choices.some(c=>String(c.label).indexOf('<svg')>=0);
function qScreen(){
  const q=S.q,ev=S.mode==='eval';
  let head;
  if(ev){let d='';for(let i=0;i<S.total;i++)d+=`<i class="${i<S.i?'done':i===S.i?'cur':''}"></i>`;
    head=`<div class="dots" aria-hidden="true">${d}</div><p class="small">Question ${S.i+1} sur ${S.total} : ${SKILLS[q.skill].label.toLowerCase()}</p>`;}
  else head=`<p class="small">${SKILLS[q.skill].label}. ${S.okCount} réussie${S.okCount>1?'s':''} du premier coup sur ${S.tried}</p>`;
  show(`${topbar(ev?'Évaluation':"S'entraîner",ev?'quitEval':'trainSetup')}<main class="wrap qwrap">
    ${head}
    <div class="card"><div class="q-prompt">${q.prompt}</div>
      ${q.write
        // clavier de l'iPhone sans suggestions ni correction automatique : l'enfant écrit seul
        ?`<div class="write"><input id="rep" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="Ta réponse" placeholder="Écris ta réponse"></div>`
        :`<div class="choices ${hasPic(q)?'pics':''}">${q.choices.map((c,i)=>`<button class="choice" data-act="choose" data-v="${esc(c.v)}">${hasPic(q)?`<span class="pl">${'ABCDEF'[i]}</span>`:''}${c.label}</button>`).join('')}</div>`}</div>
    <div id="hint"></div><div id="fb"></div>
    <div class="btns"><span id="acts" class="acts"></span></div>
    <div class="sigbar"><div id="sig"></div><button class="btn sigbtn" data-act="sig">⚑ Une erreur ?</button></div></main>`);
  S.choice=null;S.attempts=0;S.retry=false;q.t0=Date.now();boutons();
}
/* ================= MOTEUR : signaler un problème ================= */
// Bouton « Une erreur ? » à côté de « Valider » : l'enfant confirme (Oui / Non), puis miniprof garde une
// copie de la question (énoncé, choix, réponse attendue, réponse donnée) avec un commentaire facultatif.
// Pourquoi une copie : les questions sont tirées au hasard, sans identifiant à retrouver ensuite.
const txt=h=>{const d=document.createElement('div');d.innerHTML=h==null?'':h;return d.textContent.replace(/\s+/g,' ').trim();};
function sigAsk(){
  document.getElementById('sig').innerHTML=`<div class="fb info"><p><b>Tu penses qu'il y a une erreur dans cette question ?</b></p>
    <div class="btns"><button class="btn primary" data-act="sigyes">Oui, signaler</button><button class="btn" data-act="signo">Non</button></div></div>`;
}
function sigYes(){
  const q=S.q||{},ch=q.choices||[],zone=document.getElementById('sig');
  const lab=v=>{const c=ch.find(c=>c.v===v);return c?(txt(c.label)||'(image)'):'';};
  const champ=document.getElementById('rep');
  const att=q.write?String(q.write.ok[0]):(q.exp&&q.exp.c!==undefined?lab(q.exp.c):'');
  const id=window.miniprof?window.miniprof.signaler({enonce:txt(q.prompt),choix:ch.map(c=>txt(c.label)||'(image)'),
    attendue:att,reponse:champ?champ.value:(S.choice?lab(S.choice):'')}):null;
  zone.innerHTML=id
    ?`<div class="fb good"><p><b>Merci !</b> Un adulte va vérifier cette question.</p>
      <div style="margin:10px 0"><input id="sigtxt" style="width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)" type="text" maxlength="300" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Tu veux dire pourquoi ?" placeholder="Tu veux dire pourquoi ? (facultatif)"></div>
      <div class="btns"><button class="btn" data-act="sigsend" data-id="${esc(id)}">Envoyer</button></div></div>`
    :`<div class="fb bad"><p>Le signalement n'a pas pu être enregistré.</p></div>`;
}
function sigSend(el){
  const t=document.getElementById('sigtxt'),zone=document.getElementById('sig');
  if(t&&t.value.trim()&&window.miniprof)window.miniprof.commenter(el.dataset.id,t.value);
  zone.innerHTML='<div class="fb good"><p>Merci, c\'est noté.</p></div>';
}
// Boutons de la question (P010, 12/10/2026). « Valider » n'apparaît que lorsque l'élève a proposé
// une réponse (mot tapé, choix, dessin non vide). Après une erreur, « Réessayer » efface sa
// proposition ; « Valider » revient (caché) tant qu'il n'a rien reproposé.
function aReponse(){
  if(S.q&&S.q.draw)return Object.keys(S.grid||{}).length>0;
  const i=document.getElementById('rep');
  return i?!!norm(i.value):!!S.choice;
}
function majValider(){const b=document.getElementById('ok');if(b)b.hidden=!aReponse();}
function boutons(){
  const ev=S.mode==='eval',last=ev&&S.i===S.total-1;
  const aide=ev?'':'<button class="btn ghost" data-act="hint">Un indice</button>'+(S.attempts>0?'<button class="btn ghost" data-act="reveal">Voir la correction</button>':'');
  const principal=S.retry
    ?'<button class="btn primary" data-act="retry" data-primary>Réessayer</button>'
    :`<button class="btn primary" id="ok" data-act="check" data-primary hidden>${ev?(last?'Valider et terminer':'Valider et continuer'):'Valider'}</button>`;
  document.getElementById('acts').innerHTML=principal+aide;
  majValider();
}
// L'élève propose (ou modifie) une réponse : si « Réessayer » attendait, « Valider » reprend sa place.
function surProposition(){if(S.retry){S.retry=false;boutons();}else majValider();}
function reessayer(){
  S.retry=false;S.choice=null;
  const i=document.getElementById('rep');
  if(i){i.value='';i.focus();}
  // QCM : la réponse fausse repasse en neutre (elle était rouge et grisée)
  app.querySelectorAll('.choice').forEach(c=>{c.classList.remove('sel','bad');c.disabled=false;});
  boutons();
}
function setFb(html){document.getElementById('fb').innerHTML=html;}
function lockChoices(){
  const inp=document.getElementById('rep');
  if(inp){inp.disabled=true;inp.classList.add(S.q.write&&judgeWrite(S.q,inp.value).ok?'good':'bad');}
  app.querySelectorAll('.choice').forEach(c=>{c.classList.add('locked');c.disabled=true;
    if(c.dataset.v===S.q.exp.c)c.classList.add('good');else if(c.dataset.v===S.choice)c.classList.add('bad');});
}
// la réponse tapée (question à écrire), coupée à 60 caractères pour le journal
function lireEcrit(){const i=document.getElementById('rep');return i?i.value.slice(0,60):'';}
function checkTrain(){
  let v=null;
  if(S.q.write){S.choice=lireEcrit();if(!norm(S.choice)){setFb('<div class="fb hint">Écris ta réponse.</div>');return;}v=judgeWrite(S.q,S.choice);}
  else if(!S.choice){setFb('<div class="fb hint">Choisis une réponse.</div>');return;}
  const q=S.q;S.attempts++;
  const ok=v?v.ok:S.choice===q.exp.c;
  // seul le premier essai compte dans le journal (sinon cliquer au hasard gonfle la réussite)
  if(S.attempts===1){S.tried++;if(ok){S.okCount++;S.streak++;}else S.streak=0;record(q,ok,S.choice);}
  if(ok){
    lockChoices();
    let extra='';
    if(S.streak>=5&&S.level<MAXL)extra=`<p>${S.streak} réussites d'affilée : tu peux passer au niveau ${LEVELS[S.level+1].t}.</p>`;
    setFb(`<div class="fb good"><p><b>${pick(CHEER)}</b>${S.attempts>1?' Tu as trouvé au deuxième essai.':''}</p>${q.explain}${extra}</div>`);
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>${extra?`<button class="btn" data-act="levelup">Niveau ${LEVELS[S.level+1].t}</button>`:''}`;
  }else if(S.attempts===1||(v&&S.attempts<3)){
    // une question à écrire laisse 3 essais : l'enfant corrige son mot lui-même
    const c=v?null:q.choices.find(c=>c.v===S.choice);
    const why=v?v.why+'<br><span class="small">Appuie sur « Réessayer » ou touche le champ, puis écris ta réponse à nouveau.</span>':(c&&c.why?c.why:'Relis la question et réessaie.');
    setFb(`<div class="fb bad"><p><b>Pas tout à fait.</b> ${why}</p></div>`);
    if(!v)app.querySelectorAll('.choice').forEach(b=>{if(b.dataset.v===S.choice){b.classList.remove('sel');b.classList.add('bad');b.disabled=true;}});
    S.choice=null;
    S.retry=true;boutons();
  }else revealTrain();
}
function revealTrain(){
  if(S.attempts===0){S.attempts=1;S.tried++;S.streak=0;record(S.q,false,null);}
  lockChoices();
  setFb(`<div class="fb info"><p><b>Correction</b></p>${S.q.explain}</div>`);
  document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>`;
}
function nextTrain(){S.q=genQuestion(S.skill,S.level);qScreen();}

// Une évaluation ne pose jamais deux fois la même question : on retire une question déjà
// sortie (jusqu'à 30 essais, au cas où une compétence aurait peu de questions).
// Signalé par le sponsor le 12/10/2026 (la même question deux fois dans une évaluation).
function tirerSansDoublon(skills,niveau){
  const vus=new Set();
  // même question = même énoncé ET mêmes choix (un énoncé comme « Lequel est l'intrus ? » revient
  // légitimement avec d'autres mots)
  const cle=q=>q.prompt+'|'+(q.choices||[]).map(c=>c.v).sort().join(',')+'|'+q.exp.c;
  return skills.map((s,i)=>{let q,n=0;do{q=genQuestion(s,niveau(i));n++;}while(vus.has(cle(q))&&n<30);vus.add(cle(q));return q;});
}
function evalStart(){
  const lvl=S.level;
  // Mixte (0) : les niveaux tournent, pour que chacun soit représenté
  const qs=tirerSansDoublon(shuffle(EVAL_SKILLS.slice()),i=>lvl===0?LVL[i%LVL.length]:lvl);
  S={screen:'eval',mode:'eval',evalLevel:lvl,level:lvl,qs,i:0,total:qs.length,results:[],t0:Date.now(),
    cle:window.miniprof?window.miniprof.debutEvaluation(lvl):null};
  S.q=qs[0];qScreen();
}
function checkEval(){
  if(S.q.write){S.choice=lireEcrit();if(!norm(S.choice)){setFb('<div class="fb hint">Écris ta réponse avant de continuer.</div>');return;}}
  else if(!S.choice){setFb('<div class="fb hint">Choisis une réponse avant de continuer.</div>');return;}
  S.results.push({q:S.q,ans:S.choice,ok:S.q.write?judgeWrite(S.q,S.choice).ok:S.choice===S.q.exp.c,duree:secs(S.q)});
  S.i++;
  if(S.i>=S.total){evalEnd();return;}
  S.q=S.qs[S.i];qScreen();
}
const lblOf=(q,v)=>{if(q.write)return esc(v);const c=q.choices.find(c=>c.v===v);return c?c.label:'';};
function evalEnd(){
  const res=S.results,score=res.filter(r=>r.ok).length,total=res.length;
  const duree=Math.round((Date.now()-S.t0)/1000);
  const sk={};
  res.forEach(r=>{const s=sk[r.q.skill]||(sk[r.q.skill]=[0,0]);s[1]++;if(r.ok)s[0]++;});
  // l'évaluation est enregistrée d'un bloc à la fin : abandonnée au milieu, elle ne compte pas
  if(window.miniprof)window.miniprof.reponse(res.map(r=>({competence:r.q.skill,juste:r.ok,mode:'v',difficulte:r.q.level,
    question:r.q.skill,reponse:r.ans,duree:r.duree,evaluation:S.cle})));
  let weakest=null,wp=2;for(const k in sk){const p=sk[k][0]/sk[k][1];if(p<wp){wp=p;weakest=k;}}
  const pc=score/total;
  const msg=pc>=.9?"Excellent ! Tu maîtrises ta leçon.":pc>=.7?"Très bien ! Il ne reste que quelques détails à revoir.":pc>=.5?"Bon début. Regarde les corrections, puis entraîne-toi encore un peu.":"Pas de panique : relis les fiches Apprendre, puis entraîne-toi.";
  const bars=Object.keys(sk).map(k=>{const p=Math.round(100*sk[k][0]/sk[k][1]);return `<div><div class="row" style="justify-content:space-between"><span>${SKILLS[k].label}</span><b>${sk[k][0]}/${sk[k][1]}</b></div><div class="bar"><i class="${p<50?'low':p<80?'mid':''}" style="width:${p}%"></i></div></div>`;}).join('');
  const rev=res.map((r,i)=>`<details class="rev ${r.ok?'okk':'koo'}"><summary>${r.ok?'✓':'✗'} Question ${i+1} : ${SKILLS[r.q.skill].label}</summary>
    <div class="q-prompt">${r.q.prompt}</div>
    <p>Ta réponse :</p><div class="ans">${lblOf(r.q,r.ans)}</div>
    ${r.ok?'':`<p>Bonne réponse :</p><div class="ans good">${lblOf(r.q,r.q.exp.c)}</div>`}
    <div class="fb info">${r.q.explain}</div></details>`).join('');
  S.screen='result';S.weakest=weakest;
  show(`${topbar('Résultat','home')}<main class="wrap">
    <div class="card center"><div class="score">${score}<span style="font-size:1.6rem;color:var(--muted)"> / ${total}</span></div>
      <p style="margin-top:10px">${msg}</p><p class="small">Temps : ${Math.floor(duree/60)} min ${duree%60} s</p></div>
    <h2>Par compétence</h2><div style="margin-top:10px">${bars}</div>
    <h2 style="margin:16px 0 6px">Les corrections</h2>${rev}
    <div class="btns">
      ${weakest&&wp<1?`<button class="btn primary" data-act="trainWeak" data-primary>Travailler : ${SKILLS[weakest].label}</button>`:''}
      <button class="btn" data-act="evalSetup">Recommencer</button><button class="btn" data-act="bilan">Mon bilan</button><button class="btn ghost" data-act="home">Accueil</button>
    </div></main>`);
}

/* ================= PARCOURS (plan P012, pilote) ================= */
// Le module est un paysage : une route, des étapes. Une étape = une compétence, travaillée
// d'affilée jusqu'à une étoile (pratique groupée, P012 §3). L'étoile se gagne en remplissant
// une jauge de 40 points ; seule une réponse juste du PREMIER coup la remplit, et elle rapporte
// d'autant plus que la série est longue : Fibonacci(série), plafonné à 8 (décision D6).
// Après une erreur, la série est « en jeu » : la deuxième chance ne rapporte rien mais la sauve ;
// la rater remet la série à zéro. C'est cet enjeu qui donne envie de lire l'indice de Mini.
// Tout se recalcule depuis le journal (miniprof.historique()) : rien d'autre n'est stocké.
// Les réponses du parcours ont une question « parcours/<compétence> » ; la deuxième chance a le
// mode "r" (décision du sponsor du 12 oct. 2026).
const P={JAUGE:40,PLAFOND:8,PAUSE:30*60,JOUR:24*3600};
const QPARCOURS='parcours/';
const estParcours=e=>typeof e.question==='string'&&e.question.indexOf(QPARCOURS)===0;
function fib(n){let a=1,b=1;for(let i=1;i<n;i++){const t=a+b;a=b;b=t;}return a;}
const gainSerie=n=>Math.min(fib(n),P.PLAFOND);

// Difficulté dans une étape (P011) : on monte après 3 bonnes réponses du premier coup sur les
// 4 dernières, on descend après 2 erreurs de suite. « recents » repart à zéro à chaque changement.
function niveauApres(niv,recents){
  const n=recents.length;
  if(n>=2&&!recents[n-1]&&!recents[n-2])return {niv:Math.max(LVL[0],niv-1),change:niv>LVL[0]};
  if(recents.slice(-4).filter(Boolean).length>=3&&niv<MAXL)return {niv:niv+1,change:true};
  return {niv,change:false};
}

// Rejoue le journal : étapes passées (avec ou sans étoile), étape ouverte, série, dernier gain.
function etatParcours(evts){
  const ev=evts.filter(e=>e&&typeof e.date==='number').slice().sort((a,b)=>a.date-b.date);
  const etapes=[];let ouverte=null,serie=0,enJeu=false,derniere=null,recents=[],dernier=null;
  for(const e of ev){
    if(!estParcours(e)||(e.mode!=='e'&&e.mode!=='r'))continue;
    // nouvelle séance (30 min sans réponse) : la série repart de zéro, pas la jauge
    if(derniere!==null&&e.date-derniere>P.PAUSE){serie=0;enJeu=false;}
    derniere=e.date;
    if(e.mode==='r'){
      if(enJeu){enJeu=false;if(!e.juste)serie=0;dernier={type:e.juste?'sauvee':'perdue',gain:0,etoile:false};}
      continue;
    }
    // une erreur sans deuxième chance (page quittée) : la série est perdue
    if(enJeu){enJeu=false;serie=0;}
    if(!ouverte||ouverte.skill!==e.skill){
      // une étape commencée sur une autre compétence et jamais finie disparaît de la route
      if(ouverte)etapes.pop();
      ouverte={skill:e.skill,points:0,etoile:false,debut:e.date,fin:null,niveau:e.difficulty,
        revision:etapes.some(t=>t.etoile&&t.skill===e.skill)};
      etapes.push(ouverte);recents=[];
    }
    let g=0;
    if(e.juste){serie++;g=gainSerie(serie);ouverte.points+=g;}else enJeu=true;
    recents.push(!!e.juste);
    const nv=niveauApres(e.difficulty,recents);ouverte.niveau=nv.niv;if(nv.change)recents=[];
    dernier={type:e.juste?'gain':'enjeu',gain:g,etoile:false};
    if(ouverte.points>=P.JAUGE){ouverte.points=P.JAUGE;ouverte.etoile=true;ouverte.fin=e.date;dernier.etoile=true;ouverte=null;}
  }
  return {etapes,ouverte,serie,enJeu,derniere,dernier,etoiles:etapes.filter(t=>t.etoile).length};
}
// Série affichée maintenant : zéro si la dernière réponse date d'une autre séance.
const serieActuelle=(etat,now)=>etat.derniere!==null&&now-etat.derniere>P.PAUSE?0:etat.serie;

// Maîtrise d'une compétence (0 à 1) : réussite du premier coup sur les 10 dernières réponses
// (entraînement, parcours et évaluations, ancien historique compris), les plus récentes pèsent
// plus. null avec moins de 3 réponses.
function maitrise(evts,skill){
  const r=evts.filter(e=>e&&e.skill===skill&&(e.mode==='e'||e.mode==='v')).sort((a,b)=>a.date-b.date).slice(-10);
  if(r.length<3)return null;
  let s=0,t=0;r.forEach((e,i)=>{const w=Math.pow(0.8,r.length-1-i);t+=w;if(e.juste)s+=w;});
  return s/t;
}
function niveauDepart(m){return Math.min(MAXL,m===null||m<0.6?1:m<0.85?2:3);}

// L'étape suivante, choisie par le moteur :
// 1. l'étape ouverte si elle existe ;
// 2. sinon une compétence sans étoile, la plus fragile d'abord, jamais la même que la précédente ;
// 3. quand toutes ont leur étoile : une révision, sur la compétence dont l'étoile est la plus
//    ancienne (au moins un jour si possible), un niveau au-dessus.
function prochaineEtape(etat,evts,now){
  if(etat.ouverte)return {skill:etat.ouverte.skill,niveau:etat.ouverte.niveau,revision:etat.ouverte.revision,points:etat.ouverte.points};
  const skills=Object.keys(SKILLS);
  const etoile={};
  etat.etapes.forEach(t=>{if(t.etoile)etoile[t.skill]={fin:t.fin,niveau:t.niveau};});
  const prec=etat.etapes.length?etat.etapes[etat.etapes.length-1].skill:null;
  const sauf=l=>l.length>1?l.filter(k=>k!==prec):l;
  const m=k=>{const x=maitrise(evts,k);return x===null?0.5:x;};
  const sans=sauf(skills.filter(k=>!etoile[k]));
  if(sans.length){
    const k=sans.slice().sort((a,b)=>m(a)-m(b)||skills.indexOf(a)-skills.indexOf(b))[0];
    return {skill:k,niveau:niveauDepart(maitrise(evts,k)),revision:false,points:0};
  }
  const rev=sauf(skills);
  const mures=rev.filter(k=>now-etoile[k].fin>=P.JOUR);
  const k=(mures.length?mures:rev).slice().sort((a,b)=>etoile[a].fin-etoile[b].fin)[0];
  return {skill:k,niveau:Math.min(MAXL,Math.max(etoile[k].niveau+1,niveauDepart(maitrise(evts,k)))),revision:true,points:0};
}
const PARCOURS={P,fib,gainSerie,niveauApres,etatParcours,serieActuelle,maitrise,niveauDepart,prochaineEtape};

/* ---------- Parcours : affichage ---------- */
// Les lieux de la ville de la dictée ; la carte ne nomme jamais la compétence.
const LIEUX=[
  {nom:'La caserne des pompiers',ico:'<path d="M-9 8V-3L0-10L9-3V8Z"/><path d="M-4 8V1H4V8"/>'},
  {nom:"L'hôpital",ico:'<rect x="-9" y="-9" width="18" height="18" rx="3"/><path d="M0-5V5M-5 0H5"/>'},
  {nom:"L'aéroport",ico:'<path d="M0-10V9M-10 1L0-3L10 1M-4 8L0 6L4 8"/>'},
  {nom:'La grande horloge',ico:'<circle r="9"/><path d="M0-5V0L4 3"/>'},
  {nom:'Le garage',ico:'<path d="M-10 4H10V-1L6-6H-6L-10-1Z"/><circle class="plein" cx="-5" cy="6" r="2.5"/><circle class="plein" cx="5" cy="6" r="2.5"/>'},
  {nom:'Le pont',ico:'<path d="M-10 6V0Q0-10 10 0V6M-10 0H10"/>'},
  {nom:'La gare des camions',ico:'<path d="M-10 5V-5H3V5M3-1H8L10 2V5"/><circle class="plein" cx="-5" cy="6" r="2.5"/><circle class="plein" cx="6" cy="6" r="2.5"/>'},
  {nom:'Le parc',ico:'<circle r="7" cy="-3"/><path d="M0 4V10"/>'}
];
const lieu=i=>LIEUX[i%LIEUX.length];
const LECON={noms:0,mots:1,nature:2,avoir:3,etre:4};  // fiche Apprendre de chaque compétence
const svgEtoile=(cls,x,y,t)=>`<use href="#etoile" class="etoile ${cls}" x="${x}" y="${y}" width="${t}" height="${t}"/>`;

// Journal en mémoire : l'historique lu une fois au chargement, puis chaque réponse ajoutée ici
// en même temps qu'au journal de miniprof (la page marche aussi sans miniprof).
let JOURNAL=[];
function chargerJournal(){
  try{JOURNAL=window.miniprof&&window.miniprof.historique?window.miniprof.historique():[];}catch(e){JOURNAL=[];}
  if(!Array.isArray(JOURNAL))JOURNAL=[];
}
const maintenantS=()=>Math.round(Date.now()/1000);
function noter(q,ok,rep,mode){
  const e={date:maintenantS(),question:QPARCOURS+q.skill,skill:q.skill,difficulty:q.level,mode,juste:ok};
  JOURNAL.push(e);
  if(window.miniprof)window.miniprof.reponse({competence:q.skill,juste:ok,mode,difficulte:q.level,
    question:e.question,reponse:rep==null?null:rep,duree:secs(q)});
}

function carte(etat,proch){
  // les 4 dernières étapes passées, l'étape en cours, puis 2 étapes à découvrir
  const passees=etat.etapes.filter(t=>t!==etat.ouverte);
  const debut=Math.max(0,passees.length-4);
  const stops=passees.slice(debut).map((t,j)=>({i:debut+j,etat:'passee',etoile:t.etoile}));
  const cur=passees.length;
  stops.push({i:cur,etat:'cur'},{i:cur+1,etat:'futur'},{i:cur+2,etat:'futur'});
  const H=70,DY=96,W=360;
  const pos=k=>({x:k%2?W-96:96,y:H/2+20+k*DY});
  let route='';
  stops.forEach((s,k)=>{const p=pos(k);if(!k)route=`M${p.x} ${p.y}`;else{const a=pos(k-1);route+=` C${a.x} ${a.y+DY/2} ${p.x} ${p.y-DY/2} ${p.x} ${p.y}`;}});
  const h=pos(stops.length-1).y+H/2+10;
  let g=`<circle class="deco" cx="30" cy="40" r="16"/><circle class="deco" cx="${W-30}" cy="${h/2}" r="18"/><circle class="deco" cx="34" cy="${h-40}" r="14"/>`;
  g+=`<path class="route" d="${route}"/><path class="tirets" d="${route}"/>`;
  stops.forEach((s,k)=>{
    const p=pos(k),L=lieu(s.i),droite=p.x<W/2,tx=droite?p.x+38:p.x-38,anc=droite?'start':'end';
    if(s.etat==='cur')g+=`<circle class="halo" cx="${p.x}" cy="${p.y}" r="28"/>`;
    g+=`<circle class="stop ${s.etat}" cx="${p.x}" cy="${p.y}" r="28"/>`;
    if(s.etat==='futur'){g+=`<text class="sous" x="${p.x}" y="${p.y+4}" text-anchor="middle">?</text>`;return;}
    g+=`<g class="ico" transform="translate(${p.x} ${p.y})">${L.ico}</g>`;
    g+=`<text class="nom" x="${tx}" y="${p.y-4}" text-anchor="${anc}">${L.nom}</text>`;
    if(s.etat==='passee')g+=svgEtoile(s.etoile?'':'off',droite?tx:tx-18,p.y+4,18);
    else g+=`<text class="sous" x="${tx}" y="${p.y+16}" text-anchor="${anc}">${proch.revision?'révision':'étape en cours'}</text>`;
    if(s.etat==='cur')g+=`<use href="#hibou" x="${droite?p.x-80:p.x+36}" y="${p.y-26}" width="44" height="44"/>`;
  });
  return `<svg class="map" viewBox="0 0 ${W} ${h}" role="img" aria-label="Ton parcours : ${etat.etoiles} étoile${etat.etoiles>1?'s':''}">${g}</svg>`;
}
function jauge(points,serie){
  return `<div class="jauge" role="progressbar" aria-label="Jauge de l'étoile" aria-valuemin="0" aria-valuemax="${P.JAUGE}" aria-valuenow="${points}"><i style="width:${Math.round(100*points/P.JAUGE)}%"></i><svg aria-hidden="true">${svgEtoile('',0,0,30)}</svg></div>
    <p class="serie"><b>Série : ${serie}</b><span class="gain">1er coup juste : +${gainSerie(serie+1)}</span><span>${points} / ${P.JAUGE}</span></p>`;
}

// Écran principal du module : la carte.
function parcours(){
  ACCUEIL='parcours';
  const now=maintenantS(),etat=etatParcours(JOURNAL),proch=prochaineEtape(etat,JOURNAL,now);
  const n=etat.etapes.length-(etat.ouverte?1:0);
  S={screen:'parcours',etat,proch,lieu:lieu(n)};
  show(`<section class="hero"><div class="hero-in">
      <h1>Dictée 5 : Devinettes</h1>
      <p>Ton parcours dans la ville. Chaque étape te donne une étoile.</p>
      <span class="compte"><svg aria-hidden="true">${svgEtoile('',0,0,20)}</svg>${etat.etoiles} étoile${etat.etoiles>1?'s':''}</span>
    </div></section>
    <main class="wrap">
      ${carte(etat,proch)}
      <div class="card" data-etape="${proch.skill}" data-niveau="${proch.niveau}">
        <p class="small">Étape ${n+1}${proch.revision?' · révision':''}</p>
        <h2>${S.lieu.nom}</h2>
        ${jauge(proch.points,serieActuelle(etat,now))}
        <div class="btns"><button class="btn primary" data-act="pGo" data-primary>${proch.points?'Continuer':'Commencer'}</button>
          <button class="btn" data-act="pLecon">Revoir la leçon</button></div>
      </div>
      <button class="lien-discret" data-act="home">Autres exercices</button>
    </main>`);
}

// Une question du parcours. Évite de reposer tout de suite la même question.
function pNouvelle(){
  const pr=S.proch;let q,n=0;
  do{q=GEN[pr.skill](pr.niveau);n++;}while(S.derniere&&q.prompt===S.derniere&&n<10);
  S.screen='pq';S.derniere=q.prompt;S.q=q;S.choice=null;S.attempts=0;S.retry=false;S.chance=false;
  const now=maintenantS(),etat=etatParcours(JOURNAL);
  show(`${topbar(S.lieu.nom,'parcours')}<main class="wrap qwrap">
    <div id="pj">${jauge(pr.points,serieActuelle(etat,now))}</div>
    <div class="card"><div class="q-prompt">${q.prompt}</div>
      ${q.write
        ?`<div class="write"><input id="rep" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="Ta réponse" placeholder="Écris ta réponse"></div>`
        :`<div class="choices">${q.choices.map(c=>`<button class="choice" data-act="choose" data-v="${esc(c.v)}">${c.label}</button>`).join('')}</div>`}</div>
    <div id="hint"></div><div id="fb"></div>
    <div class="btns"><span id="acts" class="acts"><button class="btn primary" id="ok" data-act="pCheck" data-primary hidden>Valider</button></span></div>
    <div class="sigbar"><div id="sig"></div><button class="btn sigbtn" data-act="sig">⚑ Une erreur ?</button></div></main>`);
  q.t0=Date.now();
  // curseur dans le champ (clavier ouvert) pour une question à écrire ; sinon on libère le relais
  const champ=document.getElementById('rep');
  if(champ)champ.focus();
  retirerRelais();
}
function pCheck(){
  const q=S.q;let v=null;
  if(q.write){S.choice=lireEcrit();if(!norm(S.choice))return;v=judgeWrite(q,S.choice);}
  else if(!S.choice)return;
  S.attempts++;
  const ok=v?v.ok:S.choice===q.exp.c,premier=S.attempts===1;
  const serieAvant=serieActuelle(etatParcours(JOURNAL),maintenantS());
  noter(q,ok,S.choice,premier?'e':'r');
  const now=maintenantS(),etat=etatParcours(JOURNAL),d=etat.dernier||{};
  // jauge de l'étape (fermée si l'étoile vient d'être gagnée)
  const pts=d.etoile?P.JAUGE:(etat.ouverte?etat.ouverte.points:0);
  if(etat.ouverte){S.proch.points=etat.ouverte.points;S.proch.niveau=etat.ouverte.niveau;}
  document.getElementById('pj').innerHTML=jauge(pts,serieActuelle(etat,now));
  const acts=document.getElementById('acts');
  if(premier&&ok){
    lockChoices();
    // juste : bref message, puis la question suivante arrive seule (retour du sponsor, 13/10/2026)
    setFb(`<div class="fb good"><p><b>Du premier coup ! +${d.gain}</b> Ta série passe à ${etat.serie}.</p></div>`);
    enchainer(d.etoile);return;
  }else if(premier){
    // la série est en jeu : l'enjeu, puis l'indice de Mini, puis la deuxième chance
    const why=v?v.why:((q.choices.find(c=>c.v===S.choice)||{}).why||'');
    if(!v)app.querySelectorAll('.choice').forEach(b=>{if(b.dataset.v===S.choice){b.classList.remove('sel');b.classList.add('bad');b.disabled=true;}});
    else{const i=document.getElementById('rep');i.classList.add('bad');}
    S.choice=null;
    setFb(`<div class="fb bad"><p><b>${serieAvant>0?`Ta série de ${serieAvant} est en jeu !`:'Pas tout à fait.'}</b> ${why}</p></div>
      <div class="guide"><svg aria-hidden="true"><use href="#hibou"/></svg><div class="bulle"><p><b>L'indice de Mini :</b></p>${q.hint}</div></div>`);
    acts.innerHTML='';
    S.chance=true;
    ouvrirIndice(serieAvant>0?`Ta série de ${serieAvant} est en jeu !`:'Pas tout à fait.',why,q.hint);
    return;
  }else if(ok){
    lockChoices();
    setFb(`<div class="fb good"><p><b>${serieAvant>0?`Série sauvée ! Ta série de ${serieAvant} continue.`:'Bien corrigé !'}</b> La deuxième chance ne remplit pas la jauge.</p></div>`);
    enchainer(d.etoile);return;
  }else{
    lockChoices();
    setFb(`<div class="fb info"><p><b>La bonne réponse : ${esc(q.exp.c)}</b>${serieAvant>0?` Ta série de ${serieAvant} repart de zéro. Ce n'est rien : on recommence.`:''}</p>${q.explain}</div>`);
  }
  if(d.etoile){
    acts.innerHTML='<button class="btn primary" data-act="pEtoile" data-primary>Voir mon étoile</button>';
  }else acts.innerHTML='<button class="btn primary" data-act="pSuivante" data-primary>Question suivante</button>';
}
// Après une réponse juste : message d'une seconde, puis question suivante (ou écran de l'étoile).
// Pourquoi un champ « relais » : sur iPhone, le clavier ne s'ouvre que dans le geste de l'enfant (le
// toucher sur Valider). On y donne le focus à un champ invisible, qui garde le clavier ouvert
// pendant la seconde d'attente ; pNouvelle passe ensuite le focus au vrai champ de réponse.
function enchainer(etoile){
  let r=document.getElementById('relais');
  if(!r){
    r=document.createElement('input');r.id='relais';r.tabIndex=-1;r.setAttribute('aria-hidden','true');
    r.style.cssText='position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(r);
  }
  r.focus();
  document.getElementById('acts').innerHTML='';
  const q=S.q;
  // si l'enfant a quitté l'écran entre-temps (flèche retour), on ne fait rien
  setTimeout(()=>{if(S.q===q&&S.screen==='pq'){if(etoile)pEtoile();else pNouvelle();}else retirerRelais();},1000);
}
function retirerRelais(){const r=document.getElementById('relais');if(r)r.remove();}
// L'indice en plein écran après une erreur (retour du sponsor, 13/10/2026 : l'indice posé sous la
// question n'était pas lu). La couche cache la question ; « Ma deuxième chance » ne s'allume qu'après
// un court délai, le temps de lire (3 s, plus 0,03 s par caractère, au plus 6 s). Ce délai n'est pas
// un chrono sur la réponse. Le clavier est fermé pour ne pas masquer le texte.
const DELAI_INDICE_MIN=3,DELAI_INDICE_MAX=6,DELAI_INDICE_PAR_CAR=0.03;
function ouvrirIndice(titre,why,indice){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const duree=Math.min(DELAI_INDICE_MAX,Math.max(DELAI_INDICE_MIN,DELAI_INDICE_MIN+DELAI_INDICE_PAR_CAR*(txt(why).length+txt(indice).length)));
  const fin=Date.now()+duree*1000;
  const o=document.createElement('div');
  o.id='indice';o.className='indice';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-labelledby','indice-t');
  o.innerHTML=`<div class="indice-in">
    <div class="guide"><svg aria-hidden="true"><use href="#hibou"/></svg><h2 id="indice-t">${titre}</h2></div>
    ${why?`<p>${why}</p>`:''}
    <div class="bulle"><p><b>L'indice de Mini :</b></p>${indice}</div>
    <button class="btn primary" id="indice-ok" data-act="pChance" data-primary disabled></button></div>`;
  app.appendChild(o);
  const b=document.getElementById('indice-ok');
  const tic=()=>{
    // la couche disparaît avec l'écran (show) : plus rien à mettre à jour
    if(!document.body.contains(b)){clearInterval(minuteur);return;}
    const reste=Math.ceil((fin-Date.now())/1000);
    if(reste>0)b.textContent=`Je lis l'indice… ${reste}`;
    else{clearInterval(minuteur);b.disabled=false;b.textContent='Ma deuxième chance';}
  };
  const minuteur=setInterval(tic,250);tic();
}
// Deuxième chance : le champ se vide, l'indice reste affiché pendant qu'on réécrit. Elle ne s'ouvre
// que par le bouton de la couche d'indice : la déclencher pendant la frappe (toucher le champ)
// faisait perdre les premières lettres sur l'iPhone (export du 13/10/2026).
function pChance(){
  if(!S.chance)return;
  S.chance=false;
  const couche=document.getElementById('indice');if(couche)couche.remove();
  const i=document.getElementById('rep');
  if(i){i.value='';i.classList.remove('bad');if(document.activeElement!==i)i.focus();}
  document.getElementById('acts').innerHTML='<button class="btn primary" id="ok" data-act="pCheck" data-primary hidden>Valider</button>';
  majValider();
}
function pEtoile(){
  retirerRelais();
  const etat=etatParcours(JOURNAL);
  show(`${topbar(S.lieu.nom,'parcours')}<main class="wrap">
    <div class="card gagne"><svg aria-hidden="true">${svgEtoile('',0,0,84)}</svg>
      <h2>Étoile gagnée !</h2><p>Tu as rempli la jauge de l'étape « ${S.lieu.nom} ».</p>
      <p class="small">Tu as ${etat.etoiles} étoile${etat.etoiles>1?'s':''} sur ton parcours.</p></div>
    <div class="btns"><button class="btn primary" data-act="parcours" data-primary>Continuer le parcours</button></div></main>`);
}

/* ================= MOTEUR : bilan (celui de miniprof) ================= */
function bilan(){
  const m=window.miniprof;
  if(m)location.href=m.racine+'#/module/'+encodeURIComponent(m.module)+'/bilan';
}

/* ================= MOTEUR : actions ================= */
// Ajouter ici les actions propres au module (ex. un labo) avant « default ».
function act(a,el){
  switch(a){
    case 'home':home();break;
    case 'parcours':parcours();break;
    case 'pGo':pNouvelle();break;
    case 'pLecon':learn(LECON[S.proch.skill]||0);break;
    case 'pCheck':pCheck();break;
    case 'pChance':pChance();break;
    case 'pSuivante':pNouvelle();break;
    case 'pEtoile':pEtoile();break;
    case 'learn':learn(0);break;
    case 'lchoose':learnChoose(el);break;
    case 'lnext':if(S.ls<LEARN.length-1){S.ls++;renderLearn();}break;
    case 'trainSetup':trainSetup(false);break;
    case 'lvl':S.level=Number(el.dataset.v);if(S.screen==='trainSetup')trainSetup(true);else evalSetup(true);break;
    case 'sk':S.skill=el.dataset.v;S.skillPref=S.skill;trainSetup(true);break;
    case 'trainStart':S={screen:'train',mode:'train',level:S.level,skill:S.skill,skillPref:S.skill,tried:0,okCount:0,streak:0};nextTrain();break;
    case 'trainWeak':S={screen:'train',mode:'train',level:1,skill:S.weakest,skillPref:S.weakest,tried:0,okCount:0,streak:0};nextTrain();break;
    case 'levelup':S.level=Math.min(S.level+1,MAXL);S.streak=0;nextTrain();break;
    case 'evalSetup':evalSetup(false);break;
    case 'evalStart':evalStart();break;
    case 'quitEval':evalSetup(false);break;
    case 'choose':S.choice=el.dataset.v;app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c===el));surProposition();break;
    case 'retry':reessayer();break;
    case 'check':S.mode==='eval'?checkEval():checkTrain();break;
    case 'hint':document.getElementById('hint').innerHTML=`<div class="fb hint"><p><b>Indice</b></p>${S.q.hint}</div>`;break;
    case 'reveal':revealTrain();break;
    case 'sig':sigAsk();break;
    case 'signo':document.getElementById('sig').innerHTML='';break;
    case 'sigyes':sigYes();break;
    case 'sigsend':sigSend(el);break;
    case 'next':nextTrain();break;
    case 'bilan':bilan();break;
    default:break;
  }
}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t);});
// un mot tapé = une proposition : « Valider » apparaît
app.addEventListener('input',e=>{if(e.target.id==='rep')surProposition();});
// Après une erreur, toucher le champ ou y taper efface l'ancien mot, comme « Réessayer » (P010, retour du 12/10).
const effacerSiReessai=e=>{if(S.retry&&e.target.id==='rep')reessayer();};
app.addEventListener('pointerdown',effacerSiReessai);
app.addEventListener('focusin',effacerSiReessai);
app.addEventListener('beforeinput',effacerSiReessai);
// touche Entrée (« OK » du clavier de l'iPhone) dans le champ de réponse = bouton principal
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rep'){e.preventDefault();const b=app.querySelector('[data-primary]');if(b&&!b.hidden)b.click();}});

// Tirage automatique (tools/tirage.py) : la page donne ses générateurs au lieu de s'afficher.
// window.__miniprofTirage n'existe que dans l'outil, jamais dans un navigateur.
// PARCOURS : les calculs purs du parcours, testés par tools/tests/test_parcours.py.
if(window.__miniprofTirage){window.__miniprofTirage({GEN,LEVELS,LEARN,SKILLS,EVAL_SKILLS,PARCOURS});return;}
// Le parcours s'ouvre une fois miniprof chargé (suivi.js est un module, exécuté après ce script).
function demarrer(){chargerJournal();parcours();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',demarrer);else demarrer();

})();
