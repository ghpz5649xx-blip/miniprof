<style>

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0}

.rulebox{border:2px dashed var(--pitch);border-radius:16px;padding:12px 16px;background:var(--surface);margin:14px 0}

/* pastilles de couleur : les couleurs sont fixes (ce sont les réponses), le bord suit le thème */
.sw{display:inline-block;vertical-align:middle}

.dots{display:flex;gap:6px;margin-bottom:6px}

.bar i{display:block;height:100%;background:var(--pitch)}
.bar i.low{background:var(--bad)}.bar i.mid{background:var(--c3)}
details.rev{border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:8px 0;background:var(--surface)}

.ans{font-weight:800;border-radius:12px;padding:6px 10px;background:var(--bg)}
.ans.good{background:var(--soft-good)}
</style>

<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ================= utilitaires ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[R(0,arr.length-1)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
// n éléments distincts de la liste, sans celui à exclure
function others(list,not,n){return shuffle(list.filter(x=>x!==not)).slice(0,n);}
const en=s=>`<span class="en">${s}</span>`;

/* ================= vocabulaire de la leçon (manuel p. 20-21 et cahier) ================= */
// Couleurs : la bande du manuel, plus « grey » du cahier (This is a grey rabbit).
// fr : masculin, ff : féminin (pour traduire « une voiture grise »).
const COL={
  blue:{fr:'bleu',ff:'bleue',hex:'#2a6fd6'},
  green:{fr:'vert',ff:'verte',hex:'#2e9e44'},
  pink:{fr:'rose',ff:'rose',hex:'#f27bb5'},
  red:{fr:'rouge',ff:'rouge',hex:'#d62828'},
  purple:{fr:'violet',ff:'violette',hex:'#7b3fb0'},
  orange:{fr:'orange',ff:'orange',hex:'#f08a24'},
  brown:{fr:'marron',ff:'marron',hex:'#7a4a21'},
  yellow:{fr:'jaune',ff:'jaune',hex:'#f5d000'},
  black:{fr:'noir',ff:'noire',hex:'#151515'},
  white:{fr:'blanc',ff:'blanche',hex:'#ffffff'},
  grey:{fr:'gris',ff:'grise',hex:'#8a8a8a'}
};
const COLS=Object.keys(COL);
// Animaux des deux affiches (Zootopia, The Jungle Book), plus le chien de « Royal pet ».
// fr : nom avec article français ; f : féminin en français ; cols : couleurs vraisemblables.
const ANI={
  rabbit:{fr:'lapin',cols:['grey','white','brown']},
  fox:{fr:'renard',cols:['orange','red']},
  sloth:{fr:'paresseux',cols:['brown','grey']},
  buffalo:{fr:'buffle',cols:['black','brown','blue']},
  tiger:{fr:'tigre',cols:['orange']},
  bear:{fr:'ours',cols:['brown','black']},
  panther:{fr:'panthère',f:true,cols:['black']},
  snake:{fr:'serpent',cols:['green','yellow','brown']},
  wolf:{fr:'loup',cols:['grey','white']},
  dog:{fr:'chien',cols:['black','brown','white']},
  orangutan:{fr:'orang-outan',cols:['orange','brown']}
};
const ANIS=Object.keys(ANI);
const frArt=a=>ANI[a].f?'une':'un';
// Objets du cahier (a car, a bike, an umbrella).
const OBJ={
  car:{fr:'voiture',f:true},
  bike:{fr:'vélo'},
  umbrella:{fr:'parapluie'}
};
// a ou an : on regarde le SON du début du mot qui suit. Tous les mots de la page qui
// commencent par une voyelle se prononcent avec un son voyelle (pas de « hour », « uniform »).
const VOW=w=>/^[aeiou]/i.test(w);
const art=w=>VOW(w)?'an':'a';
// Fautes d'orthographe écrites à la main (pas générées) : aucune n'est un vrai mot anglais.
const MIS={
  blue:['blu','bleu','bloo'],green:['grean','grenn','griin'],pink:['pinc','pinck','pinke'],
  red:['redd','rred','rade'],purple:['purpel','pourple','purpple'],orange:['oronge','orenge','orrange'],
  brown:['braun','browne','broun'],yellow:['yelow','yellou','jellow'],black:['blak','blac','blacke'],
  white:['wite','whit','whyte'],grey:['grei','grai','greye'],
  tiger:['tigre','tigger','tyger'],rabbit:['rabit','rabbitt','rabet'],fox:['foxe','focks','foks'],
  bear:['bere','baer','bearr'],sloth:['slothe','sloht','slooth'],buffalo:['bufalo','buffallo','bufallo'],
  snake:['snak','snacke','snaike'],panther:['panter','panthere','pantther'],wolf:['wolff','woulf','wulf'],
  dog:['dogg','dogue','dogh'],umbrella:['umbrela','ombrella','umbrrella']
};
// Prononciation des lettres anglaises qui piègent les francophones (approximation à la française).
const LET={A:'eï',E:'i',I:'aï',G:'dji',J:'djeï',R:'ar',Y:'ouaï',H:'eïtch',U:'you',W:'double-you'};
const spell=w=>w.toUpperCase().split('').join('-');

function swatch(c,size){
  const s=size||34;
  return `<svg class="sw" width="${s}" height="${s}" viewBox="0 0 40 40" role="img" aria-label="pastille de couleur"><circle cx="20" cy="20" r="17" fill="${COL[c].hex}"/></svg>`;
}

/* ================= banque de questions ================= */
const SKILLS={
  couleurs:{label:'Les couleurs'},
  animaux:{label:'Les animaux'},
  'a-an':{label:'Choisir a ou an'},
  decrire:{label:'Décrire un animal'},
  epeler:{label:'Épeler un mot'},
  pronoms:{label:'He, she ou it'}
};
const LEVELS={1:{t:'Échauffement',d:'questions de base'},2:{t:'Défi',d:'questions plus piégeuses'}};
function Q(skill,level,prompt,choices,correct,hint,explain){
  return {skill,level,prompt,choices:shuffle(choices.slice()),exp:{c:correct},hint,explain};
}
const C=(v,label,why)=>({v,label,why:why||''});

function genCouleurs(level){
  const c=pick(COLS);
  if(level===1){
    if(Math.random()<.5){
      return Q('couleurs',level,`What colour is it?<div class="center">${swatch(c,70)}</div>`,
        [c].concat(others(COLS,c,3)).map(v=>C(v,v,`${en(v)}, c'est ${COL[v].fr}. Regarde bien la pastille.`)),c,
        `<p>En français, cette couleur se dit « ${COL[c].fr} ».</p>`,
        `<p>${en(c)} = ${COL[c].fr}.</p>`);
    }
    return Q('couleurs',level,`Quelle pastille est ${en(c)} ?`,
      [c].concat(others(COLS,c,3)).map(v=>C(v,swatch(v,54),`Cette pastille est ${en(v)} (${COL[v].fr}).`)),c,
      `<p>${en(c)}, en français, c'est « ${COL[c].fr} ».</p>`,
      `<p>${en(c)} = ${COL[c].fr}.</p><div class="center">${swatch(c,54)}</div>`);
  }
  // Défi : retrouver le mot bien écrit parmi des fautes fréquentes
  return Q('couleurs',level,`Comment écrit-on <b>${COL[c].fr}</b> en anglais ?`,
    [C(c,c)].concat(MIS[c].map(m=>C(m,m,`Presque ! Mais ${en(c)} s'écrit ${spell(c)}.`))),c,
    `<p>Pense à la bande des couleurs du manuel. Le mot a ${c.length} lettres.</p>`,
    `<p>${COL[c].fr} = ${en(c)}, qui s'épelle <b>${spell(c)}</b>.</p>`);
}

function genAnimaux(level){
  const a=pick(ANIS);
  if(level===1){
    if(Math.random()<.5){
      return Q('animaux',level,`Comment dit-on <b>${frArt(a)} ${ANI[a].fr}</b> en anglais ?`,
        [a].concat(others(ANIS,a,3)).map(v=>C(v,`${art(v)} ${v}`,`${en(art(v)+' '+v)}, c'est ${frArt(v)} ${ANI[v].fr}.`)),a,
        `<p>Repense aux deux affiches : Zootopia et The Jungle Book.</p>`,
        `<p>${frArt(a)} ${ANI[a].fr} = ${en(art(a)+' '+a)}.</p>`);
    }
    return Q('animaux',level,`Que veut dire <b>${art(a)} ${a}</b> ?`,
      [a].concat(others(ANIS,a,3)).map(v=>C(v,`${frArt(v)} ${ANI[v].fr}`,`${frArt(v)} ${ANI[v].fr}, c'est ${en(art(v)+' '+v)} en anglais.`)),a,
      `<p>Repense aux deux affiches : Zootopia et The Jungle Book.</p>`,
      `<p>${en(art(a)+' '+a)} = ${frArt(a)} ${ANI[a].fr}.</p>`);
  }
  // Défi : l'intrus (une couleur au milieu des animaux, ou l'inverse)
  if(Math.random()<.5){
    const odd=pick(COLS);const set=others(ANIS,null,3);
    return Q('animaux',level,`Lequel de ces mots n'est <b>pas</b> un animal ?`,
      [C(odd,odd)].concat(set.map(v=>C(v,v,`${en(v)} est bien un animal : ${frArt(v)} ${ANI[v].fr}.`))),odd,
      `<p>Il y a une couleur cachée parmi les animaux.</p>`,
      `<p>${en(odd)} n'est pas un animal : c'est une couleur (${COL[odd].fr}). Les autres : ${set.map(v=>`${en(v)} = ${ANI[v].fr}`).join(', ')}.</p>`);
  }
  const odd=pick(ANIS);const set=others(COLS,null,3);
  return Q('animaux',level,`Lequel de ces mots n'est <b>pas</b> une couleur ?`,
    [C(odd,odd)].concat(set.map(v=>C(v,v,`${en(v)} est bien une couleur : ${COL[v].fr}.`))),odd,
    `<p>Il y a un animal caché parmi les couleurs.</p>`,
    `<p>${en(odd)} n'est pas une couleur : c'est un animal (${frArt(odd)} ${ANI[odd].fr}). Les autres : ${set.map(v=>`${en(v)} = ${COL[v].fr}`).join(', ')}.</p>`);
}

// a / an : la page montre toujours la MÊME méthode (mot juste après → première lettre → a ou an),
// et souligne la première lettre, parce que c'est l'étape que l'enfant saute.
const hl=w=>`<span class="en"><span class="l1">${w[0]}</span>${w.slice(1)}</span>`;
function whyArt(next){
  return VOW(next)
    ?`Le mot juste après, c'est ${hl(next)}. Il commence par <b>${next[0]}</b>, une voyelle : on met ${en('an')}.`
    :`Le mot juste après, c'est ${hl(next)}. Il commence par <b>${next[0]}</b>, une consonne : on met ${en('a')}.`;
}
const METHOD=`<ol class="steps"><li>Trouve le mot <b>juste après</b> le trou.</li><li>Regarde sa <b>première lettre</b>.</li><li><span class="voy">a</span><span class="voy">e</span><span class="voy">i</span><span class="voy">o</span><span class="voy">u</span> → ${en('an')}. Sinon → ${en('a')}.</li></ol>`;
// Mots de la leçon, rangés selon leur première lettre
const AAN_VOW=['umbrella','orangutan','animal','orange','English'];
const AAN_CONS=ANIS.filter(w=>!VOW(w)).concat(['car','bike','big','small','grey','brown']);
// Un groupe « ___ mots » : seul (a fox) ou avec le piège de l'adjectif (an orange fox, a big umbrella)
function aanGroup(trap){
  if(!trap){const w=pick(Math.random()<.5?['umbrella','orangutan','animal']:AAN_CONS.filter(x=>ANI[x]||OBJ[x]));return {first:w,words:w};}
  // moitié : nom à voyelle mais adjectif à consonne ; moitié : nom à consonne mais adjectif à voyelle
  if(Math.random()<.5){const n=pick(['umbrella','orangutan','animal']);
    const f=n==='orangutan'?pick(['big','small','brown']):pick(['big','small']);return {first:f,words:f+' '+n};}
  const n=pick(['fox','tiger','car','bike']);const f=OBJ[n]?pick(['orange','English']):'orange';return {first:f,words:f+' '+n};
}
function aanFill(level,g){
  const ok=art(g.first),no=ok==='a'?'an':'a';
  const frame=Math.random()<.5?['','']:pick([['This is ','.'],['I can see ','.']]);
  return Q('a-an',level,`Complète : <span class="big">${frame[0]}___ ${g.words}${frame[1]}</span>`,
    [C(ok,ok),C(no,no,whyArt(g.first))],ok,
    `<p>Le mot juste après le trou, c'est ${en(g.first)}.</p>${METHOD}`,
    `<p><b>${frame[0]}${ok} ${g.words}${frame[1]}</b></p><p>${whyArt(g.first)}</p>`);
}
function genAAn(level){
  const r=Math.random();
  if(level===1){
    if(r<.7)return aanFill(level,aanGroup(false));
    // quel mot va avec a / an ? (trier les mots selon leur première lettre)
    const k=pick(['a','an']),good=pick(k==='an'?AAN_VOW:AAN_CONS),bad=others(k==='an'?AAN_CONS:AAN_VOW,null,3);
    return Q('a-an',level,`Quel mot peut aller juste après <span class="big">${k}</span> ?`,
      [C(good,good)].concat(bad.map(w=>C(w,w,whyArt(w)))),good,
      METHOD,`<p><b>${k} ${good}</b>. ${whyArt(good)}</p>`);
  }
  if(r<.55)return aanFill(level,aanGroup(true));
  if(r<.75){
    // quel mot décide ? (l'étape 1 de la méthode, là où on se trompe avec un adjectif)
    const g=aanGroup(true),noun=g.words.split(' ')[1];
    return Q('a-an',level,`Dans <span class="big">___ ${g.words}</span>, quel mot décide entre a et an ?`,
      [C('adj',g.first),C('nom',noun,`Non : ${en(noun)} n'est pas juste après le trou. C'est ${en(g.first)} qui est juste après.`)],'adj',
      `<p>Le mot qui décide est celui qui est <b>collé</b> au trou.</p>`,
      `<p>C'est ${hl(g.first)}, le mot juste après le trou. Donc <b>${art(g.first)} ${g.words}</b>.</p>`);
  }
  // trouve l'erreur : 3 groupes justes, 1 faux (souvent un piège)
  const gs=[];while(gs.length<4){const g=aanGroup(Math.random()<.6);if(!gs.some(x=>x.words===g.words))gs.push(g);}
  const wrong=gs[0];
  const lab=(g,bad)=>{const a=art(g.first);return `${bad?(a==='a'?'an':'a'):a} ${g.words}`;};
  return Q('a-an',level,`Une seule de ces réponses a une <b>erreur</b>. Laquelle ?`,
    gs.map((g,i)=>C('g'+i,lab(g,i===0),i===0?'':`${lab(g,false)} est juste. ${whyArt(g.first)}`)),'g0',
    `<p>Pour chaque réponse, applique la méthode :</p>${METHOD}`,
    `<p>L'erreur : <b>${lab(wrong,true)}</b>. Il faut dire <b>${lab(wrong,false)}</b>.</p><p>${whyArt(wrong.first)}</p>`);
}

// Groupe nominal anglais et sa traduction française (adjectif avant le nom en anglais)
function frGroup(noun,f,adj){
  const a=f?'une':'un';
  if(adj==='small')return `${a} ${f?'petite':'petit'} ${noun}`;
  if(adj==='big')return `${a} ${f?'grande':'grand'} ${noun}`;
  if(adj==='English')return `${a} ${noun} ${f?'anglaise':'anglais'}`;
  return `${a} ${noun} ${f?COL[adj].ff:COL[adj].fr}`;
}
function genDecrire(level){
  if(level===1){
    // phrase de la leçon : This is a grey rabbit. / I can see a ...
    const a=pick(ANIS),c=pick(ANI[a].cols),k=art(c),no=k==='a'?'an':'a';
    const see=Math.random()<.4;
    const st=see?'I can see':'This is',fr=(see?'Je vois ':"C'est ")+frGroup(ANI[a].fr,ANI[a].f,c);
    const good=`${st} ${k} ${c} ${a}.`;
    return Q('decrire',level,`Comment dit-on : <b>« ${fr}. »</b>`,
      [C('ok',good),
       C('ordre',`${st} ${art(a)} ${a} ${c}.`,"En anglais, la couleur se met <b>avant</b> l'animal : a grey rabbit."),
       C('art',`${st} ${no} ${c} ${a}.`,whyArt(c)),
       C('is',see?`I see can ${k} ${c} ${a}.`:`This ${k} ${c} ${a}.`,see?"On dit « I can see » : can avant see.":"Il manque le verbe : This <b>is</b> a… (c'est = this is).")],'ok',
      `<p>Modèle du cahier : ${en('This is a grey rabbit.')} La couleur va avant l'animal.</p>`,
      `<p><b>${good}</b> La couleur (${en(c)}) se met avant l'animal. ${whyArt(c)}</p>`);
  }
  // Défi : traduire un groupe du cahier (un petit vélo, une voiture anglaise, un renard orange)
  let noun,fr,f,adj;
  if(Math.random()<.5){
    noun=pick(Object.keys(OBJ));fr=OBJ[noun].fr;f=!!OBJ[noun].f;adj=pick(['small','big','English'].concat(COLS));
  }else{
    noun=pick(ANIS);fr=ANI[noun].fr;f=!!ANI[noun].f;adj=pick(['small','big'].concat(ANI[noun].cols));
  }
  const k=art(adj),no=k==='a'?'an':'a',kn=art(noun),non=kn==='a'?'an':'a';
  const good=`${k} ${adj} ${noun}`;
  return Q('decrire',level,`Traduis : <b>« ${frGroup(fr,f,adj)} »</b>`,
    [C('ok',good),
     C('art',`${no} ${adj} ${noun}`,whyArt(adj)),
     C('ordre',`${kn} ${noun} ${adj}`,"En anglais, l'adjectif se met <b>avant</b> le nom, même pour la couleur."),
     C('deux',`${non} ${noun} ${adj}`,"Deux erreurs : l'adjectif va avant le nom, et l'article dépend du mot qui suit.")],'ok',
    `<p>L'adjectif va avant le nom. Puis regarde le mot juste après l'article : a ou an ?</p>`,
    `<p><b>${good}</b> : l'adjectif ${en(adj)} se met avant le nom. ${whyArt(adj)}</p>`);
}

function genEpeler(level){
  if(level===1){
    if(Math.random()<.5){
      const l=pick(Object.keys(LET));
      return Q('epeler',level,`Quelle lettre anglaise se prononce <b>[${LET[l]}]</b> ?`,
        [l].concat(others(Object.keys(LET),l,3)).map(v=>C(v,v,`La lettre ${v} se prononce [${LET[v]}].`)),l,
        `<p>Chante l'alphabet anglais dans ta tête : A [eï], B [bi], C [si]…</p>`,
        `<p>La lettre <b>${l}</b> se prononce [${LET[l]}] en anglais.</p>`);
    }
    const w=pick(Object.keys(MIS));
    const set=[w].concat(others(Object.keys(MIS),w,3));
    return Q('epeler',level,`Quel mot est épelé ?<div class="center big">${spell(w)}</div>`,
      set.map(v=>C(v,v,`${en(v)} s'épelle ${spell(v)}.`)),w,
      `<p>Assemble les lettres une par une.</p>`,
      `<p>${spell(w)} = ${en(w)}.</p>`);
  }
  // Défi : la bonne orthographe, lettre par lettre (comme T-I-G-E-R dans le manuel)
  const w=pick(Object.keys(MIS));
  const fr=COL[w]?COL[w].fr:ANI[w]?`${frArt(w)} ${ANI[w].fr}`:'un parapluie';
  return Q('epeler',level,`Comment épelle-t-on <b>${fr}</b> en anglais ?`,
    [C(w,spell(w))].concat(MIS[w].map(m=>C(m,spell(m),`Ça s'épelle ${spell(w)}.`))),w,
    `<p>Le mot anglais a ${w.length} lettres.</p>`,
    `<p>${fr} = ${en(w)}, qui s'épelle <b>${spell(w)}</b>.</p>`);
}

// He, she, it : it pour les animaux sauvages, he ou she pour les animaux de compagnie.
// Noms d'animaux inventés (aucun prénom réel).
const PETS=[{n:'Biscuit',g:'m'},{n:'Pepper',g:'f'},{n:'Snowy',g:'f'},{n:'Rocky',g:'m'},{n:'Coco',g:'f'},{n:'Ziggy',g:'m'}];
const WILD=['tiger','fox','wolf','snake','bear','panther','sloth','buffalo','orangutan'];
function genPronoms(level){
  const ADJ=['cute','friendly'];
  let pet=Math.random()<.55,prompt,ok,why;
  // Défi : le même animal peut être sauvage ou de compagnie (un lapin dans la forêt / mon lapin)
  if(level===2&&Math.random()<.6){
    const a='rabbit';
    if(pet){const p=pick(PETS);ok=p.g==='f'?'She':'He';
      prompt=`This is my rabbit, ${p.n} (${p.g==='f'?'une femelle':'un mâle'}). ___ is ${pick(ANI[a].cols)} and ${pick(ADJ)}.`;}
    else{ok='It';prompt=`I can see a rabbit in the forest. ___ is ${pick(ANI[a].cols)}.`;}
  }else if(pet){
    const p=pick(PETS),k=pick(['dog','rabbit']);ok=p.g==='f'?'She':'He';
    prompt=`This is my ${k}, ${p.n} (${p.g==='f'?'une femelle':'un mâle'}). ___ is ${pick(['black','brown','white'])} and ${pick(ADJ)}.`;
  }else{
    const a=pick(WILD);ok='It';
    prompt=`Look at the ${a}. ___ is ${pick(ANI[a].cols)}.`;
  }
  why=ok==='It'?"C'est un animal sauvage : on utilise <b>it</b>."
    :`C'est un animal de compagnie ${ok==='She'?'femelle : <b>she</b>':'mâle : <b>he</b>'}.`;
  const wrong={He:"<b>he</b>, c'est pour un animal de compagnie mâle.",She:"<b>she</b>, c'est pour un animal de compagnie femelle.",It:"<b>it</b>, c'est pour un animal sauvage."};
  return Q('pronoms',level,`Complète : <b>${prompt}</b>`,
    ['He','She','It'].map(v=>C(v,v,v===ok?'':wrong[v]+' '+why)),ok,
    `<p>Animal sauvage ou animal de compagnie ? Et si c'est un animal de compagnie : mâle ou femelle ?</p>`,
    `<p><b>${ok}</b>. ${why}</p>`);
}

const GEN={couleurs:genCouleurs,animaux:genAnimaux,'a-an':genAAn,decrire:genDecrire,epeler:genEpeler,pronoms:genPronoms};
function genQuestion(skill,level){
  if(!skill||skill==='all')skill=pick(Object.keys(GEN));
  return GEN[skill](level);
}

      ${ev?'':'<button class="btn ghost" data-act="hint">Un indice</button>'}
    </div></main>`);
  S.choice=null;S.attempts=0;q.t0=Date.now();
}
function setFb(html){document.getElementById('fb').innerHTML=html;}
function lockChoices(){
  app.querySelectorAll('.choice').forEach(c=>{c.classList.add('locked');c.disabled=true;
    if(c.dataset.v===S.q.exp.c)c.classList.add('good');else if(c.dataset.v===S.choice)c.classList.add('bad');});
}
function checkTrain(){
  if(!S.choice){setFb('<div class="fb hint">Choisis une réponse.</div>');return;}
  const q=S.q;S.attempts++;
  const ok=S.choice===q.exp.c;
  // seul le premier essai compte dans le journal (sinon cliquer au hasard gonfle la réussite)
  if(S.attempts===1){S.tried++;if(ok){S.okCount++;S.streak++;}else S.streak=0;record(q,ok,S.choice);}
  if(ok){
    lockChoices();
    let extra='';
    if(S.streak>=5&&S.level<2)extra=`<p>${S.streak} réussites d'affilée : tu peux passer au niveau Défi.</p>`;
    setFb(`<div class="fb good"><p><b>${pick(CHEER)}</b>${S.attempts>1?' Tu as trouvé au deuxième essai.':''}</p>${q.explain}${extra}</div>`);
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>${extra?'<button class="btn" data-act="levelup">Niveau Défi</button>':''}`;
  }else if(S.attempts===1){
    const c=q.choices.find(c=>c.v===S.choice);
    setFb(`<div class="fb bad"><p><b>Pas tout à fait.</b> ${c&&c.why?c.why:'Relis la question et réessaie.'}</p></div>`);
    app.querySelectorAll('.choice').forEach(b=>{if(b.dataset.v===S.choice){b.classList.remove('sel');b.classList.add('bad');b.disabled=true;}});
    S.choice=null;
    document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="check" data-primary>Réessayer</button><button class="btn ghost" data-act="hint">Un indice</button><button class="btn ghost" data-act="reveal">Voir la correction</button>`;
  }else revealTrain();
}
function revealTrain(){
  if(S.attempts===0){S.attempts=1;S.tried++;S.streak=0;record(S.q,false,null);}
  lockChoices();
  setFb(`<div class="fb info"><p><b>Correction</b></p>${S.q.explain}</div>`);
  document.getElementById('acts').innerHTML=`<button class="btn primary" data-act="next" data-primary>Question suivante</button>`;
}
function nextTrain(){S.q=genQuestion(S.skill,S.level);qScreen();}

function evalStart(){
  const lvl=S.level;
  // 10 questions : toutes les compétences, et deux fois celles qui ont deux étapes (a/an, phrase, épeler, pronoms)
  const skills=shuffle(['couleurs','animaux','a-an','a-an','decrire','decrire','epeler','epeler','pronoms','pronoms']);
  const mix=[1,2,1,2,1,2,2,1,2,1];
  const qs=skills.map((s,i)=>genQuestion(s,lvl===0?mix[i]:lvl));
  S={screen:'eval',mode:'eval',evalLevel:lvl,level:lvl,qs,i:0,total:qs.length,results:[],t0:Date.now(),
    cle:window.miniprof?window.miniprof.debutEvaluation(lvl):null};
  S.q=qs[0];qScreen();
}
function checkEval(){
  if(!S.choice){setFb('<div class="fb hint">Choisis une réponse avant de continuer.</div>');return;}
  S.results.push({q:S.q,ans:S.choice,ok:S.choice===S.q.exp.c,duree:secs(S.q)});
  S.i++;
  if(S.i>=S.total){evalEnd();return;}
  S.q=S.qs[S.i];qScreen();
}
const lblOf=(q,v)=>{const c=q.choices.find(c=>c.v===v);return c?c.label:'';};
function evalEnd(){
  const res=S.results,score=res.filter(r=>r.ok).length,total=res.length;
  const duree=Math.round((Date.now()-S.t0)/1000);
  const sk={};
  res.forEach(r=>{const s=sk[r.q.skill]||(sk[r.q.skill]=[0,0]);s[1]++;if(r.ok)s[0]++;});
  // l'évaluation est enregistrée d'un bloc à la fin : abandonnée au milieu, elle ne compte pas
  if(window.miniprof)window.miniprof.reponse(res.map(r=>({competence:r.q.skill,juste:r.ok,mode:'v',difficulte:r.q.level,
    question:r.q.skill,reponse:r.ans,duree:r.duree,evaluation:S.cle})));
  let weakest=null,wp=2;for(const k in sk){const p=sk[k][0]/sk[k][1];if(p<wp){wp=p;weakest=k;}}
  const msg=score>=9?"Excellent! Tu maîtrises ta leçon.":score>=7?"Très bien ! Il ne reste que quelques détails à revoir.":score>=5?"Bon début. Regarde les corrections, puis entraîne-toi encore un peu.":"Pas de panique : relis les fiches Apprendre, puis entraîne-toi.";
  const bars=Object.keys(sk).map(k=>{const p=Math.round(100*sk[k][0]/sk[k][1]);return `<div><div class="row" style="justify-content:space-between"><span>${SKILLS[k].label}</span><b>${sk[k][0]}/${sk[k][1]}</b></div><div class="bar"><i class="${p<50?'low':p<80?'mid':''}" style="width:${p}%"></i></div></div>`;}).join('');
  const rev=res.map((r,i)=>`<details class="rev ${r.ok?'okk':'koo'}"><summary>${r.ok?'✓':'✗'} Question ${i+1} : ${SKILLS[r.q.skill].label}</summary>
    <div class="q-prompt">${r.q.prompt}</div>
    <p>Ta réponse :</p><div class="ans">${lblOf(r.q,r.ans)}</div>
    ${r.ok?'':`<p>Bonne réponse :</p><div class="ans good">${lblOf(r.q,r.q.exp.c)}</div>`}
    <div class="fb info">${r.q.explain}</div></details>`).join('');
  S.screen='result';S.weakest=weakest;
  show(`${topbar('Résultat','home')}<main class="wrap">
    <div class="card center"><div class="score">${score}<span style="font-size:1.6rem;color:var(--muted)"> / ${total}</span></div>
      <p style="margin-top:10px">${msg}</p><p class="small">Temps : ${Math.floor(duree/60)} min ${duree%60} s</p></div>
    <h2>Par compétence</h2><div style="margin-top:10px">${bars}</div>
    <h2 style="margin:16px 0 6px">Les corrections</h2>${rev}
    <div class="btns">
      ${weakest&&wp<1?`<button class="btn primary" data-act="trainWeak" data-primary>Travailler : ${SKILLS[weakest].label}</button>`:''}
      <button class="btn" data-act="evalSetup">Recommencer</button><button class="btn" data-act="bilan">Mon bilan</button><button class="btn ghost" data-act="home">Accueil</button>
    </div></main>`);
}

/* ================= bilan ================= */
function bilan(){
  const m=window.miniprof;
  if(m)location.href=m.racine+'#/module/'+encodeURIComponent(m.module)+'/bilan';
}

/* ================= actions ================= */
function act(a,el){
  switch(a){
    case 'home':home();break;
    case 'heroCol':heroCol=el.dataset.v;document.getElementById('heroTip').textContent=`${COL[heroCol].fr} = ${heroCol}`;break;
    case 'learn':learn(0);break;
    case 'lchoose':learnChoose(el);break;
    case 'lnext':if(S.ls<LEARN.length-1){S.ls++;renderLearn();}break;
    case 'trainSetup':trainSetup(false);break;
    case 'lvl':S.level=Number(el.dataset.v);if(S.screen==='trainSetup')trainSetup(true);else evalSetup(true);break;
    case 'sk':S.skill=el.dataset.v;S.skillPref=S.skill;trainSetup(true);break;
    case 'trainStart':S={screen:'train',mode:'train',level:S.level,skill:S.skill,skillPref:S.skill,tried:0,okCount:0,streak:0};nextTrain();break;
    case 'trainWeak':S={screen:'train',mode:'train',level:1,skill:S.weakest,skillPref:S.weakest,tried:0,okCount:0,streak:0};nextTrain();break;
    case 'levelup':S.level=2;S.streak=0;nextTrain();break;
    case 'evalSetup':evalSetup(false);break;
    case 'evalStart':evalStart();break;
    case 'quitEval':evalSetup(false);break;
    case 'choose':S.choice=el.dataset.v;app.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c===el));break;
    case 'check':S.mode==='eval'?checkEval():checkTrain();break;
    case 'hint':document.getElementById('hint').innerHTML=`<div class="fb hint"><p><b>Indice</b></p>${S.q.hint}</div>`;break;
    case 'reveal':revealTrain();break;
    case 'next':nextTrain();break;
    case 'bilan':bilan();break;
  }
}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t);});
// Tirage automatique (tools/tirage.py) : la page donne ses générateurs au lieu de s'afficher.
if(window.__miniprofTirage){window.__miniprofTirage({GEN,LEVELS,LEARN,SKILLS});return;}
home();

})();
</script>
