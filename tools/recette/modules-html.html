<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Recette modules HTML</title></head><body>
<!-- Recette automatique des modules HTML (contrat js/suivi.js) et non-régression de l'app.
     Lancée par tools/recette_navigateur.py, qui sert cette page à la racine du site
     (/__recette.html) : elle partage donc le localStorage de l'app et des modules.
     Chaque vérification renvoie une ligne « OK » ou « ECHEC » au serveur ; « FIN » à la fin.
     Le navigateur a un profil neuf à chaque lancement : localStorage vide au départ. -->
<iframe id="f" style="width:420px;height:800px"></iframe><pre id="out"></pre>
<script>
const out=[];const log=(ok,t)=>{out.push((ok?'OK   ':'ECHEC ')+t);fetch('/__resultat',{method:'POST',body:out.join('\n')});};
const f=document.getElementById('f');const ID='sciences-6e-circuit-electrique';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const charger=async(url)=>{f.src='about:blank';await new Promise(r=>f.onload=r);f.src=url;await new Promise(r=>f.onload=r);await sleep(800);return f.contentDocument;};
const clic=(d,sel)=>{const b=d.querySelector(sel);if(!b)throw new Error('absent : '+sel);b.click();};
// répond à la question affichée : un choix, ou (question à dessiner) un fil posé sur la grille
const repondre=d=>{const t=d.querySelector('[data-act="seg"]');if(t)t.dispatchEvent(new MouseEvent('click',{bubbles:true}));else clic(d,'.choice');};
const accueil=d=>{for(let i=0;i<4&&!d.querySelector('.menu');i++)clic(d,'.topbar .back');if(!d.querySelector('.menu'))throw new Error('accueil introuvable');};
const ev=()=>JSON.parse(localStorage.getItem('miniprof.v1.events.ptest')||'[]');
(async()=>{try{
  localStorage.clear();
  localStorage.setItem('miniprof.v1.profiles',JSON.stringify([{id:'ptest',name:'Léa'}]));
  localStorage.setItem('miniprof.v1.current',JSON.stringify('ptest'));
  const actif=(ago=0)=>localStorage.setItem('miniprof.v1.derniere_activite',JSON.stringify(Math.floor(Date.now()/1000)-ago));
  actif();
  let d=await charger('modules/'+ID+'.html');
  const w=f.contentWindow;
  log(!!w.miniprof,'window.miniprof chargé');
  log(w.miniprof&&w.miniprof.module===ID,'id lu dans la fiche');
  const bloque=await w.fetch('/index.html').then(()=>false,()=>true);
  log(bloque,'CSP : fetch depuis la page bloqué');
  log(d.querySelectorAll('svg').length>0,'schémas SVG affichés ('+d.querySelectorAll('svg').length+')');
  const b=d.querySelector('.miniprof-bandeau');
  log(b&&b.textContent.includes('Tu es Léa'),'bandeau : '+(b&&b.textContent));
  log(b&&[...b.querySelectorAll('a')].some(a=>a.href.endsWith('/#/module/'+ID+'/bilan')),'lien bilan du bandeau');
  // entraînement : 6 questions
  clic(d,'[data-act="trainSetup"]');clic(d,'[data-act="trainStart"]');
  for(let i=0;i<6;i++){repondre(d);clic(d,'[data-act="check"]');
    if(!d.querySelector('[data-act="next"]'))clic(d,'[data-act="reveal"]');clic(d,'[data-act="next"]');}
  let e=ev();
  log(e.length===6,'entraînement : 6 événements (trouvé '+e.length+')');
  log(e.every(l=>l[1]===ID&&l[5]==='e'&&l[9]===null&&typeof l[3]==='string'&&(l[4]===1)),'format entraînement : '+JSON.stringify(e[0]));
  // évaluation niveau Match (2)
  accueil(d);clic(d,'[data-act="evalSetup"]');clic(d,'[data-act="lvl"][data-v="2"]');clic(d,'[data-act="evalStart"]');
  for(let i=0;i<10;i++){repondre(d);clic(d,'[data-act="check"]');}
  log(!!d.querySelector('.score'),'écran de résultat de la page : '+(d.querySelector('.score')||{}).textContent);
  e=ev().filter(l=>l[5]==='v');
  log(e.length===10,'évaluation : 10 événements (trouvé '+e.length+')');
  log(e.length&&e.every(l=>l[9]===e[0][9])&&/^\d+\/2$/.test(e[0][9]),'clé commune : '+(e[0]||[])[9]);
  // signaler un problème (plan P003) : confirmation Oui / Non, copie de la question, commentaire facultatif
  const sg=()=>JSON.parse(localStorage.getItem('miniprof.v1.signalements')||'[]');
  accueil(d);clic(d,'[data-act="trainSetup"]');clic(d,'[data-act="trainStart"]');
  clic(d,'[data-act="sig"]');
  log(!!d.querySelector('[data-act="sigyes"]')&&!!d.querySelector('[data-act="signo"]'),'signaler : confirmation Oui / Non');
  clic(d,'[data-act="signo"]');
  log(sg().length===0&&d.getElementById('sig').innerHTML==='','signaler : « Non » n\'enregistre rien');
  repondre(d);clic(d,'[data-act="sig"]');clic(d,'[data-act="sigyes"]');
  log(sg().length===1&&sg()[0].module===ID&&sg()[0].enonce.length>0&&sg()[0].profil==='ptest','signaler : copie de la question : '+JSON.stringify(sg()[0]).slice(0,200));
  d.getElementById('sigtxt').value='la réponse est fausse';clic(d,'[data-act="sigsend"]');
  log(sg().length===1&&sg()[0].commentaire==='la réponse est fausse','signaler : commentaire ajouté au même signalement');
  log(ev().filter(l=>l[5]==='e').length===6,'signaler : n\'ajoute aucun événement au journal');
  // bouton Mon bilan -> miniprof
  accueil(d);clic(d,'[data-act="bilan"]');await sleep(1500);
  log(f.contentWindow.location.hash==='#/module/'+ID+'/bilan','bouton Mon bilan -> '+f.contentWindow.location.href);
  d=f.contentDocument;const txt=d.getElementById('app').textContent;
  log(txt.includes('Bilan de Léa'),'bilan miniprof affiché');
  log(txt.includes('16 questions traitées'),'synthèse : '+(d.querySelector('.report-summary')||{}).textContent);
  log(txt.includes('Les symboles')||txt.includes('Le court-circuit'),'libellés des compétences lus dans l\'index');
  log(txt.includes('Niveau 2'),'évaluation listée');
  const back=d.querySelector('.btn-back');log(back&&back.getAttribute('href')==='modules/'+ID+'.html','retour -> '+(back&&back.getAttribute('href')));
  const tr=[...d.querySelectorAll('a.btn-primary')].map(a=>a.getAttribute('href'));
  log(tr.every(h=>h==='modules/'+ID+'.html'),'« Travailler ce point » -> page ('+tr.length+' liens)');
  // bibliothèque
  d=await charger('index.html#/biblio');await sleep(800);
  const cartes=[...d.querySelectorAll('a.card-link')].map(a=>a.getAttribute('href'));
  log(cartes.includes('modules/'+ID+'.html'),'bibliothèque : carte du module HTML');
  log(cartes.includes('#/module/maths-cm2-division-euclidienne'),'bibliothèque : modules JSON toujours là');
  // brouillon (modules/brouillons.json, simulé par le serveur) : caché aux enfants, gardé dans le bilan
  await fetch('/__brouillon',{method:'POST',body:'maths-cm2-grands-nombres'});
  d=await charger('index.html#/biblio');await sleep(800);
  const cartesB=[...d.querySelectorAll('a.card-link')].map(a=>a.getAttribute('href'));
  log(!cartesB.includes('#/module/maths-cm2-grands-nombres')&&cartesB.includes('#/module/maths-cm2-division-euclidienne'),'brouillon absent de la bibliothèque, autres modules présents');
  // non-régression : un module JSON s'ouvre et s'entraîne
  d=await charger('index.html#/module/maths-cm2-division-euclidienne');await sleep(800);
  log(!d.getElementById('app').textContent.includes('illisible')&&d.querySelectorAll('a.card-link, a.card').length>0,'accueil du module JSON : '+d.getElementById('app').textContent.slice(0,80));
  d=await charger('index.html#/bilan');await sleep(800);
  log(d.getElementById('app').textContent.includes('Le circuit électrique'),'bilan tous modules : titre du module HTML');
  // signaler un problème dans un module JSON : question retirée du tirage, copie gardée, commentaire facultatif
  const qv=await import('/js/question-view.js');
  const idJ='maths-cm2-division-euclidienne';
  const modJ=await fetch('modules/'+idJ+'.json').then(r=>r.json());
  const qJ=modJ.questions.find(x=>x.type==='choice')||modJ.questions[0];
  const zoneJ=qv.boutonSignaler(idJ,qJ,'ma réponse');document.body.append(zoneJ);
  zoneJ.querySelector('button').click();
  const flags=JSON.parse(localStorage.getItem('miniprof.v1.flags')||'[]');
  log(flags.length===1&&flags[0][0]===idJ&&flags[0][1]===qJ.id,'module JSON : question signalée (flags inchangé) : '+JSON.stringify(flags[0]));
  log(sg().length===2&&sg()[1].question===qJ.id&&sg()[1].reponse==='ma réponse'&&sg()[1].attendue.length>0,'module JSON : copie gardée : '+JSON.stringify(sg()[1]).slice(0,160));
  zoneJ.querySelector('input').value='il manque un cas';zoneJ.querySelector('.signalement-commentaire button').click();
  log(sg()[1].commentaire==='il manque un cas','module JSON : commentaire ajouté');
  zoneJ.remove();
  // sauvegarde : le nouveau champ voyage, les anciens fichiers restent lisibles
  const bk=await import('/js/backup.js');
  const sauv=bk.buildBackup();
  log(Array.isArray(sauv.signalements)&&sauv.signalements.length===2,'export : signalements inclus');
  const ancien={...sauv};delete ancien.signalements;
  log(bk.checkBackup(ancien).ok&&bk.checkBackup(sauv).ok&&!bk.checkBackup({...sauv,signalements:'x'}).ok,'sauvegarde : ancien fichier accepté, champ abîmé refusé');
  bk.restoreBackup(ancien);
  log(sg().length===0&&JSON.parse(localStorage.getItem('miniprof.v1.flags')).length===1&&ev().length>0,'restauration d\'un ancien fichier : questions et résultats gardés, signalements vides');
  bk.restoreBackup(sauv);
  log(sg().length===2,'restauration d\'un fichier récent : signalements rétablis');
  // partage du système (simulé : le navigateur de recette ne partage pas de fichiers)
  const pa=await import('/js/partage.js');
  localStorage.setItem('miniprof.v1.last_export','1');
  navigator.canShare=()=>true;
  let envoye=null;navigator.share=async dn=>{envoye=dn;};
  const lancer=()=>new Promise(r=>pa.partagerSauvegarde((res,ok)=>r([res,ok])));
  let rp=await lancer();
  log(pa.peutPartager()&&rp[0]==='ok'&&rp[1]===true&&envoye&&envoye.files[0].name.endsWith('.export.json'),'partage : fichier .export.json envoyé à la feuille de partage');
  const apres=JSON.parse(localStorage.getItem('miniprof.v1.last_export'));
  log(typeof apres==='number'&&apres>1,'partage abouti : date du dernier export notée ('+apres+')');
  localStorage.setItem('miniprof.v1.last_export','1');
  navigator.share=async()=>{const e=new Error('annulé');e.name='AbortError';throw e;};
  rp=await lancer();
  log(rp[0]==='annule'&&localStorage.getItem('miniprof.v1.last_export')==='1','partage annulé : date du dernier export inchangée');
  navigator.share=async()=>{throw new Error('boum');};
  rp=await lancer();
  log(rp[0]==='erreur'&&localStorage.getItem('miniprof.v1.last_export')==='1','partage en erreur : signalé, date inchangée');
  navigator.canShare=undefined;navigator.share=undefined;
  log(pa.peutPartager()===false,'sans partage de fichiers : repli sur le téléchargement');
  // « Qui utilise miniprof ? » après 30 minutes (plan P008). Le délai est simulé en reculant la
  // dernière activité. Sans profil : choix du profil, puis retour à la page du module.
  const retourHash=()=>decodeURIComponent((f.contentWindow.location.hash.split('retour=')[1]||''));
  localStorage.removeItem('miniprof.v1.current');const n=ev().length;
  d=await charger('modules/'+ID+'.html');
  log(!f.contentWindow.location.pathname.endsWith('.html')&&retourHash()==='modules/'+ID+'.html','sans profil : page du module -> choix du profil, retour prévu : '+f.contentWindow.location.hash);
  clic(d,'.btn-big');await sleep(1500);
  log(f.contentWindow.location.pathname.endsWith('/'+ID+'.html')&&f.contentWindow.miniprof&&f.contentWindow.miniprof.profil()==='Léa','profil choisi -> retour à la page du module');
  log(f.contentWindow.miniprof.reponse({competence:'serie',juste:true})===true&&ev().length===n+1,'profil actif : la réponse est enregistrée');
  actif(25*60);d=await charger('modules/'+ID+'.html');
  log(f.contentWindow.location.pathname.endsWith('/'+ID+'.html')&&!!f.contentWindow.miniprof.profil(),'25 min sans utilisation : profil gardé');
  actif(31*60);d=await charger('modules/'+ID+'.html');
  log(!f.contentWindow.location.pathname.endsWith('.html')&&retourHash()==='modules/'+ID+'.html','31 min sans utilisation : profil redemandé, retour prévu : '+f.contentWindow.location.hash);
  log(JSON.parse(localStorage.getItem('miniprof.v1.current'))==='ptest','le profil courant n\'est pas effacé (aucune migration)');
  // page restée ouverte plus de 30 minutes : la réponse suivante n'est pas enregistrée
  actif();d=await charger('modules/'+ID+'.html');const m0=ev().length;
  actif(31*60);
  log(f.contentWindow.miniprof.reponse({competence:'serie',juste:true})===false&&ev().length===m0,'page restée ouverte : réponse refusée');
  clic(d,'[data-act="trainSetup"]');await sleep(1500);
  log(!f.contentWindow.location.pathname.endsWith('.html')&&retourHash()==='modules/'+ID+'.html'&&ev().length===m0,'page restée ouverte : le toucher envoie vers le choix du profil, rien d\'enregistré');
  // lien direct vers un module JSON : choix, puis retour à ce module
  actif(31*60);d=await charger('index.html#/module/maths-cm2-division-euclidienne');
  log(f.contentWindow.location.hash.startsWith('#/?retour=')&&retourHash()==='#/module/maths-cm2-division-euclidienne','lien direct (app) : choix du profil d\'abord : '+f.contentWindow.location.hash);
  clic(d,'.btn-big');await sleep(800);
  log(f.contentWindow.location.hash==='#/module/maths-cm2-division-euclidienne','lien direct (app) : retour au module après le choix');
  // adresse de retour piégée : refusée, on retombe sur la bibliothèque
  actif(31*60);d=await charger('index.html#/?retour='+encodeURIComponent('https://example.org/'));
  clic(d,'.btn-big');await sleep(800);
  log(f.contentWindow.location.hash==='#/biblio','adresse de retour d\'un autre site : ignorée');
  // page de l'app restée ouverte
  actif();d=await charger('index.html#/biblio');await sleep(500);
  actif(31*60);const carte=d.querySelector('a.card-link');carte.click();await sleep(800);
  log(f.contentWindow.location.hash.startsWith('#/?retour='),'app restée ouverte : le toucher suivant envoie vers le choix du profil : '+f.contentWindow.location.hash);
  actif();
  // création de profil : on entre directement dans le profil créé (retour du 1er essai sur iPhone)
  d=await charger('index.html#/');
  const ajouter=async nom=>{d.getElementById('nouveau-prenom').value=nom;d.querySelector('form.add-profile').requestSubmit();await sleep(800);d=f.contentDocument;};
  await ajouter('léa');
  log(d.getElementById('app').textContent.includes('existe déjà')&&d.getElementById('nouveau-prenom').value==='léa','profil en double : erreur, saisie gardée');
  await ajouter('Tom');
  const cree=JSON.parse(localStorage.getItem('miniprof.v1.profiles')).find(p=>p.name==='Tom');
  log(cree&&JSON.parse(localStorage.getItem('miniprof.v1.current'))===cree.id,'profil créé devenu le profil courant');
  log(f.contentWindow.location.hash==='#/biblio'&&d.getElementById('app').textContent.includes('Bonjour Tom'),'profil créé -> bibliothèque : '+f.contentWindow.location.hash);
}catch(err){log(false,'exception : '+err.message+' '+err.stack);}
await fetch('/__brouillon',{method:'POST',body:''});
fetch('/__resultat',{method:'POST',body:out.join('\n')+'\nFIN'});})();
</script></body></html>
